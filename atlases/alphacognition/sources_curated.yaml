# Hand-curated sources for AlphaCognition v0.1.
#
# This file is the AUTHORED half of evidence/sources/alphacognition.yaml.
# pipelines/alphacognition/build_sources.py concatenates it with the machine-generated
# fragments under pipelines/alphacognition/generated/ to produce that file. Editing
# evidence/sources/alphacognition.yaml directly would be overwritten; edit this instead.
#
# How each record was produced
# ----------------------------
# 1. The paper was found by an `mcp__plugin_bio-research_pubmed__search_articles` call in
#    this session (never from memory).
# 2. Its title / year / journal / first author were then read from NCBI ESummary
#    (db=pubmed) via scripts/_provenance.http_get_json, and the response was snapshotted
#    to data/raw/pubmed_esummary/2026-09-17/alphacog_curated_*.json. The strings below are
#    copied from that registry response, so scripts/fetch_source_metadata.py is verifying
#    against the same authority that supplied them.
# 3. NCT records come from https://clinicaltrials.gov/api/v2/studies/{NCT}; the titles
#    below are the `officialTitle` field of those responses.
#
# No abstract text is reproduced anywhere in this repository (contract §3).

