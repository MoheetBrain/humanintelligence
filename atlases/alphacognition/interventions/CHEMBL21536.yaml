notes:
- ChEMBL records BOTH M1 and M4 agonism with disease_efficacy true, so no cognitive effect of xanomeline
  can be attributed to CHRM1 alone.
- first_approval_year 2024 reflects approval of the xanomeline-trospium combination for schizophrenia,
  an indication with no cognitive endpoint. Approval is not evidence of cognitive enhancement.
- ChEMBL's disease_efficacy flag is a curation of the INTENDED mechanism, not of trial outcome.
- The oral monotherapy was abandoned on tolerability grounds; see CLM:alphacognition:CHRM1:003.
