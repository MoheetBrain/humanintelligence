known_gaps:
  - "No dedicated working-memory (n-back / digit-span) EFO term surfaced: `trait=working memory` returned 0 hits in GWAS Catalog v2. EFO_0004335 is the nearest substitute and is flagged as an approximation."
  - "No `fluid intelligence` term exists in the GWAS Catalog trait vocabulary (0 hits); UK Biobank's fluid test is filed under EFO_0008394."
  - "No far-transfer, metacognition or learning-rate endpoints exist in this vocabulary at all, so the contract's `far_transfer`, `metacognition` and `learning_rate` phenotype classes are unreachable from GWAS data. Those facets cannot be supported by human genetics in v0.1 and must stay `not_assessed` rather than be inferred."
  - "Substring search cannot prove completeness: a cognitive trait whose label shares no substring with the 21 probes used here would be missed. The probe list is recorded above so the search can be extended rather than repeated blindly."
