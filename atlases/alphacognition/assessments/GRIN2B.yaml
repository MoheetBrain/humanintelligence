# Facet assessment — generated file.
# The four genetics facets are produced deterministically by
# pipelines/alphacognition/build_assessments.py from the derived tables under
# data/interim/; the level rules are in that script's docstring. Lead-atlas facets, where
# present, are hand-written in atlases/alphacognition/lead_atlas_facets.yaml and merged in.
# Re-run the script rather than editing this file.
#
# Sprint 2 (2026-09-18): agent:orchestrator added reporting_gap_refs to
# human_intervention_evidence from the Task-B target-directed registry search, and
# extended that facet's search_basis. No level and no counter_level was changed: a
# completed-but-unreported trial is a reporting gap, not a tested null.
# This file was re-emitted by a script, so inline comments below this point were lost;
# the record content is unchanged apart from the two fields named above.
target_id: TGT:GRIN2B
schema_version: 0.1.0
assessed_by: agent:alphacognition
assessed_on: '2026-09-17'
rubric: facet_rubric_v0_1
scale: evidence_strength_v1
facets:
- facet: human_genetic_association
  assessment_status: assessed
  level: 3
  rationale: 2 catalogued genome-wide association record(s) on a g_factor or fluid_reasoning trait (cognitive
    function measurement, intelligence) across 2 publication(s); one human genetic result with a directly
    relevant endpoint
  claim_refs:
  - CLM:alphacognition:gwas.GRIN2B:001
  - CLM:alphacognition:gwas.GRIN2B:003
  - CLM:alphacognition:gwas.GRIN2B:004
  - CLM:alphacognition:gwas.GRIN2B:005
  - CLM:alphacognition:gwas.GRIN2B:007
  - CLM:alphacognition:l2g.GRIN2B:001
  - CLM:alphacognition:l2g.GRIN2B:002
  - CLM:alphacognition:l2g.GRIN2B:003
  counter_level: 0
  counter_rationale: 'No study reporting a null or opposite-direction association for this gene on a panel
    trait was found by this sweep. That is a property of the sweep, not of the literature: the GWAS Catalog
    records associations that passed a significance threshold and does not record non-associations, so
    absence of a catalogued negative is uninformative and is recorded as 0 for that reason.'
  counter_claim_refs: []
  limiting_factor: 'level 4 is unreachable from this evidence: the catalogue''s `beta` field is heterogeneous
    free text and effect alleles are often reported as ''?'', so direction consistency across studies
    cannot be established. cognitive GWAS discovery samples are overwhelmingly European-ancestry, so neither
    the association nor any locus-to-gene assignment built on it is established as transportable.'
- facet: causal_gene_attribution
  assessment_status: assessed
  level: 1
  rationale: '3 primary cognitive-trait association record(s) exist, but attribution to this gene rests
    entirely on the GWAS Catalog''s positional (nearest-gene) annotation: locus_to_gene_resolved is ''no''
    on every one of them, and no fine-mapped credible set for a cognitive trait ranks this gene'
  claim_refs:
  - CLM:alphacognition:l2g.GRIN2B:002
  - CLM:alphacognition:gwas.GRIN2B:001
  - CLM:alphacognition:gwas.GRIN2B:003
  - CLM:alphacognition:gwas.GRIN2B:004
  - CLM:alphacognition:gwas.GRIN2B:005
  - CLM:alphacognition:gwas.GRIN2B:007
  counter_level: 0
  counter_rationale: no competing gene assignment was found, because no fine-mapped cognitive-trait credible
    set implicates this gene at all
  counter_claim_refs: []
  limiting_factor: a locus is not a gene; no fine-mapping or colocalisation evidence for this gene
- facet: human_phenotype_specificity
  assessment_status: assessed
  level: 2
  rationale: 3 primary cognitive-panel association(s) (2 directly relevant, 1 single-domain; plus 4 on
    supporting traits, which corroborate but cannot carry the grade) alongside 86 association(s) with
    76 distinct trait(s) outside the panel; cognition-specificity is qualified by that pleiotropy
  claim_refs:
  - CLM:alphacognition:gwas.GRIN2B:001
  - CLM:alphacognition:gwas.GRIN2B:002
  - CLM:alphacognition:gwas.GRIN2B:003
  - CLM:alphacognition:gwas.GRIN2B:004
  - CLM:alphacognition:gwas.GRIN2B:005
  - CLM:alphacognition:gwas.GRIN2B:006
  - CLM:alphacognition:gwas.GRIN2B:007
  counter_level: 0
  counter_rationale: No citable contradicting claim exists in this atlas for this facet. The observation
    that would have argued against it is recorded in limiting_factor instead, because a counter-grade
    may not rest on evidence no record identifies.
  counter_claim_refs: []
  limiting_factor: 'specificity is assessed from positional annotation, so ''this gene is pleiotropic''
    and ''this locus is gene-dense'' are not separated. Mendelian randomisation and pan-phenome gene-level
    testing were not run in v0.1. Uncited observation that would argue against this facet: the same positional
    locus carries 86 catalogued association(s) with 76 distinct non-cognitive trait(s), which argues against
    reading the cognitive hit as specific to this gene''s cognitive function'
- facet: adult_expression_and_timing
  assessment_status: assessed
  level: 2
  rationale: detected in all 13 sampled adult human brain regions (GTEx v8, adult post-mortem donors);
    direct human adult tissue measurement, but bulk-tissue resolution and no evidence that the gene's
    cognitive relevance extends into adulthood
  claim_refs:
  - CLM:alphacognition:expr.GRIN2B:001
  counter_level: 2
  counter_rationale: 'Two converging lines put GRIN2B''s cognitive role largely in development: rodent
    NMDA subunit composition shifts away from GluN2B across postnatal life (CLM:alphacognition:GRIN2B:006),
    and the entire human phenotype of GRIN2B perturbation is a neurodevelopmental encephalopathy, in six
    individuals with a malformation of cortical development (CLM:alphacognition:GRIN2B:004). Graded 2
    rather than 3 because the expression evidence is rodent, indirect and from a study designed for another
    purpose, and no human developmental transcriptome was ingested.'
  counter_claim_refs:
  - CLM:alphacognition:GRIN2B:006
  - CLM:alphacognition:GRIN2B:004
  limiting_factor: adult human brain CELL-TYPE resolution is unavailable in this release and is deferred
    to docs/TASK_DAG.yaml Q003; developmental timing was not ingested from any atlas. Level 4 is therefore
    unreachable for every target in v0.1.
- facet: mechanistic_causal_perturbation
  assessment_status: assessed
  level: 3
  rationale: 'Converging causal evidence across designs: independent transgenic overexpression studies
    from different groups agreeing in direction on behaviour and on synaptic potentiation, plus an adult
    acute peptide perturbation, plus a human monogenic series in which perturbing the gene changes cognition.
    Perturbing GRIN2B demonstrably changes cognition-relevant processes.'
  claim_refs:
  - CLM:alphacognition:GRIN2B:001
  - CLM:alphacognition:GRIN2B:002
  - CLM:alphacognition:GRIN2B:003
  - CLM:alphacognition:GRIN2B:004
  counter_level: 2
  counter_rationale: The human series found that BOTH gain-of-function and loss-of-function variants produce
    the same clinical direction (impairment), which is direct evidence against a monotonic mapping from
    GRIN2B function to cognitive ability. A causal control point whose perturbation in either direction
    is harmful is not a control knob.
  counter_claim_refs:
  - CLM:alphacognition:GRIN2B:004
  limiting_factor: every enhancement result is rodent; the human evidence runs the other way
- facet: adult_onset_perturbation
  assessment_status: assessed
  level: 1
  rationale: Only one adult-onset result was retrieved (CLM:alphacognition:GRIN2B:003), and it perturbs
    the Cdk5-NR2B interaction rather than GRIN2B itself, in a single study. The two enhancement studies
    both use constitutive transgenic overexpression from development.
  claim_refs:
  - CLM:alphacognition:GRIN2B:003
  counter_level: 1
  counter_rationale: The rodent developmental subunit switch (CLM:alphacognition:GRIN2B:006) is weak indirect
    evidence that the adult system is less GluN2B-dependent than the juvenile one, which would limit adult
    modifiability.
  counter_claim_refs:
  - CLM:alphacognition:GRIN2B:006
  limiting_factor: no adult-inducible genetic perturbation of GRIN2B itself was retrieved
- facet: above_baseline_enhancement
  assessment_status: assessed
  level: 2
  rationale: Two independent rodent studies report performance above a healthy wild-type baseline (learning
    and memory tasks; fear acquisition and LTP), i.e. replicated non-human causal evidence of supra-baseline
    effect.
  claim_refs:
  - CLM:alphacognition:GRIN2B:001
  - CLM:alphacognition:GRIN2B:002
  counter_level: 2
  counter_rationale: In humans the only available evidence on changing GRIN2B function is a neurodevelopmental
    disorder with intellectual disability; supra-normal potential is contradicted in the only species
    that matters for the project's goal.
  counter_claim_refs:
  - CLM:alphacognition:GRIN2B:004
  - CLM:alphacognition:GRIN2B:005
  limiting_factor: rodent wild-type baseline is not a human healthy-adult baseline
- facet: transfer_breadth
  assessment_status: assessed
  level: 1
  rationale: The founding study reports better performance across several behavioural tasks, which is
    some breadth, but all of them are rodent memory paradigms in one laboratory environment. Nothing resembling
    far transfer was retrieved.
  claim_refs:
  - CLM:alphacognition:GRIN2B:001
  counter_level: 0
  counter_rationale: searched; no study reporting failure to transfer across domains was found
  counter_claim_refs: []
  limiting_factor: no human cognitive battery, and no non-memory domain, was tested in any retrieved study
- facet: dose_response_knowledge
  assessment_status: assessed
  level: 0
  rationale: 'Searched: none of the retrieved GRIN2B studies characterises a dose-response or expression-response
    relation. Transgenic overexpression has one level; the peptide study reports no dose series in its
    abstract.'
  claim_refs:
  - CLM:alphacognition:gap.GRIN2B:002
  counter_level: 0
  counter_rationale: no evidence of a non-monotonic or bounded response was retrieved either
  counter_claim_refs: []
  limiting_factor: for a gene where excess function causes human disease, the absence of any dose-response
    characterisation is itself the most important gap
  search_basis: 'Searched: the retrieved studies for a dose series, an exposure-response relation or an
    expression-level-response relation with a cognitive readout. A hit would have been three or more exposure
    levels with a cognitive endpoint, or an explicitly characterised response shape.'
- facet: human_intervention_evidence
  assessment_status: assessed
  level: 0
  rationale: 'Searched: no human interventional study targeting GRIN2B for cognitive benefit was retrieved.
    The only treatment-adjacent human observation is that GRIN2B variant receptors retained in vitro sensitivity
    to memantine.'
  claim_refs:
  - CLM:alphacognition:gap.GRIN2B:002
  counter_level: 0
  counter_rationale: Nothing was found that TESTED a GRIN2B-directed intervention for cognitive benefit
    in humans and failed. The one treatment-adjacent human statement — that an objectifiable beneficial
    memantine response in GRIN2B patients remains to be demonstrated — is an ABSENCE OF MEASUREMENT, not
    a measured absence of effect, so under R5 it contributes no counter_level and is recorded as a coverage
    gap in limiting_factor instead.
  counter_claim_refs: []
  limiting_factor: 'coverage gap, not negative evidence: no human interventional study of GRIN2B for a
    cognitive endpoint has been performed. In vitro receptor sensitivity to memantine is not efficacy
    (rule V16), and the source itself says the clinical response is undemonstrated.'
  search_basis: 'Searched: PubMed for human interventional studies of this target with a cognitive endpoint,
    and ClinicalTrials.gov API v2 for registered trials. A hit would have been a randomised or open-label
    human study reporting a cognitive endpoint. A trial that measured no cognitive endpoint is a coverage
    gap, not a hit and not a miss (R5). Sprint-2 Task B additionally ran a target-directed ClinicalTrials.gov
    search (terms, per-term hit counts and full classification in evidence/registry_searches/GRIN2B.yaml),
    which the Sprint-1 grade did not have. It identified 2 completed trial(s) carrying a cognitive outcome
    measure with no posted results; those are in reporting_gap_refs and are NOT counter-evidence, because
    a trial that never reported cannot have failed.'
  reporting_gap_refs:
  - SRC:NCT:NCT00234637
  - SRC:NCT:NCT00334906
facets_not_owned_by_this_agent: []
notes: 'Evidence basis for the four genetics facets. Genes covered by this target: GRIN2B. GWAS Catalog
  release 2026-09-13, 24 panel terms of which 22 queried; Open Targets data version 26.06; GTEx dataset
  gtex_v8. Association records for this target: 13 total. Partitioned by the panel''s `use_in_ranking`
  field (fail-closed; see _common.trait_use): 2 on PRIMARY g_factor/fluid_reasoning traits, 1 on PRIMARY
  single-domain cognitive traits, 4 on `supporting` traits which may corroborate but never carry a grade
  alone (mathematical ability, visuospatial function measurement), and 6 on `proxy_only` traits which
  may not contribute to an intelligence-relevant facet at all (educational attainment, self reported educational
  attainment; 6 of them educational-attainment or literacy). Across 5 distinct publications (4 for the
  non-proxy associations). Traits hit: cognitive function measurement, intelligence, mathematical ability,
  reaction time measurement, visuospatial function measurement. Fine-mapped credible sets in which Open
  Targets'' L2G model ranks this gene: 5 in total, 0 on PRIMARY cognitive-panel traits (3 on supporting
  traits, 2 on proxy_only or unmapped traits, both excluded from the grade), with 0 molecular-QTL colocalisations
  for this gene at those loci and 0 competing candidate gene(s) there. Unfiltered GWAS Catalog sweep for
  this gene symbol: 99 catalogued association(s) in total, 86 of them with traits outside the cognitive/educational
  panel, spanning 76 distinct such trait(s). GTEx reports 13 brain region(s); detected above zero median
  in all of them: True. Adult brain cell-type resolution was not available in this release and is deferred
  to docs/TASK_DAG.yaml Q003. The level rules applied here are in pipelines/alphacognition/build_assessments.py;
  lead-atlas facets for this target are hand-written in atlases/alphacognition/lead_atlas_facets.yaml.'
