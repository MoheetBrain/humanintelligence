# Facet assessment — generated file.
# The four genetics facets are produced deterministically by
# pipelines/alphacognition/build_assessments.py from the derived tables under
# data/interim/; the level rules are in that script's docstring. Lead-atlas facets, where
# present, are hand-written in atlases/alphacognition/lead_atlas_facets.yaml and merged in.
# Re-run the script rather than editing this file.
target_id: TGT:GRM5
schema_version: 0.1.0
assessed_by: agent:alphacognition
assessed_on: '2026-09-17'
rubric: facet_rubric_v0_1
scale: evidence_strength_v1
facets:
- facet: human_genetic_association
  assessment_status: assessed
  level: 3
  rationale: 2 catalogued genome-wide association record(s) on a g_factor or fluid_reasoning trait (cognitive
    function measurement, intelligence) across 2 publication(s); one human genetic result with a directly
    relevant endpoint
  claim_refs:
  - CLM:alphacognition:gwas.GRM5:001
  - CLM:alphacognition:gwas.GRM5:002
  - CLM:alphacognition:l2g.GRM5:001
  - CLM:alphacognition:l2g.GRM5:002
  counter_level: 0
  counter_rationale: 'No study reporting a null or opposite-direction association for this gene on a panel
    trait was found by this sweep. That is a property of the sweep, not of the literature: the GWAS Catalog
    records associations that passed a significance threshold and does not record non-associations, so
    absence of a catalogued negative is uninformative and is recorded as 0 for that reason.'
  counter_claim_refs: []
  limiting_factor: 'level 4 is unreachable from this evidence: the catalogue''s `beta` field is heterogeneous
    free text and effect alleles are often reported as ''?'', so direction consistency across studies
    cannot be established. cognitive GWAS discovery samples are overwhelmingly European-ancestry, so neither
    the association nor any locus-to-gene assignment built on it is established as transportable.'
- facet: causal_gene_attribution
  assessment_status: assessed
  level: 2
  rationale: Open Targets' locus-to-gene model (data version 26.06) ranks this gene among the candidates
    at 1 fine-mapped credible set(s) for cognitive-panel traits, with 2 competing candidate gene(s) at
    the same loci (NOX4, TYR); no molecular-QTL colocalisation for this gene was found at those loci
  claim_refs:
  - CLM:alphacognition:l2g.GRM5:001
  - CLM:alphacognition:gwas.GRM5:001
  - CLM:alphacognition:gwas.GRM5:002
  counter_level: 2
  counter_rationale: 2 other gene(s) are ranked as candidates at the same cognitive-trait credible set(s),
    which is direct evidence against a confident assignment to this gene
  counter_claim_refs:
  - CLM:alphacognition:l2g.GRM5:001
  limiting_factor: attribution is a published statistical model's output with competing candidates and
    no QTL corroboration; not a demonstrated gene-level effect
- facet: human_phenotype_specificity
  assessment_status: assessed
  level: 2
  rationale: 2 cognitive-panel association(s) (2 directly relevant, 0 single-domain) alongside 183 association(s)
    with 80 distinct trait(s) outside the panel; cognition-specificity is qualified by that pleiotropy
  claim_refs:
  - CLM:alphacognition:gwas.GRM5:001
  - CLM:alphacognition:gwas.GRM5:002
  - CLM:alphacognition:gwas.GRM5:003
  counter_level: 0
  counter_rationale: No citable contradicting claim exists in this atlas for this facet. The observation
    that would have argued against it is recorded in limiting_factor instead, because a counter-grade
    may not rest on evidence no record identifies.
  counter_claim_refs: []
  limiting_factor: 'specificity is assessed from positional annotation, so ''this gene is pleiotropic''
    and ''this locus is gene-dense'' are not separated. Mendelian randomisation and pan-phenome gene-level
    testing were not run in v0.1. Uncited observation that would argue against this facet: the same positional
    locus carries 183 catalogued association(s) with 80 distinct non-cognitive trait(s), which argues
    against reading the cognitive hit as specific to this gene''s cognitive function'
- facet: adult_expression_and_timing
  assessment_status: assessed
  level: 2
  rationale: detected in all 13 sampled adult human brain regions (GTEx v8, adult post-mortem donors);
    direct human adult tissue measurement, but bulk-tissue resolution and no evidence that the gene's
    cognitive relevance extends into adulthood
  claim_refs:
  - CLM:alphacognition:expr.GRM5:001
  counter_level: 0
  counter_rationale: 'no evidence that this gene''s action is confined to development was retrieved. Developmental-restriction
    evidence was NOT systematically searched for this target: no human developmental transcriptome (BrainSpan/PsychENCODE)
    was ingested in v0.1, so this 0 means ''not found by the sweep that was run''.'
  counter_claim_refs: []
  limiting_factor: adult human brain CELL-TYPE resolution is unavailable in this release and is deferred
    to docs/TASK_DAG.yaml Q003; developmental timing was not ingested from any atlas. Level 4 is therefore
    unreachable for every target in v0.1.
- facet: mechanistic_causal_perturbation
  assessment_status: assessed
  level: 1
  rationale: One rodent pharmacological study in disease models, with an internally conflicting cognitive
    outcome (memory recovered in the acute amyloid-injection model, not in the chronic transgenic model).
  claim_refs:
  - CLM:alphacognition:GRM5:002
  counter_level: 1
  counter_rationale: The two directions of mGluR5 modulation are each claimed to be pro-cognitive in different
    contexts, which undermines any single causal account of mGluR5's contribution.
  counter_claim_refs:
  - CLM:alphacognition:GRM5:001
  - CLM:alphacognition:GRM5:002
  limiting_factor: no healthy-baseline perturbation of mGluR5 with a cognitive endpoint was retrieved
- facet: adult_onset_perturbation
  assessment_status: assessed
  level: 1
  rationale: adult and aged mice were dosed pharmacologically, so the perturbation is adult-onset, but
    in disease models with a partly null cognitive result
  claim_refs:
  - CLM:alphacognition:GRM5:002
  counter_level: 2
  counter_rationale: The human trial was deliberately run in 3-6 year olds because prior mGluR5 NAM trials
    in ADULTS had failed, and it was itself null. Adult human modifiability of cognition via mGluR5 has
    been tried and has not worked.
  counter_claim_refs:
  - CLM:alphacognition:GRM5:001
  limiting_factor: the earlier adult trials are known only through the FXLEARN paper's own statement,
    not from records retrieved here
- facet: above_baseline_enhancement
  assessment_status: assessed
  level: 0
  rationale: 'searched: no study of mGluR5 modulation in a healthy baseline with a cognitive endpoint
    was retrieved'
  claim_refs:
  - CLM:alphacognition:gap.GRM5:002
  counter_level: 2
  counter_rationale: A randomised human trial found no benefit even in a deficit population, and the rodent
    evidence is rescue-only. Supra-normal potential is unsupported and the deficit-state evidence is against
    it.
  counter_claim_refs:
  - CLM:alphacognition:GRM5:001
  - CLM:alphacognition:GRM5:002
  limiting_factor: no healthy-baseline study of any species was retrieved
  search_basis: 'Searched: PubMed for studies of this target reporting performance ABOVE an intact healthy
    baseline, in any species. A hit would have been a healthy-baseline arm improving on a cognitive measure;
    a deficit-state or disease-model improvement would NOT have counted.'
- facet: transfer_breadth
  assessment_status: assessed
  level: 0
  rationale: 'searched: nothing supporting breadth'
  claim_refs:
  - CLM:alphacognition:gap.GRM5:002
  counter_level: 2
  counter_rationale: The human trial found no significant between-group difference on the primary measure
    OR on any secondary cognitive or language measure. A multi-endpoint null is direct evidence against
    breadth.
  counter_claim_refs:
  - CLM:alphacognition:GRM5:001
  limiting_factor: the endpoints were language and communication measures in young children, not a general
    cognitive battery
  search_basis: 'Searched: the endpoint lists of every study retrieved for this target, for a second cognitive
    domain or an explicit transfer measure. A hit would have been improvement on two or more distinct
    cognitive domains, or on an untrained real-world endpoint.'
- facet: dose_response_knowledge
  assessment_status: assessed
  level: 1
  rationale: The human trial reports 2 months of dose optimisation to the maximum tolerated dose, which
    is dosing information but not an exposure-response relation for a cognitive endpoint.
  claim_refs:
  - CLM:alphacognition:GRM5:001
  counter_level: 0
  counter_rationale: no non-monotonic response evidence retrieved
  counter_claim_refs: []
  limiting_factor: titrating to tolerability rather than to a target exposure is one of the candidate
    explanations for the null
- facet: human_intervention_evidence
  assessment_status: assessed
  level: 0
  rationale: 'Searched: no human interventional evidence that modulating mGluR5 improves cognition was
    found. Level 0 rather than a low positive level is deliberate: the human evidence that exists is strong
    and points the other way, which the counter_level records.'
  claim_refs:
  - CLM:alphacognition:gap.GRM5:002
  counter_level: 3
  counter_rationale: A multisite randomised placebo-controlled trial (99 randomised, 91 completing the
    controlled period, NCT02920892) found no benefit on its primary or any secondary endpoint, and its
    authors conclude that the mechanism does not translate to the human population.
  counter_claim_refs:
  - CLM:alphacognition:GRM5:001
  limiting_factor: one indication (fragile X syndrome), one age group, one direction of modulation
  search_basis: 'Searched: PubMed for human interventional studies of this target with a cognitive endpoint,
    and ClinicalTrials.gov API v2 for registered trials. A hit would have been a randomised or open-label
    human study reporting a cognitive endpoint. A trial that measured no cognitive endpoint is a coverage
    gap, not a hit and not a miss (R5).'
facets_not_owned_by_this_agent: []
notes: 'Evidence basis for the four genetics facets. Genes covered by this target: GRM5. GWAS Catalog
  release 2026-09-13, 24 panel terms of which 22 queried; Open Targets data version 26.06; GTEx dataset
  gtex_v8. Association records for this target: 3 total, of which 2 on cognitive-panel traits (2 on a
  g_factor/fluid_reasoning trait, 0 single-domain) and 1 on educational-attainment or literacy traits,
  across 3 distinct publications (2 for the cognitive associations). Cognitive traits hit: cognitive function
  measurement, intelligence. Fine-mapped credible sets in which Open Targets'' L2G model ranks this gene:
  2 in total, 1 on cognitive-panel traits, with 0 molecular-QTL colocalisations for this gene at those
  loci and 2 competing candidate gene(s) there (NOX4, TYR). Unfiltered GWAS Catalog sweep for this gene
  symbol: 186 catalogued association(s) in total, 183 of them with traits outside the cognitive/educational
  panel, spanning 80 distinct such trait(s). GTEx reports 13 brain region(s); detected above zero median
  in all of them: True. Adult brain cell-type resolution was not available in this release and is deferred
  to docs/TASK_DAG.yaml Q003. The level rules applied here are in pipelines/alphacognition/build_assessments.py;
  lead-atlas facets for this target are hand-written in atlases/alphacognition/lead_atlas_facets.yaml.'
