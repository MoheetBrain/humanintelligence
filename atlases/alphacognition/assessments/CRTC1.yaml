  gtex_v8. Association records for this target: 2 total, of which 1 on cognitive-panel traits (1 on a
  g_factor/fluid_reasoning trait, 0 single-domain) and 1 on educational-attainment or literacy traits,
  across 2 distinct publications (1 for the cognitive associations). Cognitive traits hit: mathematical
  ability. Fine-mapped credible sets in which Open Targets'' L2G model ranks this gene: 2 in total, 1
  on cognitive-panel traits, with 0 molecular-QTL colocalisations for this gene at those loci and 0 competing
  candidate gene(s) there. Unfiltered GWAS Catalog sweep for this gene symbol: 149 catalogued association(s)
  in total, 147 of them with traits outside the cognitive/educational panel, spanning 58 distinct such
  trait(s). GTEx reports 13 brain region(s); detected above zero median in all of them: True. Adult brain
  cell-type resolution was not available in this release and is deferred to docs/TASK_DAG.yaml Q003. The
  level rules applied here are in pipelines/alphacognition/build_assessments.py; lead-atlas facets for
  this target are hand-written in atlases/alphacognition/lead_atlas_facets.yaml.'
