  trait, 0 single-domain) and 0 on educational-attainment or literacy traits, across 5 distinct publications
  (5 for the cognitive associations). Cognitive traits hit: cognitive function measurement, intelligence.
  Fine-mapped credible sets in which Open Targets'' L2G model ranks this gene: 15 in total, 13 on cognitive-panel
  traits, with 0 molecular-QTL colocalisations for this gene at those loci and 5 competing candidate gene(s)
  there (BAG5, COA8, KLC1, MARK3, TRMT61A). Unfiltered GWAS Catalog sweep for this gene symbol: 33 catalogued
  association(s) in total, 28 of them with traits outside the cognitive/educational panel, spanning 15
  distinct such trait(s). GTEx reports 13 brain region(s); detected above zero median in all of them:
