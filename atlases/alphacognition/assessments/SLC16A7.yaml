notes: 'Evidence basis for the four genetics facets. Genes covered by this target: SLC16A7. GWAS Catalog
  release 2026-09-13, 24 panel terms of which 22 queried; Open Targets data version 26.06; GTEx dataset
  gtex_v8. Association records for this target: 8 total. Partitioned by the panel''s `use_in_ranking`
  field (fail-closed; see _common.trait_use): 1 on PRIMARY g_factor/fluid_reasoning traits, 0 on PRIMARY
  single-domain cognitive traits, 6 on `supporting` traits which may corroborate but never carry a grade
  alone (mathematical ability, memory performance), and 1 on `proxy_only` traits which may not contribute
  to an intelligence-relevant facet at all (educational attainment; 1 of them educational-attainment or
  literacy). Across 4 distinct publications (3 for the non-proxy associations). Traits hit: cognitive
  function measurement, mathematical ability, memory performance. Fine-mapped credible sets in which Open
  Targets'' L2G model ranks this gene: 7 in total, 0 on PRIMARY cognitive-panel traits (4 on supporting
  traits, 3 on proxy_only or unmapped traits, both excluded from the grade), with 0 molecular-QTL colocalisations
  for this gene at those loci and 0 competing candidate gene(s) there. Unfiltered GWAS Catalog sweep for
  this gene symbol: 51 catalogued association(s) in total, 43 of them with traits outside the cognitive/educational
  panel, spanning 34 distinct such trait(s). GTEx reports 13 brain region(s); detected above zero median
  in all of them: True. Adult brain cell-type resolution was not available in this release and is deferred
  to docs/TASK_DAG.yaml Q003. The level rules applied here are in pipelines/alphacognition/build_assessments.py;
  lead-atlas facets for this target are owned by agent:power and are not graded here.'
