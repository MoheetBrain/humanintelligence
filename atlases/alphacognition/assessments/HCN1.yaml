notes: 'Evidence basis for the four genetics facets. Genes covered by this target: HCN1. GWAS Catalog
  release 2026-09-13, 24 panel terms of which 22 queried; Open Targets data version 26.06; GTEx dataset
  gtex_v8. Association records for this target: 7 total, of which 3 on cognitive-panel traits (2 on a
  g_factor/fluid_reasoning trait, 1 single-domain) and 4 on educational-attainment or literacy traits,
  across 6 distinct publications (3 for the cognitive associations). Cognitive traits hit: cognitive function
  measurement, intelligence, memory performance. Fine-mapped credible sets in which Open Targets'' L2G
  model ranks this gene: 4 in total, 2 on cognitive-panel traits, with 0 molecular-QTL colocalisations
  for this gene at those loci and 1 competing candidate gene(s) there (MRPS30). Unfiltered GWAS Catalog
  sweep for this gene symbol: 216 catalogued association(s) in total, 210 of them with traits outside
  the cognitive/educational panel, spanning 89 distinct such trait(s). GTEx reports 13 brain region(s);
  detected above zero median in all of them: True. Adult brain cell-type resolution was not available
  in this release and is deferred to docs/TASK_DAG.yaml Q003. The level rules applied here are in pipelines/alphacognition/build_assessments.py;
  lead-atlas facets for this target are owned by agent:brakes and are not graded here.'
