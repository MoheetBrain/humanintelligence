# Comparative Intelligence 2.0 — orthology AVAILABILITY audit.
#
# Generated by pipelines/comparative/orthology_audit.py from Ensembl Compara, with every
# response snapshotted to data/raw/ensembl_compara/ and checksummed in MANIFEST.jsonl.
# Do not hand-edit; re-run the pipeline.
#
# WHAT THIS ANSWERS, AND ONLY THIS
# --------------------------------
#   In which species is a cross-species comparison of this gene even POSSIBLE?
#
# An orthologue is a statement about shared ancestry. It is NOT evidence about function,
# and a one-to-one orthologue in a crow would not mean the gene does the same job in a
# pallium as it does in a neocortex. This file contains no evidence about cognition and
# supports no claim about any target.
#
# THE THREE READINGS THIS FILE REFUSES
# ------------------------------------
# 1. `no_call` is NOT gene absence. It can mean the species is missing from Compara, the
#    assembly is fragmentary at that locus, or the gene tree could not be resolved.
#    Assembly quality predicts gene absence far better than biology does, and this panel
#    spans GRCh38.p14 to turTru1, a low-coverage draft. Every no_call is not_assessable.
# 2. `query_status: failed` is NOT absence of anything. Six genes errored (timeouts and
#    HTTP failures). They are recorded as failures, not as genes without orthologues.
# 3. No avian statement may be drawn from these rows in either direction. Both avian
#    convergence candidates are absent from Compara; the two birds present are the
#    CONTROLS. See species_registry.yaml -> avian_arm_is_unavailable.

