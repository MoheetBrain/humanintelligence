facets:
- facet: mechanistic_causal_perturbation
  assessment_status: assessed
  level: 2
  rationale: Multiple independent mouse lines and an adult pharmacological blockade converge on the same
    molecular role in restricting plasticity, which meets the moderate criterion for replicated non-human
    causal evidence.
  claim_refs:
  - CLM:brakes:RTN4R:001
  - CLM:brakes:RTN4R:004
  counter_level: 3
  counter_rationale: Two independent loss-of-function lines, a null and a ligand-binding-site missense
    mutant, both showed cognitive impairment rather than improvement; the missense study's authors explicitly
    declined to support the gene as a strong risk factor.
  counter_claim_refs:
  - CLM:brakes:RTN4R:002
  - CLM:brakes:RTN4R:003
  limiting_factor: the plasticity evidence and the cognitive evidence come from different endpoints and
    point in opposite directions
- facet: adult_onset_perturbation
  assessment_status: assessed
  level: 2
  rationale: Intracerebroventricular delivery of a function-blocking receptor fragment starting a week
    after arterial occlusion promoted axonal sprouting and motor recovery in adult rats, which is an adult-onset
    pharmacological perturbation with a delayed start.
  claim_refs:
  - CLM:brakes:RTN4R:004
  counter_level: 0
  counter_rationale: No located study reports that adult blockade fails to engage the pathway.
  counter_claim_refs: []
  limiting_factor: adult efficacy is demonstrated only for repair after injury, with a motor endpoint
    and an invasive route
- facet: above_baseline_enhancement
  assessment_status: assessed
  level: 0
  rationale: No located study reports cognitive improvement above baseline from reducing RTN4R function.
  search_basis: 'PubMed keyword searches pairing RTN4R, NgR1 and Nogo receptor with knockout, plasticity,
    adult and memory terms. A hit would have been any cognitive measure raised above a healthy baseline
    by reducing NgR1 function. Scope limit: the proposition was tested twice and contradicted twice, by
    a null line and by a ligand-binding-site missense line; the adult plasticity result that does exist
    changed the plasticity rule rather than a measured capacity.'
  claim_refs: []
  counter_level: 3
  counter_rationale: Working memory was reduced in NgR1-null mice and spatial cognition mildly impaired
    in a missense line, so two independent perturbations tested the proposition and contradicted it.
  counter_claim_refs:
  - CLM:brakes:RTN4R:002
  - CLM:brakes:RTN4R:003
  limiting_factor: the enhancement proposition has been tested twice and failed twice
