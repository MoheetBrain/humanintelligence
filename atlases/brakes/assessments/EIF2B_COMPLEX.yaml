- facet: human_intervention_evidence
  assessment_status: assessed
  level: 0
  rationale: 'Searched and found no human interventional study of eIF2B activation with a cognitive endpoint.
    A 249-participant phase 2/3 regimen of an eIF2B activator was located and verified, but it specifies
    motor-function and mortality outcomes and no cognitive endpoint. That absence is recorded as the coverage
    gap CLM:brakes:EIF2B_COMPLEX:004 (claim_type evidence_gap), which is graph-inert and is deliberately
    NOT cited as a claim_ref here and NOT counted as counter-evidence: an endpoint that was never measured
    is neither support nor refutation (rules V16b, V16c).'
  search_basis: 'PubMed keyword searches on ISRIB, eIF2B activators and integrated-stress-response inhibition
    with memory and cognition terms, plus a ClinicalTrials.gov API v2 intervention search for DNL343 which
    returned six studies. One phase 2/3 regimen (NCT05842941, n=249) was retrieved in full and specifies
    ALSFRS-R slope and mortality as its primary outcomes with no cognitive outcome listed. A hit would
    have been a human interventional study -- randomised, crossover or open-label -- reporting any cognitive
    endpoint for this target or for a selective agent against it. Scope limit: PubMed and ClinicalTrials.gov
    only; no EudraCT, ISRCTN, WHO ICTRP or company-disclosure search was performed.'
  claim_refs: []
  counter_level: 0
  counter_rationale: No human study has tested and rejected a cognitive effect of eIF2B activation; the
    question has not been asked.
  counter_claim_refs: []
  limiting_factor: no human cognitive endpoint has ever been measured for this mechanism; the existing
    human exposure is in a neurodegenerative population and is recorded as the coverage gap CLM:brakes:EIF2B_COMPLEX:004
