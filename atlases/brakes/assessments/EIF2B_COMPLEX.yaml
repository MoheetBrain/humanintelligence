- facet: dose_response_knowledge
  assessment_status: assessed
  level: 2
  rationale: A potency value was reported for the cellular effect and, more importantly, the response
    was shown to be gated by an internal state variable with a critical threshold, which is a qualitative
    dose-response result of real value.
  claim_refs:
  - CLM:brakes:EIF2B_COMPLEX:003
  - CLM:brakes:EIF2B_COMPLEX:001
  counter_level: 0
  counter_rationale: No conflicting dose-response result was located.
  counter_claim_refs: []
