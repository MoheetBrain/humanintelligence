facets:
- facet: mechanistic_causal_perturbation
  assessment_status: assessed
  level: 3
  rationale: 'Converging causal evidence across designs: an adult systemic pharmacological perturbation
    with a behavioural readout in healthy mice, an independent cell-type-resolved genetic perturbation
    of the upstream inhibitory signal with plasticity and memory readouts, and an atomic structure of
    the compound on the human complex that supplies the molecular mechanism.'
  claim_refs:
  - CLM:brakes:EIF2B_COMPLEX:001
  - CLM:brakes:EIF2B_COMPLEX:005
  - CLM:brakes:EIF2B_COMPLEX:002
  counter_level: 2
  counter_rationale: The pharmacological effect disappears above a threshold of stress-response activation,
    which limits the generality of the mechanism; and hypomorphic mutations in the eIF2B subunits cause
    an adult-onset human leukoencephalopathy with executive deficits, showing that the complex's activity
    is required rather than merely permissive.
  counter_claim_refs:
  - CLM:brakes:EIF2B_COMPLEX:003
  - CLM:brakes:EIF2B_COMPLEX:006
  limiting_factor: the structural claim can never support an effect assertion, and no adult-inducible
    genetic perturbation of eIF2B subunits was located
- facet: adult_onset_perturbation
  assessment_status: assessed
  level: 2
  rationale: An acute systemic small molecule given to adult mice changed learning, which is a genuine
    adult-onset perturbation with a behavioural endpoint.
  claim_refs:
  - CLM:brakes:EIF2B_COMPLEX:001
  counter_level: 0
  counter_rationale: No located study reports that adult eIF2B activation fails to change learning.
  counter_claim_refs: []
  limiting_factor: one compound, one species, no adult-inducible genetic comparison
- facet: above_baseline_enhancement
  assessment_status: assessed
  level: 2
  rationale: Both the pharmacological and the genetic result were obtained in otherwise healthy animals
    against an intact baseline, which is the correct design for an enhancement claim; the evidence is
    moderate because each is a single study.
  claim_refs:
  - CLM:brakes:EIF2B_COMPLEX:001
  - CLM:brakes:EIF2B_COMPLEX:005
  counter_level: 0
  counter_rationale: No located study reports a failure to enhance in healthy animals.
  counter_claim_refs: []
  limiting_factor: no human enhancement data; no independent replication located
- facet: transfer_breadth
  assessment_status: assessed
  level: 1
  rationale: Two behavioural domains were affected in mice, spatial and fear-associated learning, which
    is more than one task but both are rodent memory tasks sharing a consolidation bottleneck.
  claim_refs:
  - CLM:brakes:EIF2B_COMPLEX:001
  counter_level: 0
  counter_rationale: No located study tests and rejects transfer.
  counter_claim_refs: []
