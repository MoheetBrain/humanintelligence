facets:
- facet: mechanistic_causal_perturbation
  assessment_status: assessed
  level: 3
  rationale: 'Converging causal evidence across designs: a genetically restricted deletion with input-specific
    plasticity and behavioural readouts, an independent slice study establishing the activity-dependent
    regulation of the same current, and a bidirectional conditional overexpression-and-deletion study
    with matched electrophysiology.'
  claim_refs:
  - CLM:brakes:HCN1:001
  - CLM:brakes:HCN1:002
  - CLM:brakes:HCN1:003
  counter_level: 2
  counter_rationale: Adult mice lacking the same channel were more seizure-prone and developed spontaneous
    seizures faster, with an excitation-inhibition imbalance; the current is also recruited homeostatically
    and is elevated in a disease model, so it is a regulated variable rather than a fixed brake.
  counter_claim_refs:
  - CLM:brakes:HCN1:005
  - CLM:brakes:HCN1:002
  - CLM:brakes:HCN1:004
  limiting_factor: the behavioural enhancement rests on one study and one deletion strategy that is not
    adult-onset
- facet: adult_onset_perturbation
  assessment_status: assessed
  level: 2
  rationale: A conditional overexpression-and-deletion study reports bidirectional behavioural and electrophysiological
    effects in adult mice with a matching mechanism, and pharmacological block of the current reversed
    the synaptic phenotype in adult tissue.
  claim_refs:
  - CLM:brakes:HCN1:003
  counter_level: 0
  counter_rationale: No located study reports that adult HCN1 manipulation fails to change excitability
    or behaviour.
  counter_claim_refs: []
  limiting_factor: the age at induction is not stated in the retrieved abstract, so adult onset is probable
    rather than established
- facet: above_baseline_enhancement
  assessment_status: assessed
  level: 2
  rationale: Learning, theta power and distal-input potentiation were all raised relative to a healthy
    control baseline in the forebrain-restricted deletion, which is the right design for an enhancement
    claim.
  claim_refs:
  - CLM:brakes:HCN1:001
  counter_level: 2
  counter_rationale: The same deletion that improved learning made adult mice more seizure-prone with
    an excitation-inhibition imbalance; the current is recruited homeostatically so any gain is against
    an opposing loop; and direct recordings from adult human dendrites show weaker dendrite-to-soma coupling
    than rat, which caps the translation of the enhancing result.
  counter_claim_refs:
  - CLM:brakes:HCN1:005
  - CLM:brakes:HCN1:002
  - CLM:brakes:HCN1:006
  limiting_factor: rodent only for the benefit, no persistence measurement, and a measured human-versus-rodent
    difference in the state variable itself
