facets:
- facet: mechanistic_causal_perturbation
  assessment_status: assessed
  level: 1
  rationale: A specific molecular mechanism with a named effector channel is established, but the located
    causal evidence uses germline deletions, has affective rather than cognitive endpoints in the brake-consistent
    line, and comes from one laboratory. Weak and indirect with respect to cognition.
  claim_refs:
  - CLM:brakes:GPR158:001
  - CLM:brakes:GPR158:002
  counter_level: 2
  counter_rationale: An independent line of work identifies the same receptor as the transducer of a memory-promoting
    hormone signal in CA3, so the sign of its effect on memory is contested rather than merely uncertain.
  counter_claim_refs:
  - CLM:brakes:GPR158:003
  limiting_factor: no cognitive endpoint in the brake-consistent literature, and a sign conflict with
    the memory literature
- facet: adult_onset_perturbation
  assessment_status: assessed
  level: 2
  rationale: Regional restoration of the partner protein in adult medial prefrontal cortex reinstated
    a behavioural phenotype in a receptor-dependent manner, and peripheral hormone delivery changed memory
    in 16-month-old animals; both act on the adult system.
  claim_refs:
  - CLM:brakes:GPR158:002
  - CLM:brakes:GPR158:003
  counter_level: 0
  counter_rationale: No located study reports a failure of adult manipulation to engage the pathway.
  counter_claim_refs: []
  limiting_factor: adult evidence manipulates the partner protein or the upstream ligand rather than the
    receptor itself
- facet: above_baseline_enhancement
  assessment_status: assessed
  level: 0
  rationale: No located study reports a cognitive improvement above a healthy adult baseline from reducing
    GPR158 function.
  search_basis: 'PubMed keyword searches pairing GPR158 with knockout, hippocampus, memory, osteocalcin,
    RGS7 and stress terms. A hit would have been any cognitive or plasticity measure raised above an intact
    young healthy baseline by reducing GPR158 function. Scope limit: the two located behavioural results
    use a chronic-stress model and 16-month-old animals with declining circulating hormone, so neither
    has such a baseline; the enhancement question has not been asked for this target.'
  claim_refs: []
  counter_level: 1
  counter_rationale: The hormone-receptor line implies that losing GPR158 should impair rather than improve
