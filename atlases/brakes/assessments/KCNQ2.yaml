facets:
- facet: mechanistic_causal_perturbation
  assessment_status: assessed
  level: 3
  rationale: 'Converging causal evidence across designs: a temporally restricted dominant-negative transgene
    in vivo with cellular, electrophysiological and behavioural readouts, an independent adult slice study
    establishing endogenous neuromodulatory control of the same current with subunit localisation, and
    a human drug programme demonstrating the channel is pharmacologically accessible.'
  claim_refs:
  - CLM:brakes:KCNQ2:001
  - CLM:brakes:KCNQ2:002
  counter_level: 3
  counter_rationale: The adult-onset arm of the same perturbation impaired spatial memory and raised excitability
    rather than improving cognition, which is substantial evidence against the brake-release proposition
    for this target.
  counter_claim_refs:
  - CLM:brakes:KCNQ2:001
  limiting_factor: the dominant-negative transgene implicates the KCNQ2/KCNQ3 heteromer rather than KCNQ2
    alone
- facet: adult_onset_perturbation
  assessment_status: assessed
  level: 3
  rationale: A genuinely temporally restricted perturbation after the early postnatal window produced
    increased excitability and a cognitive readout, which is the design class this facet is about and
    is rare in the brake atlas.
  claim_refs:
  - CLM:brakes:KCNQ2:001
  counter_level: 3
  counter_rationale: 'The adult-onset result is itself the counter-evidence: what the adult perturbation
    produced was impairment and seizures.'
  counter_claim_refs:
  - CLM:brakes:KCNQ2:001
  limiting_factor: one study; adult onset is established relative to a critical period rather than to
    full maturity
- facet: above_baseline_enhancement
  assessment_status: assessed
  level: 0
  rationale: No located study reports any improvement above baseline from reducing KCNQ2 function; the
    supporting side of this facet is empty.
  search_basis: 'PubMed keyword searches pairing KCNQ2, KCNQ3 and the M-current with excitability, hippocampal
    learning and cognition terms. A hit would have been any cognitive or plasticity measure raised above
    a healthy baseline by reducing M-current function. Scope limit: the adult-onset perturbation that
    was located produced the opposite result -- impaired spatial memory with spontaneous seizures -- and
    the adult slice study reports a cellular change with no performance measure attached.'
  claim_refs: []
  counter_level: 3
  counter_rationale: Adult-onset M-current suppression in healthy animals produced spatial memory deficits,
    reduced spike-frequency adaptation, attenuated afterhyperpolarisation and loss of subthreshold theta
    resonance, alongside spontaneous seizures.
  counter_claim_refs:
  - CLM:brakes:KCNQ2:001
  limiting_factor: this target is recorded as a counterexample to brake release rather than as a candidate
- facet: transfer_breadth
  assessment_status: not_assessed
  level: null
  rationale: Not reviewed. The located evidence concerns impairment, and no transfer analysis was examined.
  claim_refs: []
  counter_level: null
  counter_rationale: Not assessed.
  counter_claim_refs: []
  limiting_factor: not reviewed in this sprint
- facet: dose_response_knowledge
  assessment_status: assessed
  level: 1
  rationale: Human exposure-response information exists only for the opening direction, as a programme-level
    adverse-event profile for a first-in-class KCNQ opener, which is weak and indirect with respect to
    the brake-release direction.
  claim_refs:
  - CLM:brakes:KCNQ2:003
  counter_level: 0
  counter_rationale: No conflicting dose-response result located.
  counter_claim_refs: []
  limiting_factor: no graded reduction of the M-current with a cognitive readout at any dose in any species
- facet: human_intervention_evidence
  assessment_status: assessed
  level: 1
  rationale: Human interventional data exist for this channel, but only for opening it, and only with
    seizure and safety endpoints; there is no human cognitive evidence in either direction.
  claim_refs:
  - CLM:brakes:KCNQ2:003
  counter_level: 2
  counter_rationale: The one human programme for this channel established a peripheral smooth-muscle liability
    and a black-box warning, which is moderate evidence that the channel cannot be modulated centrally
    without systemic consequence.
  counter_claim_refs:
  - CLM:brakes:KCNQ2:003
  limiting_factor: no human study of M-current reduction, and none of any KCNQ modulation with a cognitive
    endpoint
