schema_version: 0.1.0
target_id: TGT:ADORA1
assessed_by: agent:brakes
assessed_on: '2026-09-17'
rubric: facet_rubric_v0_1
scale: evidence_strength_v1
facets:
- facet: mechanistic_causal_perturbation
  assessment_status: assessed
  level: 3
  rationale: 'Converging causal evidence from two independent laboratories and two designs: a conditional
    central knockout of the receptor and a transgenic suppression of the upstream astrocytic source, both
    placing A1 signalling in the sleep-pressure-to-cognition pathway with concordant behavioural consequences.'
  claim_refs:
  - CLM:brakes:ADORA1:001
  - CLM:brakes:ADORA1:002
  counter_level: 2
  counter_rationale: Both studies show that removing the brake does not improve cognition; the knockout
    impaired working memory under load. This is counter-evidence to the brake-release proposition while
    supporting the mechanism.
  counter_claim_refs:
  - CLM:brakes:ADORA1:001
  limiting_factor: no adult-inducible receptor-level genetic perturbation; no human study isolates A1
    from A2A
- facet: adult_onset_perturbation
  assessment_status: assessed
  level: 2
  rationale: The human evidence is entirely acute adult pharmacological dosing, and the rodent astrocytic
    manipulation was inducible; both act on the adult system.
  claim_refs:
  - CLM:brakes:ADORA1:003
  - CLM:brakes:ADORA1:004
  - CLM:brakes:ADORA1:002
  counter_level: 0
  counter_rationale: No located study reports that adult adenosine antagonism fails to raise arousal;
    the disputed point is whether the change is a net gain.
  counter_claim_refs: []
  limiting_factor: the adult human agent is non-selective, so adult tractability is established for adenosine
    antagonism rather than for ADORA1
- facet: above_baseline_enhancement
  assessment_status: assessed
  level: 1
  rationale: Human performance gains relative to placebo are real and replicated, but every located design
    tested habitual consumers after abstinence, so the supporting evidence for above-baseline enhancement
    is weak and indirect.
  claim_refs:
  - CLM:brakes:ADORA1:003
  - CLM:brakes:ADORA1:006
  counter_level: 3
  counter_rationale: Benefit appeared only after the longest abstinence interval and not after shorter
    ones; effects were larger in heavier habitual users; non-consumers and low consumers showed no effect
    at all; and removing the receptor genetically impaired rather than improved cognition.
  counter_claim_refs:
  - CLM:brakes:ADORA1:004
  - CLM:brakes:ADORA1:005
  - CLM:brakes:ADORA1:006
  - CLM:brakes:ADORA1:001
  limiting_factor: the decisive design, an adult caffeine-naive enhancement trial, was not located; the
    nearest evidence uses children
- facet: transfer_breadth
  assessment_status: assessed
  level: 1
  rationale: Located human endpoints are reaction time, vigilance and mood, which are narrow arousal-sensitive
    measures; no reasoning, working memory or multi-domain composite was located.
  claim_refs:
  - CLM:brakes:ADORA1:003
  - CLM:brakes:ADORA1:006
  counter_level: 2
  counter_rationale: The rodent working-memory result under sleep restriction went the wrong way, and
    the children's study found the effect confined to consumers on a single accuracy measure.
  counter_claim_refs:
  - CLM:brakes:ADORA1:001
  - CLM:brakes:ADORA1:005
  limiting_factor: no located study measures fluid reasoning or a general factor
- facet: dose_response_knowledge
  assessment_status: assessed
  level: 3
  rationale: 'This is the best-characterised dose-response in the brake atlas: a five-point human dose
    ladder from 12.5 to 100 mg, a one-to-three dose comparison, and a manipulation of the inter-dose interval
    at 4, 6 and 8 hours, all in randomised human designs. The consistent finding is a flat curve that
    depends on abstinence interval rather than on dose.'
  claim_refs:
  - CLM:brakes:ADORA1:006
  - CLM:brakes:ADORA1:003
  - CLM:brakes:ADORA1:004
  counter_level: 0
  counter_rationale: No located study contradicts the flatness of the curve.
  counter_claim_refs: []
  limiting_factor: the dose-response is for a non-selective antagonist on arousal-sensitive tasks, not
    for ADORA1 on a cognitive capacity
- facet: human_intervention_evidence
  assessment_status: assessed
  level: 2
  rationale: Multiple randomised human interventional studies with relevant behavioural endpoints exist
    and show a reliable effect against placebo, which meets the moderate criterion; the compound is not
    receptor-selective, which caps it there.
  claim_refs:
  - CLM:brakes:ADORA1:003
  - CLM:brakes:ADORA1:006
  counter_level: 3
  counter_rationale: The same human literature, read across designs that manipulate abstinence interval
    and habitual use, indicates the effect is largely withdrawal reversal with no net benefit, and that
    is the authors' own conclusion in more than one of the located studies.
  counter_claim_refs:
  - CLM:brakes:ADORA1:004
  - CLM:brakes:ADORA1:005
  - CLM:brakes:ADORA1:003
  limiting_factor: no human study located here targets ADORA1 selectively or tests a caffeine-naive adult
    population
  reporting_gap_refs:
  - SRC:NCT:NCT01834547
  search_basis: Sprint-2 Task B additionally ran a target-directed ClinicalTrials.gov search (terms, per-term
    hit counts and full classification in evidence/registry_searches/ADORA1.yaml), which the Sprint-1
    grade did not have. It identified 1 completed trial(s) carrying a cognitive outcome measure with no
    posted results; those are in reporting_gap_refs and are NOT counter-evidence, because a trial that
    never reported cannot have failed.
