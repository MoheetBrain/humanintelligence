rubric: facet_rubric_v0_1
scale: evidence_strength_v1
facets:
- facet: mechanistic_causal_perturbation
  assessment_status: assessed
  level: 2
  rationale: One landmark study with bidirectional genetic arms and a pharmacological cross-check, plus
    an independent in vivo study showing the enzyme's activity is engaged by potentiation. Moderate replicated
    non-human causal evidence.
  claim_refs:
  - CLM:brakes:HDAC2:001
  - CLM:brakes:HDAC2:002
  counter_level: 1
  counter_rationale: Adult pharmacological inhibition in vivo enhanced only an intermediate phase of potentiation
    and had no effect on its long-lasting persistence.
  counter_claim_refs:
  - CLM:brakes:HDAC2:003
  limiting_factor: no adult-onset HDAC2-selective perturbation; the pharmacological arms use non-selective
    inhibitors
- facet: adult_onset_perturbation
  assessment_status: assessed
  level: 2
  rationale: A histone-deacetylase inhibitor given to freely moving adult rats changed the persistence
    of potentiation, and single doses of a deacetylase-inhibiting drug have been given to healthy adult
    humans in a dose-escalation study.
  claim_refs:
  - CLM:brakes:HDAC2:003
  - CLM:brakes:HDAC2:005
  counter_level: 1
  counter_rationale: The adult pharmacological effect was confined to one temporal phase, and the human
    adult exposure produced no detectable change on cognitive testing.
  counter_claim_refs:
  - CLM:brakes:HDAC2:003
  - CLM:brakes:HDAC2:005
  limiting_factor: adult evidence exists only for non-selective inhibitors, so adult tractability of HDAC2
    specifically is untested
- facet: above_baseline_enhancement
  assessment_status: assessed
  level: 1
  rationale: Memory facilitation was reported in Hdac2-deficient mice against a healthy baseline, but
    the manipulation is germline and the adult pharmacological analogue produced only a transient plasticity
    change, so supporting evidence is weak and indirect.
  claim_refs:
  - CLM:brakes:HDAC2:001
  counter_level: 2
  counter_rationale: Adult inhibition did not extend the long-lasting phase of potentiation, and in healthy
    adult humans a deacetylase-inhibiting drug produced no change on cognitive testing at doses up to
    the maximum tolerated.
  counter_claim_refs:
  - CLM:brakes:HDAC2:003
  - CLM:brakes:HDAC2:005
  limiting_factor: the healthy-human cognitive testing was a safety measure not designed to detect enhancement,
    so this counter-evidence is itself weak
- facet: transfer_breadth
  assessment_status: not_assessed
  level: null
  rationale: This agent did not review any study that measures transfer or multiple cognitive domains
    for HDAC2, so the facet is left unassessed rather than graded zero.
  claim_refs: []
  counter_level: null
  counter_rationale: Not assessed.
  counter_claim_refs: []
  limiting_factor: not reviewed in this sprint
- facet: dose_response_knowledge
  assessment_status: assessed
  level: 2
  rationale: A human phase I dose escalation established a maximum tolerated dose with a reported correlation
    between dose level and adverse-event count, which is real human exposure-response knowledge for the
    class.
  claim_refs:
  - CLM:brakes:HDAC2:005
  counter_level: 0
  counter_rationale: No conflicting dose-response result was located.
  counter_claim_refs: []
  limiting_factor: the dose-response is for tolerability of a non-selective agent, not for any cognitive
    endpoint
- facet: human_intervention_evidence
  assessment_status: assessed
  level: 1
  rationale: 'Human interventional studies of the inhibitor class exist, which is more than nothing, but
    neither located study supports a cognitive benefit: one failed at its pharmacodynamic biomarker and
    the other measured cognition only as a safety endpoint.'
  claim_refs:
  - CLM:brakes:HDAC2:004
  - CLM:brakes:HDAC2:005
  counter_level: 3
  counter_rationale: A randomised placebo-controlled trial of a histone-deacetylase inhibitor in a CNS
    indication did not move plasma or cerebrospinal-fluid levels of its target biomarker or any exploratory
    measure, and its exposure did not rise proportionally with dose.
  counter_claim_refs:
  - CLM:brakes:HDAC2:004
  limiting_factor: no human trial of any HDAC inhibitor with a cognitive primary endpoint was located
    in this session
