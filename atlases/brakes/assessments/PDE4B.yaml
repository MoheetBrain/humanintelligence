facets:
- facet: mechanistic_causal_perturbation
  assessment_status: assessed
  level: 1
  rationale: No PDE4B-selective causal perturbation was reviewed in this sprint. All located evidence
    uses a pan-PDE4 inhibitor in humans, so the mechanistic attribution to this gene is weak and indirect
    even though the pharmacological evidence is strong.
  claim_refs:
  - CLM:brakes:PDE4B:001
  counter_level: 0
  counter_rationale: No located study contradicts a PDE4 role; the weakness is attribution, not direction.
  counter_claim_refs: []
  limiting_factor: no subtype-selective genetic or pharmacological perturbation reviewed; the dossier's
    strength lies in human pharmacology rather than in gene-level causal evidence
- facet: adult_onset_perturbation
  assessment_status: assessed
  level: 3
  rationale: Three randomised, placebo-controlled human studies dosed adults acutely and measured cognition
    directly, which is the strongest adult-onset evidence in the brake atlas.
  claim_refs:
  - CLM:brakes:PDE4B:001
  - CLM:brakes:PDE4B:002
  - CLM:brakes:PDE4B:003
  counter_level: 0
  counter_rationale: No located study reports a failure of adult dosing to engage the mechanism.
  counter_claim_refs: []
  limiting_factor: acute single or eight-day dosing only; nothing about chronic adult exposure
- facet: above_baseline_enhancement
  assessment_status: assessed
  level: 3
  rationale: Two randomised, placebo-controlled crossover studies in healthy adults, one young and one
    older with memory screened as normal, both reported improved verbal recall relative to placebo with
    a reported effect size in the older cohort. This is a human interventional result with a directly
    relevant endpoint against an intact baseline.
  claim_refs:
  - CLM:brakes:PDE4B:001
  - CLM:brakes:PDE4B:002
  counter_level: 2
  counter_rationale: In the same programme working memory was not improved, the spatial task showed no
    effect, the benefit did not appear at higher doses, and all the studies come from overlapping groups.
  counter_claim_refs:
  - CLM:brakes:PDE4B:003
  - CLM:brakes:PDE4B:002
  limiting_factor: no independent replication located, small samples, and a non-selective drug that cannot
    be attributed to PDE4B
- facet: transfer_breadth
  assessment_status: assessed
  level: 1
  rationale: The effect is confined to verbal recall; the same programme measured spatial memory and working
    memory and found no benefit, so breadth is weak and indirect at best.
  claim_refs:
  - CLM:brakes:PDE4B:001
  counter_level: 3
  counter_rationale: 'Two explicit within-programme dissociations: no effect on a spatial memory task
    in healthy older adults, and essentially no effect on working memory in patients despite a verbal
    memory gain in the same study.'
  counter_claim_refs:
  - CLM:brakes:PDE4B:002
  - CLM:brakes:PDE4B:003
  limiting_factor: no located study measures far transfer or a general ability factor
- facet: dose_response_knowledge
  assessment_status: assessed
  level: 3
  rationale: Three dose levels were tested against placebo in each of two healthy-adult crossover studies,
    with the benefit at the lowest dose, no benefit at higher doses, and mild adverse events appearing
    at the highest. That is a genuine human exposure-response characterisation of a non-monotone relationship.
  claim_refs:
  - CLM:brakes:PDE4B:001
  - CLM:brakes:PDE4B:002
  counter_level: 0
  counter_rationale: No conflicting dose-response result located.
  counter_claim_refs: []
  limiting_factor: the effective dose differed between the healthy studies and the patient study, which
    no located analysis reconciles
- facet: human_intervention_evidence
  assessment_status: assessed
  level: 3
  rationale: Randomised, double-blind, placebo-controlled human interventional evidence with directly
    relevant cognitive endpoints exists in two healthy adult populations and one patient population.
  claim_refs:
  - CLM:brakes:PDE4B:001
  - CLM:brakes:PDE4B:002
  - CLM:brakes:PDE4B:003
  counter_level: 2
  counter_rationale: The working-memory null in the patient study and the spatial-memory null in the healthy
    older study limit what the human evidence supports, and the studies are not independent of one another.
  counter_claim_refs:
  - CLM:brakes:PDE4B:003
  - CLM:brakes:PDE4B:002
  limiting_factor: overlapping authorship across all three studies means this is not replicated human
    evidence in the sense the level-4 criterion requires
