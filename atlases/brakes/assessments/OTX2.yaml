- facet: mechanistic_causal_perturbation
  assessment_status: assessed
  level: 2
  rationale: An adult pharmacological perturbation with control peptides and a developmental conditional
    knockout converge on the same mechanism of homeoprotein capture by perineuronal nets, which meets
    the moderate criterion.
  claim_refs:
  - CLM:brakes:OTX2:001
  - CLM:brakes:OTX2:002
  counter_level: 2
  counter_rationale: The same adult manipulation that reopened plasticity caused a loss of cortical acuity
    when the reopened cortex was deprived, so the perturbation has a demonstrated harm in one state.
  counter_claim_refs:
  - CLM:brakes:OTX2:001
  limiting_factor: sensory endpoints only; no cognitive readout in either study
- facet: adult_onset_perturbation
  assessment_status: assessed
  level: 2
  rationale: Direct intracortical infusion of a competing peptide in adult mice reopened ocular-dominance
    plasticity and reduced parvalbumin and perineuronal-net expression, which is an unambiguous adult-onset
    perturbation.
  claim_refs:
  - CLM:brakes:OTX2:001
  counter_level: 2
  counter_rationale: The adult-onset perturbation's consequence was state-dependent and included acuity
    loss, so adult modifiability is established together with adult harm.
  counter_claim_refs:
  - CLM:brakes:OTX2:001
  limiting_factor: invasive intracortical route; a single study
- facet: above_baseline_enhancement
  assessment_status: assessed
  level: 0
  rationale: No located study reports any performance above a healthy adult baseline from disrupting OTX2
    capture; the demonstrated adult benefit was restoration of vision in amblyopic animals, which is rescue.
  search_basis: 'PubMed keyword searches pairing Otx2 with critical period, perineuronal net, parvalbumin,
    plasticity and adult terms. A hit would have been any capacity measured above a healthy adult baseline
    after disrupting OTX2 capture. Scope limit: the one adult benefit located is restoration of binocular
    vision in amblyopic animals, which is rescue, and the same manipulation degraded acuity in healthy
    adults under deprivation.'
  claim_refs: []
  counter_level: 2
  counter_rationale: In healthy adults the same manipulation produced a loss of cortical acuity when combined
