rubric: facet_rubric_v0_1
scale: evidence_strength_v1
facets:
- facet: mechanistic_causal_perturbation
  assessment_status: assessed
  level: 3
  rationale: 'Converging causal evidence across designs and species: a cell-type-restricted genetic deletion
    with behavioural and receptor-density confirmation in mouse, an adult oral pharmacological perturbation
    with occupancy data in rat, and a rescue experiment in a third mutant line.'
  claim_refs:
  - CLM:brakes:GABRA5:001
  - CLM:brakes:GABRA5:002
  - CLM:brakes:GABRA5:005
  - CLM:brakes:GABRA5:007
  counter_level: 2
  counter_rationale: The same deletion impaired context discrimination, and positive allosteric modulators
    improved memory in aged impaired rats, so the sign of the useful manipulation is not fixed.
  counter_claim_refs:
  - CLM:brakes:GABRA5:003
  - CLM:brakes:GABRA5:006
  limiting_factor: no adult-inducible genetic perturbation; the genetic and pharmacological arms differ
    in onset as well as in method
- facet: adult_onset_perturbation
  assessment_status: assessed
  level: 2
  rationale: Adult oral dosing of an alpha5-selective negative modulator produced hippocampal receptor
    occupancy and augmented potentiation in rat, and an alpha5 negative modulator restored potentiation
    and memory in adult mutant mice.
  claim_refs:
  - CLM:brakes:GABRA5:005
  - CLM:brakes:GABRA5:007
  counter_level: 0
  counter_rationale: No located study reports that adult-onset reduction of this receptor fails to change
    plasticity or behaviour.
  counter_claim_refs: []
  limiting_factor: all adult-onset evidence is pharmacological and either in deficit states or on cellular
    endpoints
- facet: above_baseline_enhancement
  assessment_status: assessed
  level: 2
  rationale: Two memory domains improved above a healthy wild-type baseline in mice carrying a cell-type-restricted
    deletion, which is the design class that can in principle show enhancement rather than rescue.
  claim_refs:
  - CLM:brakes:GABRA5:001
  - CLM:brakes:GABRA5:002
  counter_level: 3
  counter_rationale: A randomised human trial with demonstrated target engagement showed no cognitive
    benefit; the same mouse deletion that improved two domains impaired a third; and the opposite pharmacological
    direction improved memory in aged animals.
  counter_claim_refs:
  - CLM:brakes:GABRA5:004
  - CLM:brakes:GABRA5:003
  - CLM:brakes:GABRA5:006
  limiting_factor: no healthy-adult human data of any kind; the only human trial was in a population with
    intellectual disability
- facet: transfer_breadth
  assessment_status: assessed
  level: 1
  rationale: Improvements were confined to specific hippocampal memory domains, with explicitly unchanged
    performance on reversal learning, latent inhibition and contextual conditioning in the same animals.
  claim_refs:
  - CLM:brakes:GABRA5:001
  - CLM:brakes:GABRA5:002
  counter_level: 3
  counter_rationale: A within-study dissociation shows one domain worsening while two improved, and the
    human trial found no change on a multi-domain composite or on any secondary domain.
  counter_claim_refs:
  - CLM:brakes:GABRA5:003
  - CLM:brakes:GABRA5:004
  limiting_factor: no study located here measures far transfer or a general ability factor
- facet: dose_response_knowledge
  assessment_status: assessed
  level: 2
  rationale: A dose-occupancy relationship spanning roughly 40 to 90 percent hippocampal receptor occupancy
    was reported for an adult oral compound, and the human trial used two dose levels with a pharmacodynamic
    EEG readout.
  claim_refs:
  - CLM:brakes:GABRA5:005
  - CLM:brakes:GABRA5:004
  counter_level: 1
  counter_rationale: The observation that positive and negative modulation can both improve memory implies
    the response is non-monotone in a way no located study has mapped.
  counter_claim_refs:
  - CLM:brakes:GABRA5:006
  limiting_factor: no exposure-response curve exists for any cognitive endpoint in any species
- facet: human_intervention_evidence
  assessment_status: assessed
  level: 1
  rationale: Human interventional evidence exists and is of good quality, but it tested the mechanism
    and found no cognitive benefit; the supporting side of this facet is therefore weak rather than absent.
  claim_refs:
  - CLM:brakes:GABRA5:004
  counter_level: 3
  counter_rationale: 'A randomised placebo-controlled trial with demonstrated target engagement showed
    no effect on its primary composite or on any secondary cognitive measure. That single trial carries
    the whole counter_level of 3 on its own. Registry records retrieved and verified on 2026-09-17 show
    three further phase II programmes for the same compound terminated (NCT02484703 n=45, NCT05307679
    n=7, NCT02928393 n=5) and a fourth completed with posted results this agent did not retrieve (NCT02953639,
    n=214). None of them contributes to this counter_level and none is registered as a source of this
    atlas: a terminated trial is not a reported null, an unread result is not a negative one, and this
    agent could not determine whether the terminated studies measured their cognitive endpoints before
    stopping (rules V16b, V16c; see the handoff for the audit item).'
  counter_claim_refs:
  - CLM:brakes:GABRA5:004
  limiting_factor: the one completed trial with a standard multi-domain cognitive battery (NCT02953639,
    214 participants, MATRICS composite) has posted results that this agent did not retrieve; that is
    an extraction limit of this atlas, not a property of the evidence, and it is the largest single unresolved
    item in the GABRA5 dossier
