    - {id: "SPECIES:NCBITaxon:9054", scientific_name: "Phasianus colchicus", note: "common pheasant; the detour-task construct-validity experiment and the galliform scaling study"}
    - {id: "SPECIES:NCBITaxon:8932", scientific_name: "Columba livia", note: "rock dove; avian canonical-circuit anatomy"}
    - {id: "SPECIES:NCBITaxon:56313", scientific_name: "Tyto alba", note: "barn owl; avian canonical-circuit anatomy"}
    - {id: "SPECIES:NCBITaxon:9597", scientific_name: "Pan paniscus", note: "bonobo; great-ape detour-task comparison group"}
