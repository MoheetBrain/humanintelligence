  orangutan_not_resolved: >-
    SRC:PMID:27152224 reports an orangutan cylinder-task score. No taxid is recorded
    because the retrieved text gives only the common name and the genus Pongo contains
    more than one species. Guessing would have been a fabricated identifier.
