# Positive human natural experiment — 2q12.3 duplication
#
# WATCHLIST ENTRY. This is NOT a validated enhancement mutation, and nothing here
# licenses an intervention. It is the rarest and most valuable KIND of evidence this
# project can find — a human variant associated with HIGHER cognitive performance rather
# than with impairment — and it is recorded so that it can be tracked, attacked and
# resolved rather than admired.
#
# THE HARD RULE THIS FILE EXISTS TO ENFORCE:
#   loss of function causing intellectual disability  IS NOT  gain of function improving
#   intelligence.
# Most of what is known about dosage and cognition comes from deletions and from LoF
# intolerance. Those data describe what breaks cognition. They do not describe what
# improves it, and the two questions have different answers.

schema_version: 0.3.0
watchlist_id: POSGEN:2q12.3_duplication
title: Duplication at 2q12.3 associated with higher cognitive performance
status: watchlist_unreplicated
recorded_by: agent:orchestrator
recorded_on: "2026-09-18"
corrected_on: "2026-09-22"

# ------------------------------------------------------------ CORRECTION 2026-09-22 --
correction_2026_09_22:
  what_was_wrong: >-
    Versions 0.1-0.2 of this record listed the eight protein-coding genes of cytoband 2q12.3
    as resolved on GRCh38 (chr2:106.7-108.7 Mb): ST6GAL2, RGPD4, SLC5A7, SULT1C3, SULT1C2,
    SULT1C4, GCC2, LIMS1. NONE of them is in the duplication. The paper uses hg19
    coordinates, and cytoband boundaries differ between builds: hg19 2q12.3 spans
    chr2:107.5-110.2 Mb, hg38 2q12.3 spans 106.7-108.7 Mb. The duplicated interval lies in
    hg19 2q12.3 but, once lifted to hg38, in 2q13. Resolving a band LABEL against the wrong
    build moved the entire gene list roughly 2 Mb away from the variant.
  how_it_was_found: >-
    Sprint 3 audit of the Codex/Astra branch, whose watchlist (RP01) named EDAR, SH3RF3,
    SEPT10 and SOWAHC. The two gene lists shared nothing, so neither agent was trusted: the
    open-access full text (PMC11701252, snapshotted to
    data/raw/europepmc_fulltext/2026-09-22/) was read directly.
  what_this_invalidates:
    - Every gene-level statement in versions 0.1-0.2 (LOEUF values, expression notes).
    - The SLC5A7/cholinergic guard below is now moot in the strongest sense -- SLC5A7 is
      not in the duplication at all. The guard is kept as a record of the temptation.
    - The Sprint-3 recon result "0 of 18 genes in 2q12.3 carry ClinGen curation" ran on the
      same wrong (hg38-band) region. It was re-run on the real genes (below).
  what_it_does_not_invalidate: >-
    The record's own warning that "the gene list below is the content of the CYTOBAND, not
    the content of the duplicated interval". That warning was correct; the error was that
    even the cytoband was resolved on the wrong build.

# ------------------------------------------------------------------- the finding ----
primary_source:
  source_id: SRC:PMID:39667348
  citation_as_verified: >-
    Huguet G, Renne T, Poulain C, et al. "Effects of gene dosage on cognitive ability: A
    function-based association study across brain and non-brain processes." Cell Genomics
    2024;4(12):100721.
  doi: 10.1016/j.xgen.2024.100721
  verification: >-
    Retrieved and verified independently via PubMed in this session. The Sprint-2 brief
    described this finding in prose; that prose was NOT taken on trust. The paper exists
    and its abstract states the claim attributed to it.
  what_the_abstract_states: >-
    A genome-wide association study in 258,292 individuals "identified - for the first
    time - a duplication at 2q12.3 associated with higher cognitive performance". The same
    work reports a functional-burden analysis over 6,502 gene sets, of which 864 were
    associated with cognition, with deletion and duplication effect sizes negatively
    correlated, and biological processes sensitive to either deletions (subcortical
    regions, postsynaptic) or duplications (cerebral cortex, presynaptic).

# --------------------------------------------------------------- what we do NOT know --
critical_unknowns:
  - id: breakpoints_unknown
    statement: >-
      The precise duplication breakpoints are NOT known to this repository. The gene list
      below is the content of the CYTOBAND 2q12.3, which is a 2 Mb window, not the
      content of the duplicated interval. Those are different sets and conflating them
      would be the single easiest way to misread this entry.
    resolved_by: the paper's supplementary CNV coordinates
  - id: carrier_count_unknown
    statement: >-
      The number of duplication carriers is not stated in the retrieved abstract. For a
      rare CNV this is the number that determines whether the association is worth
      anything, and it is not in hand.
    resolved_by: the paper's supplementary tables
  - id: effect_size_unknown
    statement: >-
      The magnitude of the cognitive difference is not in the retrieved abstract. "Higher
      cognitive performance" without an effect size cannot be compared to anything.
    resolved_by: the paper's results section
  - id: driver_gene_unknown
    statement: >-
      A multi-gene duplication does not identify a causal gene. Which gene or genes in the
      interval carry the association is unresolved, and a 2 Mb band containing eight
      protein-coding genes offers no way to attribute it.
    resolved_by: fine-mapping within the CNV, or dosage-matched functional work by others
  - id: replication_absent
    statement: >-
      The paper describes the finding as first-of-its-kind. As of this record, no
      independent replication has been identified. A single unreplicated CNV-GWAS
      association at a rare locus is a hypothesis.
    resolved_by: an independent cohort

# ------------------------------------------------ the DUPLICATED INTERVAL (verified) --
# From the paper's full text (Figure 1F legend and Results), read 2026-09-22.
duplicated_interval:
  coordinates: "chr2:109,510,927-110,376,563"
  assembly: hg19 (GRCh37) -- the paper states hg19 throughout
  hg38_cytoband_note: lies in 2q13 on GRCh38; the "2q12.3" label is an hg19 band
  size_kb: 865
  carriers: 36
  cohort_n: 258292
  population_frequency: "~1/7,200 (1-2 in 10,000 across cohorts)"
  effect_z: 0.434
  effect_p: 7.58e-3
  effect_in_iq_points_as_stated: 6.5
  reciprocal_deletion: {z: -0.526, p: 0.058, carriers: 12, note: "trend only, underpowered"}
  dosage_model_per_copy: {z: 0.415, p: 2.65e-3}
  post_hoc_carrier_t_test: {t: -3.76, df: 18.01, p: 0.001}
  multiple_testing_note: >-
    The gene-level CNV-GWAS tested 596 genes covered by >=30 duplications. p = 7.58e-3 is
    not below a Bonferroni threshold across those tests (0.05/596 = 8.4e-5). No corrected
    p-value for this locus was found in the text read here. Treat as nominal.
  genes:
    - {symbol: EDAR,     loeuf_as_stated: 0.91, gnomad_v2_loeuf: 0.906, clingen_dosage: uncurated,
       common_variant_magma_davies_p: 0.0895, note: "ectodysplasin A receptor; ectodermal (hair, teeth, sweat gland) biology"}
    - {symbol: SH3RF3,   loeuf_as_stated: 0.53, clingen_dosage: uncurated,
       common_variant_magma_davies_p: not_in_magma_output}
    - {symbol: SEPTIN10, previous_symbol: SEPT10, loeuf_as_stated: 1.17, gnomad_v2_loeuf: 1.169,
       clingen_dosage: uncurated, common_variant_magma_davies_p: 0.00225}
    - {symbol: SOWAHC,   loeuf_as_stated: 0.77, gnomad_v2_loeuf: 0.772, clingen_dosage: uncurated,
       common_variant_magma_davies_p: 0.00140}
  clingen_recheck: >-
    ClinGen gene curation (FTP, GRCh38, pulled 2026-09-22): none of EDAR, SH3RF3,
    SEPTIN10/SEPT10, SOWAHC has any dosage curation. UNEVALUATED -- not benign, not
    triplosensitive. The only nearby region curation (ISCA-37405, TS=40 "dosage
    sensitivity unlikely", hg38 chr2:110.10-110.23 Mb) lies outside the lifted interval.
  weak_convergence_note: >-
    SOWAHC and SEPTIN10 carry nominal COMMON-variant cognition signal (MAGMA, Davies 2018;
    ranks ~1,570 and ~1,780 of 18,418). Rare-CNV and common-variant signal in the same small
    region is a weak convergence, nominal on both sides, and the two genes are adjacent --
    it is one observation about a region, not two about genes.

