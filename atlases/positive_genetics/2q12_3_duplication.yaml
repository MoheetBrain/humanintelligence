# ------------------------------------------------------ why the constraint data is
# ------------------------------------------------------ the WRONG metric here --------
constraint_caveat:
  statement: >-
    LOEUF measures intolerance to LOSS of function. The variant of interest is a
    DUPLICATION. LoF constraint therefore does not speak to the mechanism at all: a gene
    can be highly LoF-constrained and completely insensitive to an extra copy, and vice
    versa.
  correct_metric: >-
    Triplosensitivity (for example pTriplo, or dosage-sensitivity curation from ClinGen).
    That metric is NOT in the data retrieved here, and its absence is the main gap in this
    record.
  why_it_is_recorded_anyway: >-
    Because the temptation to reach for LOEUF as a proxy is strong and the substitution is
    silent. Recording the numbers together with the reason they do not answer the question
    is safer than omitting them and having someone fetch them later without the caveat.
  consequence: >-
    SLC5A7 being in the second-most-constrained LoF decile is NOT evidence that
    duplicating it improves cognition. It is evidence that losing it is bad, which is a
    different claim about a different variant.
  correction_note: >-
    This sentence originally said "the most-constrained LoF decile". That was wrong.
    gnomAD's `oe_lof_upper_bin` is ZERO-indexed, so bin 0 is the most-constrained decile
    and SLC5A7's recorded value of 1 places it in the second. Corrected 2026-09-18 after
    a red-team pass checked the value against the stored snapshot
    (data/raw/opentargets/2026-09-18/, oeUpper 0.462, upperBin 1). The error did not
    change the argument — which is that LOEUF is the wrong metric for a duplication
    either way — but a wrong fact inside a correct argument still propagates.

# ------------------------------------------------------------ interpretation guards --
interpretation_guards:
  - >-
    This is an ASSOCIATION between a CNV and a cognitive measure. It is not a demonstrated
    mechanism, not a causal gene, not a direction of benefit for any intervention, and not
    an adult-modifiable control parameter.
  - >-
    A previous version of this file called SLC5A7 "mechanistically the most interesting
    gene here" inside its `genes[]` note. That was the exact over-reading the next guard
    warns against, committed in a data field where a consumer reading only `genes[]`
    would receive the promotion without the warning. Removed 2026-09-18. There is no
    defensible ranking of the eight genes by interest; there is only a 2 Mb band.
  - >-
    The presence of SLC5A7 in the interval will invite a cholinergic story, because the
    repository already holds CHRM1 as a muscarinic target and a choline-transporter
    connection is narratively satisfying. There is no evidence here that SLC5A7 is the
    driver gene, and eight protein-coding genes span the band. Treat any SLC5A7-centred
    reading as a hypothesis generated by adjacency, not by data.
  - >-
    Duplication carriers are not "enhanced humans". A positive association at a population
    level says nothing about any individual, and nothing about whether mimicking the
    duplication pharmacologically would do anything at all.
  - >-
    RGPD4 lies in a segmental-duplication family, where CNV calling is systematically
    error-prone. Any attribution to that gene needs the calling pipeline audited first.
  - >-
    The functional-burden result (deletions sensitive in subcortical/postsynaptic sets,
    duplications in cortical/presynaptic sets) is the more general claim in the paper and
    may be more robust than the single locus. It is also more easily over-generalised.

# --------------------------------------------------------------- red-team attack list --
red_team_should_attack:
  - Cohort dependence: how much of the 258,292 is UK Biobank, and does that overlap this repository's existing cognitive-GWAS evidence base?
  - Ancestry composition of the CNV-GWAS, and whether CNV frequency differs across ancestry groups in the same cohorts (the same group has published exactly that concern).
  - Winner's curse on a first-reported association at a rare CNV.
  - Whether the cognitive measure is a g-factor estimate or an educational-attainment proxy.
  - CNV calling quality in a segmental-duplication-rich region.
  - Whether "higher cognitive performance" survives adjustment for the correlates a CNV carrier population may differ on.

