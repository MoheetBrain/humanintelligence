  assessment_status: assessed
  level: 3
  rationale: Substantial. The gene's identified function is to close a developmental critical period,
    and the causal cognitive evidence comes from germline lines whose cortex developed without the brake.
    Converging reasons from the gene's function and from the perturbation design.
