- facet: safety_liability_burden
  assessment_status: assessed
  level: 0
  rationale: Searched and found nothing. No adverse-effect annotation exists for this target in the pinned
    Open Targets release and no GPR158-directed agent has been dosed in a human.
  search_basis: 'Searched Open Targets Platform 26.06 safetyLiabilities for ENSG00000151025 and ClinicalTrials.gov
    API v2 for interventional studies of agents directed at this target. A hit would have been any annotated
    adverse event for this target, or any registered human study of an agent acting on it with a safety
    readout. The empty Open Targets list means that SOURCE IS SILENT, not that the target is safe; per
    contract section 5.4 this level is not lowered by the weakness of the search, because weak evidence
    cannot establish the absence of a risk. Note that with the direction of desirable manipulation unresolved
    for this target, a liability grade would be unassessable even if annotation existed: the liability
    of agonism and of antagonism are different questions and it is not known which is proposed.'
  claim_refs: []
  counter_level: 0
  counter_rationale: Nothing establishes that modulating GPR158 in either direction is safe.
  counter_claim_refs: []
  limiting_factor: no pharmacology exists, and the target's sign is unresolved so the relevant liability
    question cannot be posed
- facet: developmental_confound_risk
  assessment_status: assessed
  level: 3
  rationale: Substantial. The excitability and affect evidence rests on germline deletions and the memory
    evidence on a germline knockout studied in AGED animals, so developmental contributions are unexcluded
    across the whole evidence base, and the aged-animal design adds a second uncontrolled life-stage confound
    on top of the developmental one. Converging exposure across all located designs.
  claim_refs:
  - CLM:brakes:GPR158:001
  - CLM:brakes:GPR158:002
  counter_level: 1
  counter_rationale: One adult regional restoration experiment exists, which is weak evidence that the
    mechanism is engageable in the adult.
  counter_claim_refs:
  - CLM:brakes:GPR158:002
  limiting_factor: every germline line in the evidence base permits lifelong compensation, and the one
    adult experiment is a single restoration result
