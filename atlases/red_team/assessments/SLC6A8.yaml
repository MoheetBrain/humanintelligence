# Red-team facet assessment - SLC6A8. Written by agent:red_team.
# Contract: docs/DATA_CONTRACT.md sections 5.2-5.4. schema_version 0.1.0.
#
# Both facets here are INVERSE-POLARITY: a HIGHER level is WORSE for the target.
# Per contract section 5.4, a methodological-weakness cap applies to `counter_level`
# and NEVER to `level` on these facets, because weak evidence cannot establish the
# ABSENCE of a risk. Every level-0 grade below therefore means "searched, found
# nothing", never "probably fine": an empty Open Targets safetyLiabilities list is
# recorded as that SOURCE BEING SILENT, and the accompanying `search_basis` says so.
#
# The corresponding audit, with the full 17-check catalogue, is
# evidence/audits/red_team/SLC6A8.yaml.
schema_version: 0.1.0
target_id: TGT:SLC6A8
assessed_by: agent:red_team
assessed_on: '2026-09-17'
rubric: facet_rubric_v0_1
scale: evidence_strength_v1
facets:
- facet: safety_liability_burden
  assessment_status: assessed
  level: 0
  rationale: Searched and found nothing. No adverse-effect annotation exists for this target in the pinned
    Open Targets release, and the intervention actually used in humans - oral creatine monohydrate - has
    a large exposure base with no dose-limiting cognitive or systemic liability reported in the pooled
    analyses retrieved here.
  search_basis: Searched Open Targets Platform 26.06 safetyLiabilities for ENSG00000130821 (empty list);
    read the adverse-event reporting in two pooled analyses of randomised creatine trials (SRC:PMID:35984306,
    SRC:PMID:39070254), neither of which reports a safety signal; and searched ClinicalTrials.gov for
    interventional studies of SLC6A8-directed agents. A hit would have been any annotated adverse event
    for this target, or any dose-limiting toxicity reported for creatine supplementation or for a transporter
    corrector. The empty Open Targets list means that source is silent, and per contract section 5.4 this
    level is not lowered by the weakness of the search.
  claim_refs: []
  counter_level: 2
  counter_rationale: Two pooled analyses of randomised trials of oral creatine supplementation in adults,
    totalling more than twenty trials, report no safety signal and no dose-limiting toxicity. That is
    one human interventional line of evidence with a relevant endpoint on the side of a wide tolerable
    window - although it bears on the SUBSTRATE, not on pharmacological modulation of the transporter
    itself.
  counter_claim_refs:
  - CLM:power:creatine_human:002
  - CLM:red_team:creatine:001
  limiting_factor: no agent that modulates the transporter protein has been dosed in a human, so the safety
    of the actual proposed intervention is unassessed; substrate loading is not transporter modulation
- facet: developmental_confound_risk
  assessment_status: assessed
  level: 4
  rationale: 'The highest developmental-confound grade in this audit, and the only level 4 the red team
    awards. It is not an inference from design weakness but a MEASURED result: the one study that separated
    timing found learning deficits after neonatal deletion and none after adult deletion, in the same
    model. That is replicated-quality human and animal evidence bearing directly on the facet''s proposition
    and consistent in direction - the human syndrome is developmental, the rodent dissociation is developmental,
    and both point the same way.'
  claim_refs:
  - CLM:power:SLC6A8:001
  - CLM:power:SLC6A8:002
  - CLM:power:SLC6A8:003
  counter_level: 0
  counter_rationale: 'Searched for evidence that adult manipulation of this transporter affects cognition
    and found the opposite: the adult-deletion arm of the timing study is itself a measured null. There
    is no evidence on this side.'
  counter_claim_refs: []
  limiting_factor: nothing would reduce this grade short of a new adult-onset experiment showing a cognitive
    effect, and the one experiment that looked found none
