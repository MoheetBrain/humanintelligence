rubric: facet_rubric_v0_1
scale: evidence_strength_v1
facets:
- facet: safety_liability_burden
  assessment_status: assessed
  level: 1
  rationale: 'Weak and indirect only. No adverse-effect annotation exists for any EIF2B subunit in the
    pinned Open Targets release. Against that, the class has real human exposure whose fate is unfavourable
    in a way the registry does not explain: two terminated trials and a withdrawn expanded-access programme,
    all with ''Company Decision'' as the stated reason. A dedicated cardiac-repolarisation study was conducted
    for this class, which indicates the developers considered a QT liability worth excluding.'
  claim_refs:
  - CLM:brakes:EIF2B_COMPLEX:006
  counter_level: 1
  counter_rationale: The class has been dosed in healthy volunteers and in patients across multiple completed
    phase 1 studies and two completed platform-trial regimens without a registry-recorded safety termination,
    which is weak evidence that a tolerable window exists.
  counter_claim_refs:
  - CLM:brakes:EIF2B_COMPLEX:003
  limiting_factor: the reasons for two terminations are undisclosed, so the most decision-relevant safety
    facts about this class are unavailable
- facet: developmental_confound_risk
  assessment_status: assessed
  level: 1
  rationale: Weak and indirect only, and this target is a positive case rather than a problem. The enhancing
    manipulation is an acute systemic small molecule in adult animals and the human genetic evidence includes
    an adult-onset disease form. The only developmental exposure is that the disorder's commonest presentations
    are paediatric.
  claim_refs:
  - CLM:brakes:EIF2B_COMPLEX:006
  counter_level: 3
  counter_rationale: 'Acute adult pharmacological perturbation with a cognitive readout in adult animals,
    plus a human adult-onset disease form with a stated mean age at onset: converging evidence across
    designs that the mechanism operates and matters in the adult.'
  counter_claim_refs:
  - CLM:brakes:EIF2B_COMPLEX:003
  - CLM:brakes:EIF2B_COMPLEX:006
  limiting_factor: the mechanism is gated on phosphorylated eIF2-alpha level, which cannot currently be
    measured in a living human, so adult modifiability is established without any way to dose against
    the state it depends on
