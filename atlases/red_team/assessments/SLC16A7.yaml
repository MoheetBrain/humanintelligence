# Red-team facet assessment - SLC16A7. Written by agent:red_team.
# Contract: docs/DATA_CONTRACT.md sections 5.2-5.4. schema_version 0.1.0.
#
# Both facets here are INVERSE-POLARITY: a HIGHER level is WORSE for the target.
# Per contract section 5.4, a methodological-weakness cap applies to `counter_level`
# and NEVER to `level` on these facets, because weak evidence cannot establish the
# ABSENCE of a risk. Every level-0 grade below therefore means "searched, found
# nothing", never "probably fine": an empty Open Targets safetyLiabilities list is
# recorded as that SOURCE BEING SILENT, and the accompanying `search_basis` says so.
#
# The corresponding audit, with the full 17-check catalogue, is
# evidence/audits/red_team/SLC16A7.yaml.
schema_version: 0.1.0
target_id: TGT:SLC16A7
assessed_by: agent:red_team
assessed_on: '2026-09-17'
rubric: facet_rubric_v0_1
scale: evidence_strength_v1
facets:
- facet: safety_liability_burden
  assessment_status: assessed
  level: 0
  rationale: Searched and found nothing specific to MCT2. No adverse-effect annotation exists for this
    target in the pinned Open Targets release, and no agent directed at MCT2 has been dosed in a human.
    The one human MCT safety read-out that exists is for MCT1 and its dose-limiting toxicities - retinopathy
    and anaemia - are functions of MCT1 in retina and erythrocyte, so they are deliberately not attributed
    here.
  search_basis: Searched Open Targets Platform 26.06 safetyLiabilities for ENSG00000118596 (empty list)
    and ClinicalTrials.gov API v2 for interventional studies of MCT-directed agents, which returned the
    AZD3965 MCT1 programme (NCT01791595) and nothing MCT2-selective. A hit would have been any annotated
    adverse event for this transporter, or any human study of an MCT2-selective agent with a safety readout.
    The empty Open Targets list means that source is silent, not that the target is safe; per contract
    section 5.4 this level is not lowered by the weakness of the search. NOTE that AZD3965 is reported
    to have activity at MCT2 as well as MCT1, so a future audit may be able to attribute part of that
    safety profile here - this audit declines to, because the isoform attribution of the observed toxicities
    is conventionally MCT1 and is not resolved in the registry record.
  claim_refs: []
  counter_level: 0
  counter_rationale: Nothing establishes that modulating MCT2 is safe either.
  counter_claim_refs: []
  limiting_factor: no MCT2-selective agent has been dosed in a human, and the existing MCT programme's
    toxicities cannot be attributed across isoforms from the retrieved record
- facet: developmental_confound_risk
  assessment_status: assessed
  level: 1
  rationale: Weak and indirect only, and this target is a positive case. Knockdown was performed in adult
    animals and tested within days, so no located result for this target depends on a developmental manipulation.
    The residual exposure is that transporter expression is developmentally regulated and a knockdown
    does not establish what a lifelong difference would do.
  claim_refs:
  - CLM:power:SLC16A7:003
  counter_level: 3
  counter_rationale: 'Adult, acute, adult-tested knockdown with a behavioural readout, replicated across
    studies: converging causal evidence that the mechanism is manipulable and behaviourally consequential
    in the adult animal.'
  counter_claim_refs:
  - CLM:power:SLC16A7:001
  - CLM:power:SLC16A7:003
  limiting_factor: all adult-onset evidence is rodent; there is no human evidence of any kind, so adult
    modifiability in humans is untested rather than established
