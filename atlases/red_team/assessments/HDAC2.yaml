# Red-team facet assessment - HDAC2. Written by agent:red_team.
# Contract: docs/DATA_CONTRACT.md sections 5.2-5.4. schema_version 0.1.0.
#
# Both facets here are INVERSE-POLARITY: a HIGHER level is WORSE for the target.
# Per contract section 5.4, a methodological-weakness cap applies to `counter_level`
# and NEVER to `level` on these facets, because weak evidence cannot establish the
# ABSENCE of a risk. Every level-0 grade below therefore means "searched, found
# nothing", never "probably fine": an empty Open Targets safetyLiabilities list is
# recorded as that SOURCE BEING SILENT, and the accompanying `search_basis` says so.
#
# The corresponding audit, with the full 17-check catalogue, is
# evidence/audits/red_team/HDAC2.yaml.
schema_version: 0.1.0
target_id: TGT:HDAC2
assessed_by: agent:red_team
assessed_on: '2026-09-17'
rubric: facet_rubric_v0_1
scale: evidence_strength_v1
facets:
- facet: safety_liability_burden
  assessment_status: assessed
  level: 3
  rationale: 'Converging evidence across designs for a substantial liability burden: thrombocytopenia,
    hepatotoxicity, fatigue, nausea and hypoacusis from the oncology-derived HDAC inhibitor class, including
    a human study establishing headache, plus the dose-limiting profile that has kept this class out of
    chronic non-oncology use. Level 3 rather than 4 because none of it comes from an HDAC2-SELECTIVE agent,
    so the burden attaches to the class rather than to this gene.'
  claim_refs:
  - CLM:brakes:HDAC2:005
  - CLM:brakes:HDAC2:003
  - CLM:brakes:HDAC2:004
  counter_level: 0
  counter_rationale: 'Searched for evidence that HDAC2-selective inhibition avoids the class liabilities
    and found none: no HDAC2-selective agent has been dosed in humans in any located study.'
  counter_claim_refs: []
  limiting_factor: the entire liability set is class-level; an isoform-selective agent might carry a different
    profile, and nothing establishes whether it would
- facet: developmental_confound_risk
  assessment_status: assessed
  level: 2
  rationale: The enhancement arm of the defining study is a constitutively Hdac2-deficient line, so a
    developmental contribution to the adult plasticity phenotype is unexcluded, and chromatin regulators
    are exactly the class where lifelong absence and adult inhibition are least likely to be equivalent.
    Replicated non-human causal evidence of the exposure.
  claim_refs:
  - CLM:brakes:HDAC2:001
  counter_level: 2
  counter_rationale: Adult pharmacological HDAC inhibition produces cognitive and molecular changes in
    adult animals and has been dosed in adult humans, establishing that the mechanism is engageable after
    development even though the agents are not isoform-selective.
  counter_claim_refs:
  - CLM:brakes:HDAC2:003
  - CLM:brakes:HDAC2:004
  limiting_factor: no adult-onset HDAC2-selective perturbation exists, so adult modifiability is established
    for the class and not for the gene
