schema_version: 0.1.0
target_id: TGT:GRIN2B
assessed_by: agent:red_team
assessed_on: '2026-09-17'
rubric: facet_rubric_v0_1
scale: evidence_strength_v1
facets:
- facet: safety_liability_burden
  assessment_status: assessed
  level: 2
  rationale: A curation annotation attributing convulsions, neurotoxicity, ataxia and psychosis to modulation
    in one or other direction, converging with a human genetic cohort of 86 patients in whom variants
    in this gene - both gain- and loss-of-function - cause a severe neurodevelopmental encephalopathy.
    Level 2 is 'one human study with a relevant endpoint', which the patient cohort satisfies.
  claim_refs:
  - CLM:red_team:GRIN2B:001
  - CLM:alphacognition:GRIN2B:004
  counter_level: 0
  counter_rationale: 'Searched for evidence that modulating this subunit is well tolerated and found none:
    no trial of a GluN2B-selective agent with a safety readout in healthy adults was retrieved.'
  counter_claim_refs: []
  limiting_factor: the human liability evidence is germline-variant disease, which speaks to developmental
    dosage rather than to adult pharmacological modulation; no adult pharmacological safety data exist
- facet: developmental_confound_risk
  assessment_status: assessed
  level: 3
  rationale: Substantial converging evidence for a developmental confound. Every rodent enhancement result
    uses constitutive overexpression from development; the human phenotype of perturbing the gene is a
    NEURODEVELOPMENTAL encephalopathy; and GluN2B itself undergoes a developmental switch in NMDA receptor
    subunit composition, so the adult and juvenile receptor populations differ. Three independent reasons,
    matching the dossier's own three.
  claim_refs:
  - CLM:alphacognition:GRIN2B:001
  - CLM:alphacognition:GRIN2B:002
  - CLM:alphacognition:GRIN2B:004
  counter_level: 0
  counter_rationale: Searched for an adult-restricted GluN2B perturbation with a cognitive readout - inducible
    deletion, adult viral manipulation or adult pharmacology with a cognitive endpoint - and located none.
  counter_claim_refs: []
  limiting_factor: no adult-onset perturbation of this subunit with a cognitive endpoint exists anywhere
    in the located literature, in any species
