# Red-team facet assessment - HCN1. Written by agent:red_team.
# Contract: docs/DATA_CONTRACT.md sections 5.2-5.4. schema_version 0.1.0.
#
# Both facets here are INVERSE-POLARITY: a HIGHER level is WORSE for the target.
# Per contract section 5.4, a methodological-weakness cap applies to `counter_level`
# and NEVER to `level` on these facets, because weak evidence cannot establish the
# ABSENCE of a risk. Every level-0 grade below therefore means "searched, found
# nothing", never "probably fine": an empty Open Targets safetyLiabilities list is
# recorded as that SOURCE BEING SILENT, and the accompanying `search_basis` says so.
#
# The corresponding audit, with the full 17-check catalogue, is
# evidence/audits/red_team/HCN1.yaml.
schema_version: 0.1.0
target_id: TGT:HCN1
assessed_by: agent:red_team
assessed_on: '2026-09-17'
rubric: facet_rubric_v0_1
scale: evidence_strength_v1
facets:
- facet: safety_liability_burden
  assessment_status: assessed
  level: 1
  rationale: Weak and indirect only. One germline-knockout rodent study shows increased seizure susceptibility
    and accelerated spontaneous seizures - now correctly typed preclinical_harm rather than clinical_harm
    - and the dossier additionally lists bradycardia, which the marketed HCN-blocker class carries but
    which no claim in this repository evidences. No adverse-effect annotation exists for this target in
    the pinned Open Targets release.
  claim_refs:
  - CLM:brakes:HCN1:005
  counter_level: 0
  counter_rationale: 'Searched for evidence that HCN1 modulation is well tolerated and found none: no
    human interventional study of an HCN1-directed agent with a safety readout was located.'
  counter_claim_refs: []
  limiting_factor: the seizure evidence is a germline knockout, which is the wrong design to estimate
    the liability of adult partial blockade, and it points in the direction OPPOSITE to brake release;
    no adult-onset or pharmacological safety data exist
- facet: developmental_confound_risk
  assessment_status: assessed
  level: 2
  rationale: The enhancement result uses a forebrain-restricted deletion that is spatially but not temporally
    restricted, so developmental reorganisation of dendritic excitability is unexcluded, and the h-current
    itself is under activity-dependent feedback control, which makes lifelong absence a different perturbation
    from adult blockade. Replicated non-human causal evidence of the developmental exposure, hence 2.
  claim_refs:
  - CLM:brakes:HCN1:001
  - CLM:brakes:HCN1:005
  counter_level: 1
  counter_rationale: The dossier notes a study using conditional overexpression, and the human dendritic
    recordings were made in adult tissue; both are weak evidence that the relevant physiology is present
    and measurable in the adult.
  counter_claim_refs:
  - CLM:brakes:HCN1:006
  limiting_factor: no adult-inducible deletion or adult pharmacological blockade of HCN1 with a cognitive
    endpoint and a stated induction age was located
