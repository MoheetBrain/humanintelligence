facets:
- facet: safety_liability_burden
  assessment_status: assessed
  level: 2
  rationale: 'Graded one level below KCNQ2 for the same reason agent:brakes graded its facets down: the
    evidence is about the KCNQ2/KCNQ3 heteromer rather than this subunit, so the liability attaches to
    the channel and not demonstrably to this gene. The channel-level facts are the market withdrawal of
    the only marketed modulator and seizures on M-current suppression.'
  claim_refs:
  - CLM:red_team:KCNQ2:001
  - CLM:brakes:KCNQ3:001
  counter_level: 0
  counter_rationale: Searched for evidence that KCNQ3-selective modulation is tolerable and found none;
    no KCNQ3-selective agent exists in any located study.
  counter_claim_refs: []
  limiting_factor: no subtype-selective pharmacology exists, so nothing distinguishes this subunit's liability
    from the heteromer's
- facet: developmental_confound_risk
  assessment_status: assessed
  level: 3
  rationale: 'Inherited from the same measured dissociation as KCNQ2, because the same manipulation produced
    it: M-current suppression during the first postnatal weeks disturbed hippocampal morphological development.
    Graded equal to KCNQ2 rather than lower because a developmental-confound risk is a property of the
    EVIDENCE BASE, and the evidence base is literally the same; discounting the risk for subunit ambiguity
    would be the inverse-polarity error contract section 5.4 forbids.'
  claim_refs:
  - CLM:brakes:KCNQ3:001
  counter_level: 1
  counter_rationale: The post-window arm of the same study is adult-onset, which is weak evidence of adult
    modifiability for this subunit specifically since the construct is not KCNQ3-selective.
  counter_claim_refs:
  - CLM:brakes:KCNQ3:001
  limiting_factor: no KCNQ3-selective manipulation at any life stage
