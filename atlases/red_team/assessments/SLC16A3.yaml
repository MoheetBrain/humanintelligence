facets:
- facet: safety_liability_burden
  assessment_status: assessed
  level: 0
  rationale: Searched and found nothing specific to MCT4. No adverse-effect annotation exists for this
    target in the pinned Open Targets release and no MCT4-selective agent has been dosed in a human. The
    AZD3965 ophthalmic and haematological toxicities are MCT1 functions in retina and erythrocyte and
    are not attributed here.
  search_basis: Searched Open Targets Platform 26.06 safetyLiabilities for ENSG00000141526 and ClinicalTrials.gov
    API v2 for interventional studies of agents directed at this target. A hit would have been any annotated
    adverse event for this target, or any registered human study of an agent acting on it with a safety
    readout. The empty Open Targets list means that SOURCE IS SILENT, not that the target is safe; per
    contract section 5.4 this level is not lowered by the weakness of the search, because weak evidence
    cannot establish the absence of a risk. The ClinicalTrials.gov search returned the AZD3965 MCT1 programme
    and nothing MCT4-selective. Attributing MCT1's retinopathy and anaemia to this isoform would convert
    one isoform's toxicity into three targets' liabilities, which is the same error as re-citing one paper
    to inflate evidence, so it is declined.
  claim_refs: []
  counter_level: 0
  counter_rationale: Nothing establishes that modulating MCT4 is safe either.
  counter_claim_refs: []
  limiting_factor: no MCT4-selective pharmacology exists in humans
- facet: developmental_confound_risk
  assessment_status: assessed
  level: 0
  rationale: 'Searched and found nothing. All three located claims are adult, acute knockdown in adult
    animals. This is a genuine searched zero, with the caveat the dossier itself makes: there is no developmental
    evidence for this target in EITHER direction, so the zero reflects a thin literature as much as an
    absent confound.'
  search_basis: 'Read every claim for SLC16A3 and inspected context.life_stage and causal_attribution.basis
    on each, then searched the whole claim set for any perturbation of this target with life_stage prenatal,
    postnatal_developmental or adolescent, or with basis germline_knockout or conditional_developmental_knockout.
    A hit would have been any manipulation beginning before adulthood, or any reported developmental requirement
    for this target. None exists in the located evidence: all three claims are adult acute knockdown.
    The dossier''s own statement that there is no developmental evidence either way is confirmed, and
    is recorded in limiting_factor rather than being allowed to read as reassurance.'
  claim_refs: []
  counter_level: 2
  counter_rationale: 'Adult acute knockdown in adult animals with behavioural readouts, replicated across
    three studies: replicated non-human causal evidence of adult modifiability.'
  counter_claim_refs:
  - CLM:power:SLC16A3:001
  - CLM:power:SLC16A3:003
  limiting_factor: no developmental evidence exists in either direction, and no human evidence of any
    kind, so the zero is uninformative as well as honest
