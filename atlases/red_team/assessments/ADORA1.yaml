# Red-team facet assessment - ADORA1. Written by agent:red_team.
# Contract: docs/DATA_CONTRACT.md sections 5.2-5.4. schema_version 0.1.0.
#
# Both facets here are INVERSE-POLARITY: a HIGHER level is WORSE for the target.
# Per contract section 5.4, a methodological-weakness cap applies to `counter_level`
# and NEVER to `level` on these facets, because weak evidence cannot establish the
# ABSENCE of a risk. Every level-0 grade below therefore means "searched, found
# nothing", never "probably fine": an empty Open Targets safetyLiabilities list is
# recorded as that SOURCE BEING SILENT, and the accompanying `search_basis` says so.
#
# The corresponding audit, with the full 17-check catalogue, is
# evidence/audits/red_team/ADORA1.yaml.
schema_version: 0.1.0
target_id: TGT:ADORA1
assessed_by: agent:red_team
assessed_on: '2026-09-17'
rubric: facet_rubric_v0_1
scale: evidence_strength_v1
facets:
- facet: safety_liability_burden
  assessment_status: assessed
  level: 2
  rationale: Convulsions annotated to A1 inhibition, which is the direction a caffeine-like intervention
    takes, plus dependence and insomnia as the best-documented human consequences of chronic antagonism.
    Graded 2 rather than higher because the annotation source is a curation table and because the cardiac
    and lethal entries in that table belong to the opposite direction and do not count towards this grade.
  claim_refs:
  - CLM:red_team:ADORA1:001
  - CLM:brakes:ADORA1:007
  counter_level: 1
  counter_rationale: Human exposure to A1 antagonism at behaviourally active doses is enormous and routine,
    which is prima facie evidence of a wide tolerable window; but no claim in this repository quantifies
    that, so it is recorded as weak rather than asserted as strong.
  counter_claim_refs:
  - CLM:brakes:ADORA1:003
  limiting_factor: no dose-ranging safety study of A1 antagonism in caffeine-naive adults was located,
    so the window is inferred from population exposure rather than measured
- facet: developmental_confound_risk
  assessment_status: assessed
  level: 1
  rationale: Weak and indirect only. The defining human intervention is acute adult pharmacology and the
    rodent mechanism is an ongoing homeostatic process rather than a developmental programme. The single
    exposure is a conditional knockout whose onset the retrieved text does not state.
  claim_refs:
  - CLM:brakes:ADORA1:001
  counter_level: 3
  counter_rationale: Acute adult human pharmacological perturbation with cognitive endpoints, in multiple
    independent studies including two nulls - one human interventional result with a directly relevant
    endpoint, several times over. Adult modifiability is not in doubt for this target.
  counter_claim_refs:
  - CLM:brakes:ADORA1:003
  - CLM:brakes:ADORA1:004
  - CLM:brakes:ADORA1:005
  limiting_factor: the onset of the conditional knockout is not stated in the retrieved text, so one rodent
    claim's life stage is unresolved
