facets:
- facet: safety_liability_burden
  assessment_status: assessed
  level: 4
  rationale: 'REPLICATED HUMAN evidence bearing directly on liability burden, consistent in direction.
    Two independent human lines: loss-of-function variants in THIS gene cause neonatal epileptic encephalopathy,
    so reducing this channel''s function carries a seizure liability evidenced by human monogenic disease;
    and the only modulator of this channel family ever marketed was WITHDRAWN FROM MARKET, which the registry
    states in its own whyStopped text. The rubric''s gloss for level 4 names ''a regulatory action on
    the mechanism'' explicitly, and a market withdrawal is one. The two lines concern OPPOSITE directions
    of manipulation, which is why they are not read as two replications of a single proposition - but
    the proposition this facet grades is whether engaging this channel carries serious human liability,
    and on that they agree. NOTE THE CONSEQUENCE: at level 4 with counter_level 0 this fires `safety_liability_caps_d5`
    in models/ranking/ranking_spec_v0_1.yaml, capping D5 at 0.20 - the lowest cap in that file. That is
    intended. THIS IS THE RED TEAM''S MOST CONTESTABLE GRADE and it is flagged as such: a reader who holds
    that the withdrawal''s undisclosed cause and opposite direction disqualify it should read this as
    level 3, and the gate would then not fire. The judgement is recorded here rather than buried, so it
    can be overridden without re-deriving it.'
  claim_refs:
  - CLM:red_team:KCNQ2:001
  - CLM:brakes:KCNQ2:003
  - CLM:brakes:KCNQ2:001
  counter_level: 0
  counter_rationale: Searched for evidence that modulating this channel in the brake-release direction
    is tolerable and found none. The human exposure that exists is all in the opposite direction and ended
    in market withdrawal.
  counter_claim_refs: []
  limiting_factor: the reason for the market withdrawal is stated nowhere in the retrieved registry record,
    so the identity of the limiting liability is known to exist but not known
- facet: developmental_confound_risk
  assessment_status: assessed
  level: 3
  rationale: 'Substantial, and unusually well evidenced: the defining study explicitly separated the regimes
    and found that suppression during the first postnatal weeks disturbed hippocampal MORPHOLOGICAL development,
    while suppression afterwards produced excitability and memory changes. Human loss-of-function variants
    cause a NEONATAL encephalopathy. Converging evidence that the developmental window is real and distinct.'
  claim_refs:
  - CLM:brakes:KCNQ2:001
  - CLM:brakes:KCNQ2:003
  counter_level: 2
  counter_rationale: The same study's post-window arm is a genuine adult-onset manipulation with a behavioural
    readout, which establishes that the mechanism is still modifiable after the developmental window -
    though what it produced was impairment.
  counter_claim_refs:
  - CLM:brakes:KCNQ2:001
  limiting_factor: the adult-onset arm shows modifiability in the harmful direction only; no adult manipulation
    in the beneficial direction has been performed
