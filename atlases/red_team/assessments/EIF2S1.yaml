scale: evidence_strength_v1
facets:
- facet: safety_liability_burden
  assessment_status: assessed
  level: 0
  rationale: Searched and found nothing. No adverse-effect annotation exists for EIF2S1 in the pinned
    Open Targets release and no agent directed at eIF2-alpha itself has been dosed in a human.
  search_basis: Searched Open Targets Platform 26.06 safetyLiabilities for ENSG00000134001 and ClinicalTrials.gov
    API v2 for interventional studies of agents directed at this target. A hit would have been any annotated
    adverse event for this target, or any registered human study of an agent acting on it with a safety
    readout. The empty Open Targets list means that SOURCE IS SILENT, not that the target is safe; per
    contract section 5.4 this level is not lowered by the weakness of the search, because weak evidence
    cannot establish the absence of a risk. The ISR-inhibitor clinical programme acts on eIF2B rather
    than on eIF2-alpha, so its terminations are recorded under EIF2B_COMPLEX and not attributed here.
  claim_refs: []
  counter_level: 0
  counter_rationale: Nothing establishes that modulating eIF2-alpha phosphorylation is safe either.
  counter_claim_refs: []
  limiting_factor: no pharmacology exists for this node of the pathway; and the mechanism is gated on
    phosphorylated eIF2-alpha level, which cannot be measured in a living human
- facet: developmental_confound_risk
  assessment_status: assessed
  level: 2
  rationale: Moderate. The causal evidence uses cell-type-restricted ablation of a phosphorylation site
    whose onset the retrieved abstract does not state, so a developmental contribution is unexcluded -
    and an unstated onset is a real exposure rather than a clean record. Graded 2 rather than 3 because
    the mechanism is an ongoing signalling process, not a developmental programme.
  claim_refs:
  - CLM:brakes:EIF2S1:001
  counter_level: 1
  counter_rationale: The pathway's acute pharmacological modulation in adult animals (recorded under EIF2B_COMPLEX)
    is weak evidence that this node is engageable in the adult, but it is evidence about a different protein
    in the same pathway.
  counter_claim_refs:
  - CLM:brakes:EIF2B_COMPLEX:003
  limiting_factor: the onset of the cell-type-restricted ablation is not stated in the retrieved text,
    so this grade could move in either direction on a full-text read
