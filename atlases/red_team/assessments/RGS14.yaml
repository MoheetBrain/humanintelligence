- facet: developmental_confound_risk
  assessment_status: assessed
  level: 3
  rationale: Substantial. The only causal evidence is a germline knockout; the protein is undetectable
    at birth and rises through the first postnatal weeks to a sustained adult level, so the knockout removes
    the brake precisely across hippocampal circuit construction; and no adult-onset perturbation exists
    in any species. Converging reasons from the developmental expression profile and the perturbation
    design.
  claim_refs:
  - CLM:brakes:RGS14:001
  - CLM:brakes:RGS14:002
  - CLM:brakes:RGS14:003
  counter_level: 0
  counter_rationale: Searched for any adult-restricted RGS14 manipulation - inducible deletion, adult
    viral knockdown, or adult pharmacology - with any behavioural or electrophysiological readout, and
    located none.
  counter_claim_refs: []
  limiting_factor: there is no adult-onset evidence for this target at all, so the developmental confound
    cannot currently be reduced by any amount of re-reading
