facets:
- facet: safety_liability_burden
  assessment_status: assessed
  level: 0
  rationale: Searched and found nothing. No adverse-effect annotation exists for this target in the pinned
    Open Targets release and no human or animal safety study of RGS14 modulation was located.
  search_basis: Searched Open Targets Platform 26.06 safetyLiabilities for ENSG00000169220 (empty list)
    and ClinicalTrials.gov API v2 for any interventional study naming an RGS14-directed agent (none).
