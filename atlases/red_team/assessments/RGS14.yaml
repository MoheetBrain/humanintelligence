    a safety readout. The empty list means the source is silent; per contract section 5.4 the weakness
    of this search does not lower this level, because weak evidence cannot establish the absence of a
    risk.
  claim_refs: []
  counter_level: 0
  counter_rationale: Nothing establishes that modulating RGS14 is safe either.
  counter_claim_refs: []
