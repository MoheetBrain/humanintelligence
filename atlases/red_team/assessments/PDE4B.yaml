# Red-team facet assessment - PDE4B. Written by agent:red_team.
# Contract: docs/DATA_CONTRACT.md sections 5.2-5.4. schema_version 0.1.0.
#
# Both facets here are INVERSE-POLARITY: a HIGHER level is WORSE for the target.
# Per contract section 5.4, a methodological-weakness cap applies to `counter_level`
# and NEVER to `level` on these facets, because weak evidence cannot establish the
# ABSENCE of a risk. Every level-0 grade below therefore means "searched, found
# nothing", never "probably fine": an empty Open Targets safetyLiabilities list is
# recorded as that SOURCE BEING SILENT, and the accompanying `search_basis` says so.
#
# The corresponding audit, with the full 17-check catalogue, is
# evidence/audits/red_team/PDE4B.yaml.
schema_version: 0.1.0
target_id: TGT:PDE4B
assessed_by: agent:red_team
assessed_on: '2026-09-17'
rubric: facet_rubric_v0_1
scale: evidence_strength_v1
facets:
- facet: safety_liability_burden
  assessment_status: assessed
  level: 2
  rationale: Emesis is the recognised dose-limiting liability of the PDE4 class and the dossier carries
    it with nausea, headache, insomnia, diarrhoea and dizziness, all from human exposure to marketed class
    members. One human study with a relevant endpoint, several times over. Graded 2 rather than 3 because
    none of it derives from a PDE4B-selective agent.
  claim_refs:
  - CLM:red_team:PDE4B:001
  - CLM:brakes:PDE4B:002
  counter_level: 2
  counter_rationale: The primary source reports that no PDE4-typical side effects occurred at the lowest
    and effective dose, in a randomised crossover in healthy adults. That is one human interventional
    result bearing directly on whether a usable window exists below the emetic threshold - the strongest
    counter-evidence to a liability grade anywhere in this audit apart from GABRA5's.
  counter_claim_refs:
  - CLM:red_team:PDE4B:001
  limiting_factor: the tolerability observation is from a single acute dose; nothing establishes that
    the sub-emetic window survives repeated dosing
- facet: developmental_confound_risk
  assessment_status: assessed
  level: 0
  rationale: 'Searched and found nothing. Every located result for this target is acute adult human or
    adult animal dosing, and there is no developmental manipulation in the evidence base at all. A genuine
    zero: the question was asked and the answer is clean.'
  search_basis: 'Read every claim for PDE4B and inspected context.life_stage and causal_attribution.basis
    on each, then searched the whole claim set for any perturbation of this target with life_stage prenatal,
    postnatal_developmental or adolescent, or with basis germline_knockout or conditional_developmental_knockout.
    A hit would have been any manipulation beginning before adulthood, or any reported developmental requirement
    for this target. None exists in the located evidence: all three human studies are acute adult dosing
    and no germline or developmental PDE4B manipulation appears anywhere in the claim set. NOTE that this
    is an absence of developmental evidence as well as an absence of developmental confound, which is
    a gap rather than a clean bill of health - but for an inverse-polarity facet the honest grade for
    ''no developmental dependence located'' is 0, with the gap recorded in limiting_factor.'
  claim_refs: []
  counter_level: 3
  counter_rationale: 'Three human studies of acute adult dosing with cognitive endpoints, one of them
    showing above-baseline improvement in healthy adults: converging human interventional evidence that
    the mechanism is modifiable in the adult.'
  counter_claim_refs:
  - CLM:red_team:PDE4B:001
  - CLM:brakes:PDE4B:001
  - CLM:brakes:PDE4B:003
  limiting_factor: no developmental evidence exists in either direction, so the zero reflects an unexamined
    literature as well as an absent confound
