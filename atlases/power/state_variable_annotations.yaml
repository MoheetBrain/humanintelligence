coverage_summary:
  power_domain_variables_total: 12
  power_domain_annotated_with_claims: 5
  efficiency_domain_variables_total: 10
  efficiency_domain_annotated_with_claims: 1
  note: >-
    Six of twenty-two variables carry a claim-supported response shape. Sixteen remain
    `unknown`. The unannotated set includes every variable H4 (thermal and oxidative
    limitation) depends on and every variable H2 (local supply-demand mismatch)
    depends on, which is why both hypotheses in
    atlases/power/competing_models.yaml are labelled untested rather than merely
    unsupported.
