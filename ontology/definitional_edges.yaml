# Definitional edges — Intelligence Blueprint v0.1.0
#
# CLAIM-FREE STRUCTURAL FACTS ONLY. Every edge here carries
# `provenance_class: ontology_axiom`, which means it is true by the definitions in
# this ontology and needs no evidence. That is a strong statement, so the bar is high
# and this file is deliberately short: PREFER FEWER AXIOMS OVER GUESSED FACTS.
#
# What is NOT allowed in this file
# --------------------------------
# * Anything empirical. No expression, no effect, no risk, no direction, no dose.
# * Gene -> Protein ENCODES edges. Those are REFERENCE DATA compiled in Phase 2 from
#   data/interim/gene_identifiers.jsonl (HGNC/UniProt) and an agent that hand-writes
#   one has violated contract §7. ontology/edges.yaml restricts ENCODES to
#   provenance_class: reference_data precisely so this file cannot contain one.
# * Any relation whose allowed_provenance_classes omits ontology_axiom. The validator
#   checks this, so a mistake here fails the build rather than entering the graph.
# * Anatomy the author is not certain of. UBERON accessions are NOT hand-written
#   (contract §7): the region axioms below use snake_case slugs and are limited to
#   gross containment that every standard atlas agrees on. Phase 2 resolves the slugs
#   to accessions through a fetch script, and that resolution is reference data.
#
# What IS in this file
# --------------------
# 1. MEMBER_OF_STATE_DOMAIN for all 92 declared state variables. Redundant with the
#    identifier by construction (SV:{domain}.{name}) and written out so that domain
#    membership is queryable in the graph rather than recovered by string parsing.
# 2. SUPPORTS_PRIMITIVE where the state variable IS the capacity the primitive names
#    by definition. These are the only primitive links treated as axioms; every other
#    primitive-to-biology link is empirical and needs a claim. The `basis` note on each
#    one states the definitional argument so a reviewer can attack it.
# 3. PART_OF for gross brain-region containment, minimal and uncontroversial.
#
# Each entry has: subject, predicate, object, provenance_class, basis, defined_by.

