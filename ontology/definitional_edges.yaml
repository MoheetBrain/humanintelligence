  # ---- 2. definitional state-variable -> primitive support ----

  - subject: SV:cognition.abstraction_capacity
    predicate: SUPPORTS_PRIMITIVE
    object: PRIM:abstraction
    provenance_class: ontology_axiom
    basis: >-
      The state variable is defined as the capacity to form representations that discard
      irrelevant detail, which is verbatim the primitive's operation.
    defined_by: agent:ontology

  - subject: SV:cognition.cognitive_flexibility
    predicate: SUPPORTS_PRIMITIVE
    object: PRIM:strategy_switching
    provenance_class: ontology_axiom
    basis: >-
      Cognitive flexibility is defined as changing the rule or strategy in use when required,
      including its cost — the primitive's operation plus its cost term.
    defined_by: agent:ontology

  - subject: SV:cognition.metacognitive_accuracy
    predicate: SUPPORTS_PRIMITIVE
    object: PRIM:metacognition
    provenance_class: ontology_axiom
    basis: >-
      Metacognitive accuracy is defined as the correspondence between the self-representation of
      reliability and actual reliability, i.e. the accuracy of the representation the primitive
      is defined to construct.
    defined_by: agent:ontology

  - subject: SV:cognition.transfer_breadth
    predicate: SUPPORTS_PRIMITIVE
    object: PRIM:far_transfer
    provenance_class: ontology_axiom
    basis: >-
      Transfer breadth is defined as the content distance at which a trained change is still
      detectable; far transfer is defined as that distance being large. Same quantity, different
      threshold.
    defined_by: agent:ontology

  - subject: SV:consolidation.memory_allocation_selectivity
    predicate: SUPPORTS_PRIMITIVE
    object: PRIM:memory_allocation
    provenance_class: ontology_axiom
    basis: >-
      The state variable is defined as the selectivity with which new traces are assigned to
      populations, which is the operation the primitive names.
    defined_by: agent:ontology

  - subject: SV:consolidation.reconsolidation_window_width
    predicate: SUPPORTS_PRIMITIVE
    object: PRIM:reconsolidation
    provenance_class: ontology_axiom
    basis: >-
      The window is defined as the interval during which the primitive's labile phase obtains;
      the variable has no meaning except as a parameter of this primitive.
    defined_by: agent:ontology

  - subject: SV:consolidation.retrieval_fidelity
    predicate: SUPPORTS_PRIMITIVE
    object: PRIM:memory_retrieval
    provenance_class: ontology_axiom
    basis: >-
      Retrieval fidelity is defined as the precision of the content the primitive returns, given
      that retrieval occurred.
    defined_by: agent:ontology

  - subject: SV:consolidation.retrieval_fidelity
    predicate: SUPPORTS_PRIMITIVE
    object: PRIM:pattern_completion
    provenance_class: ontology_axiom
    basis: >-
      Completion is defined as recovering the stored pattern rather than a blend; fidelity is
      the measure of how well that definitional requirement is met.
    defined_by: agent:ontology

  - subject: SV:workspace.attentional_gating_precision
    predicate: SUPPORTS_PRIMITIVE
    object: PRIM:attentional_gating
    provenance_class: ontology_axiom
    basis: >-
      The state variable is defined as the selectivity of admission to the capacity-limited
      stage, which is the operation the primitive names.
    defined_by: agent:ontology

  - subject: SV:workspace.binding_capacity
    predicate: SUPPORTS_PRIMITIVE
    object: PRIM:relational_binding
    provenance_class: ontology_axiom
    basis: >-
      Binding capacity is defined as the number of bindings maintainable without confusion; the
      primitive is defined as representing such a binding. Capacity presupposes the operation.
    defined_by: agent:ontology

  - subject: SV:workspace.binding_capacity
    predicate: SUPPORTS_PRIMITIVE
    object: PRIM:variable_binding
    provenance_class: ontology_axiom
    basis: >-
      Same definitional relation: role-value bindings are bindings, so the capacity variable
      bounds this primitive by definition.
    defined_by: agent:ontology

  - subject: SV:workspace.chunk_size
    predicate: SUPPORTS_PRIMITIVE
    object: PRIM:chunk_formation
    provenance_class: ontology_axiom
    basis: >-
      Effective chunk size is defined as the number of elements one formed chunk contains; it is
      the quantity the primitive's output is measured in.
    defined_by: agent:ontology

  - subject: SV:workspace.distractor_resistance
    predicate: SUPPORTS_PRIMITIVE
    object: PRIM:distractor_suppression
    provenance_class: ontology_axiom
    basis: >-
      The state variable is defined as the survival of maintained content against competing
      input, which is the outcome the primitive is defined to produce.
    defined_by: agent:ontology

  - subject: SV:workspace.persistent_activity_stability
    predicate: SUPPORTS_PRIMITIVE
    object: PRIM:persistent_representation
    provenance_class: ontology_axiom
    basis: >-
      The primitive is defined as maintaining information across a gap with no external carrier;
      this state variable is defined as the stability of exactly that maintained pattern. The
      two definitions name the same capacity at different levels.
    defined_by: agent:ontology

  - subject: SV:workspace.serial_order_fidelity
    predicate: SUPPORTS_PRIMITIVE
    object: PRIM:variable_binding
    provenance_class: ontology_axiom
    basis: >-
      Order fidelity is defined as the preservation of position-to-item assignment, which is a
      role-value binding in the primitive's sense.
    defined_by: agent:ontology

  - subject: SV:workspace.working_memory_capacity
    predicate: SUPPORTS_PRIMITIVE
    object: PRIM:persistent_representation
    provenance_class: ontology_axiom
    basis: >-
      Capacity is the count of items the primitive can hold concurrently; a capacity of zero is
      definitionally the absence of the primitive.
    defined_by: agent:ontology

