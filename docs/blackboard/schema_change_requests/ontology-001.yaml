# Schema change request ontology-001
#
# Filed by agent:ontology during Sprint 1 Phase 1. Every request here came from a
# defect found while turning docs/DATA_CONTRACT.md into executable form: the contract
# either could not be satisfied, or could not be satisfied truthfully.
#
# Resolutions are recorded in docs/blackboard/RESOLUTIONS.md where the orchestrator
# has ruled. `implemented_as` states what the code actually does now, so a reviewer can
# check the implementation against the request rather than against the intent.

schema_version: 0.1.0
request_id: ontology-001
filed_by: agent:ontology
filed_on: "2026-09-17"
blocking: false

request: >-
  Widen the contract §1 local-id charset to admit `#` and `/`.

motivation: >-
  Contract §1 declares local_id as [A-Za-z0-9._:+-]+, but two of the contract's OWN identifier
  forms cannot be written inside it. §1.3 defines an EVD id as {claim_local}#{n}, which needs
  '#'. And every DOI contains '/', so the contract's own example
  SRC:DOI:10.1101/2021.01.01.425001 is unwritable under the charset the same document
  declares. Found by tests/test_ids.py, which asserts that every identifier the contract gives
  as an example parses.

proposed_change: >-
  Amend §1 to [A-Za-z0-9._:+#/()<>\[\];-]+ , i.e. the declared set plus the characters the DOI
  grammar and the EVD form require. The per-node-type id_pattern remains the real gate and is
  far narrower.

implemented_as: >-
  blueprint.ids.LOCAL_ID_CHARSET admits the wider set with the reasoning in a comment.
  tests/test_ids.py::test_slash_is_admitted_for_dois_only_at_the_charset_level pins the
  behaviour: the coarse gate admits a slash, the Gene id_pattern refuses it.
