# Schema change request ontology-002
#
# Filed by agent:ontology during Sprint 1 Phase 1. Every request here came from a
# defect found while turning docs/DATA_CONTRACT.md into executable form: the contract
# either could not be satisfied, or could not be satisfied truthfully.
#
# Resolutions are recorded in docs/blackboard/RESOLUTIONS.md where the orchestrator
# has ruled. `implemented_as` states what the code actually does now, so a reviewer can
# check the implementation against the request rather than against the intent.

schema_version: 0.1.0
request_id: ontology-002
filed_by: agent:ontology
filed_on: "2026-09-17"
blocking: false

request: >-
  Add a StateDomain node type and an SVDOM prefix.

motivation: >-
  Contract §2 requires ontology/definitional_edges.yaml to carry state-variable domain
  membership as claim-free structural facts. A fact is a (subject, predicate, object) triple,
  and there was no node type for a state domain, so domain membership could only be recovered
  by parsing the first segment of an SV id. Prefixes are closed by §1, so adding one is an
  ontology change rather than a code change.

proposed_change: >-
  Add node type StateDomain with prefix SVDOM, and relation MEMBER_OF_STATE_DOMAIN
  (StateVariable -> StateDomain, ontology_axiom only).

implemented_as: >-
  Both declared. 101 axioms in ontology/definitional_edges.yaml, one per state variable.
  Redundant with the identifier by construction, and written out so domain membership is
  queryable in the graph rather than hidden in string parsing.
