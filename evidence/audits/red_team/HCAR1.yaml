# Red-team audit - HCAR1. agent:red_team, 2026-09-17.
# Contract section 6: every check in the mandatory catalogue appears, and
# `not_applicable` is a legitimate result but silence is not (rule V15).
# Adjustments are DOWNGRADES ONLY (rule V12); for `field: counter_level` a
# downgrade RAISES the level, because stronger contradicting evidence lowers
# the target's standing. Nothing here deletes or upgrades anything (P6).
- audit_id: AUD:red_team:HCAR1:001
  schema_version: 0.1.0
  scope:
    kind: target
    id: TGT:HCAR1
  audited_by: agent:red_team
  audited_on: '2026-09-17'
  checks:
  - check: association_mistaken_for_causation
    result: flag
    note: 'Every GWAS-derived claim in this repository carries causal_attribution.basis: gwas_association_only
      and locus_to_gene_resolved: ''no'' where attribution is positional, and causal_gene_attribution
      reaches 3 or 4 for no target. The records do not confuse association with causation. human_genetic_association
      reaches level 3 for nine targets on catalogued associations whose gene attribution is positional,
      while causal_gene_attribution reaches 0-2 for all 27 and 3-4 for none. The facet decomposition is
      correct and the association grade is not downgraded for the attribution gap - that would double-count
      it. The exposure is in the aggregation: D1 is a weighted sum, so a level-3 association contributes
      support at 0.25 weight regardless of the attribution level. Recorded against the model, not the
      atlas: evidence/audits/red_team/RANKING_MODEL.yaml.'
  - check: developmental_effect_mistaken_for_adult
    result: flag
    note: The clearest anatomical HCAR1 phenotype retrieved is developmental - retinal ganglion cell axon
      growth and ipsilateral projection to dLGN - and both in-vivo knockout studies used germline nulls,
      so lifelong compensation is permitted throughout.
    evidence_refs:
    - CLM:power:HCAR1:001
    - CLM:power:HCAR1:006
  - check: rescue_mistaken_for_enhancement
    result: flag
    note: All in-vivo evidence is germline loss of function producing impairment. No gain-of-function
      experiment exists.
    evidence_refs:
    - CLM:power:HCAR1:001
  - check: animal_memory_mistaken_for_human_intelligence
    result: fail
    note: 'Entirely rodent, and in the most consequential record not even a memory task: a motor endurance
      measure standing in for a cognitive state variable. No human evidence of any kind exists for this
      target.'
    evidence_refs:
    - CLM:power:HCAR1:004
  - check: educational_attainment_mistaken_for_intelligence
    result: pass
    note: No educational-attainment result is doing work an intelligence result should do for this target.
      Checked by tracing every claim_ref behind this target's human_genetic_association grade to its endpoint
      string, not to its phenotype_class label.
  - check: duplicated_evidence
    result: flag
    note: Source fan-in was computed across all 289 curated claims. Where several claims for this target
      share a source, the claims declare it in `dependencies` or `risks`. The ranking invariance requirement
      is what must enforce this downstream.
  - check: citation_dependence
    result: flag
    note: HCAR1 inherits the astrocyte-neuron lactate shuttle's credibility through lactate signalling,
      so it is one of the four power targets that move together if CLM:power:anls:001 falls.
    evidence_refs:
    - CLM:power:HCAR1:001
    - CLM:power:anls:001
  - check: publication_bias
    result: flag
    note: 'The repository''s evidence base is predominantly literature-derived, and a literature search
      cannot see an intervention that was performed and never published. agent:power demonstrated this
      concretely: a target-directed REGISTRY search overturned two of its own stated zeros. Treat every
      level-0 human-evidence grade in this repository as provisional on a registry search having been
      run.'
  - check: negative_clinical_evidence
    result: flag
    note: 'No human interventional study of HCAR1 modulation exists. The one human study in this region
      of pharmacology - exogenous lactate with a declared neurocognitive primary outcome, NCT01455376
      - completed in 2010 and has never reported. agent:power listed that trial as a reporting-gap reference
      on HCAR1 alone rather than across the three MCT targets, on the ground that it engages the transporters''
      substrate rather than the transporters. THE RED TEAM UPHOLDS THAT SCOPING and declines to widen
      it: counting one unreported study as four reporting gaps inflates a bias count by re-counting one
      study, which is structurally the same error as inflating evidence by re-citing one paper.'
    evidence_refs:
    - CLM:power:SLC16A1:005
    - SRC:NCT:NCT01455376
  - check: dose_response_inversion
    result: flag
    note: No exposure-response relation for a cognitive endpoint exists for this target in any species,
      so an inversion can be neither confirmed nor excluded. Recorded as a flag rather than a pass because
      absence of a curve is not absence of an inversion.
  - check: seizure_liability
    result: not_applicable
    note: No seizure liability is annotated for this target in Open Targets Platform 26.06 and none was
      located in the literature reviewed.
  - check: psychiatric_liability
    result: not_applicable
    note: No psychiatric liability is annotated for this target in Open Targets Platform 26.06 and none
      was located in the literature reviewed.
  - check: systemic_adverse_effects
    result: not_applicable
    note: No systemic adverse-effect annotation exists for this target in Open Targets Platform 26.06,
      and no human exposure to an agent directed at it was located.
  - check: model_organism_translation_failure
    result: flag
    note: 'Unassessable: no human evidence exists. Combined with the construct jump in the atlas''s own
      most-flagged record, this target''s evidence base is the thinnest of the deep dossiers.'
    evidence_refs:
    - CLM:power:HCAR1:004
  - check: overclaiming
    result: fail
    note: agent:power nominated CLM:power:HCAR1:004 as its own worst interpretive leap and the red team
      agrees. A weight-loaded SWIMMING ENDURANCE endpoint in male mice is mapped onto SV:cognition.sustained_attention_stability.
      The study measures neither cognition nor information processing; the mapping is the curating agent's
      argument, not the source's. The claim's own risks field says so. This is a construct jump, and unlike
      a weak citation it cannot be repaired by reading more carefully - the experiment did not measure
      the thing.
    evidence_refs:
    - CLM:power:HCAR1:004
  - check: provenance_integrity
    result: pass
    note: The construct jump is disclosed in both alternative_explanations and risks. The record is over-reaching
      but it is not concealing anything, which is why the response is a status change rather than a withdrawal.
    evidence_refs:
    - CLM:power:HCAR1:004
  - check: proposes_prohibited_work
    result: pass
    note: No record for this target proposes wet-lab, in-vitro, ex-vivo, animal or human experimentation
      by this project. Every experiment referenced is an external published result ingested as evidence.
      Proposed follow-ups in the dossiers and in atlases/power/competing_models.yaml are computational
      (re-analysis, meta-analysis, public-data tests).
  findings:
  - finding_id: AUD:red_team:HCAR1:001#f1
    severity: major
    category: overclaiming
    description: CLM:power:HCAR1:004 maps a weight-loaded swimming endurance endpoint in male mice onto
      a cognitive state variable. The source measured neither cognition nor information processing. The
      curating agent nominated this as its own worst leap and disclosed it in the record; the red team
      confirms it and changes the claim's status, because a construct jump cannot be fixed by re-reading
      the source.
    evidence_refs:
    - CLM:power:HCAR1:004
  claim_status_changes:
  - claim_id: CLM:power:HCAR1:004
    from: active
    to: contested
    reason: 'The endpoint is weight-loaded swimming endurance in male mice and the object is SV:cognition.sustained_attention_stability.
      The source measures a motor-endurance variable, so the mapping onto a cognitive state variable is
      the curating agent''s construct argument rather than the source''s finding, as that agent stated
      in the claim''s own risks field and nominated for audit. Contested rather than withdrawn: the underlying
      experiment is real and correctly described, and the defect is the construct the result is attached
      to, which a re-pointing to a motor state variable would fix.'
  verdict: retain_with_downgrade
  provenance:
    created_by: agent:red_team
    created_on: '2026-09-17'
    method: literature_curation
    run_id: sprint1-red-team-01
