# Red-team audit - GPR158. agent:red_team, 2026-09-17.
# Contract section 6: every check in the mandatory catalogue appears, and
# `not_applicable` is a legitimate result but silence is not (rule V15).
# Adjustments are DOWNGRADES ONLY (rule V12); for `field: counter_level` a
# downgrade RAISES the level, because stronger contradicting evidence lowers
# the target's standing. Nothing here deletes or upgrades anything (P6).
- audit_id: AUD:red_team:GPR158:001
  schema_version: 0.1.0
  scope:
    kind: target
    id: TGT:GPR158
  audited_by: agent:red_team
  audited_on: '2026-09-17'
  checks:
  - check: association_mistaken_for_causation
    result: flag
    note: 'Every GWAS-derived claim in this repository carries causal_attribution.basis: gwas_association_only
      and locus_to_gene_resolved: ''no'' where attribution is positional, and causal_gene_attribution
      reaches 3 or 4 for no target. The records do not confuse association with causation. human_genetic_association
      reaches level 3 for nine targets on catalogued associations whose gene attribution is positional,
      while causal_gene_attribution reaches 0-2 for all 27 and 3-4 for none. The facet decomposition is
      correct and the association grade is not downgraded for the attribution gap - that would double-count
      it. The exposure is in the aggregation: D1 is a weighted sum, so a level-3 association contributes
      support at 0.25 weight regardless of the attribution level. Recorded against the model, not the
      atlas: evidence/audits/red_team/RANKING_MODEL.yaml.'
  - check: developmental_effect_mistaken_for_adult
    result: fail
    note: The excitability and affect evidence rests on germline deletions and the memory evidence on
      a germline receptor knockout in AGED animals, so developmental contributions are unexcluded throughout.
      One adult regional restoration experiment exists, which is the only adult-onset evidence.
    evidence_refs:
    - CLM:brakes:GPR158:001
    - CLM:brakes:GPR158:002
  - check: rescue_mistaken_for_enhancement
    result: flag
    note: The memory evidence is in aged animals, so restoration cannot be separated from enhancement.
    evidence_refs:
    - CLM:brakes:GPR158:002
  - check: animal_memory_mistaken_for_human_intelligence
    result: flag
    note: Rodent affect and memory tasks with a conflicted sign; the human side is positional association.
    evidence_refs:
    - CLM:brakes:GPR158:002
  - check: educational_attainment_mistaken_for_intelligence
    result: flag
    note: 'GPR158''s level-3 human_genetic_association rests on two records: an intelligence association
      from SRC:PMID:29326435 and a verbal-numerical-reasoning association. The first is Hill 2018, which
      is an MTAG COMBINING EDUCATION AND INTELLIGENCE - it borrows statistical power from the education
      phenotype by construction, and its own abstract says education is genetically correlated with intelligence
      at r=0.70 and that the two GWAS were combined for power. So one of this target''s two directly-relevant
      records is an education-informed composite rather than a pure intelligence endpoint. The grade survives
      on the second record. Repository-level: the trait panel classes GWAS Catalog trait ''mathematical
      ability'' (EFO_0004875) as phenotype_class fluid_reasoning while marking it use_in_ranking: supporting
      with the note ''never a stand-alone basis for a facet level''. pipelines/alphacognition/build_assessments.py
      tests phenotype_class, not use_in_ranking, so that restriction never fires. The underlying records
      are ''Self-reported math ability'' and ''Highest math class taken (MTAG)'' from SRC:PMID:30038396,
      a genome-wide association study of EDUCATIONAL ATTAINMENT. Five claims rest entirely on such records:
      gwas.CRTC1:002, gwas.GRIN2B:003, gwas.OTX2:002, gwas.PDE4B:003, gwas.SLC16A7:002. See evidence/audits/red_team/GENETICS_FACET_RULE.yaml.'
    evidence_refs:
    - CLM:alphacognition:gwas.GPR158:001
    - CLM:alphacognition:gwas.GPR158:003
  - check: duplicated_evidence
    result: flag
    note: Source fan-in was computed across all 289 curated claims. Where several claims for this target
      share a source, the claims declare it in `dependencies` or `risks`. The ranking invariance requirement
      is what must enforce this downstream.
  - check: citation_dependence
    result: flag
    note: Two of the four genetic records for this target come from one MTAG publication, and the mechanistic
      literature is two conflicting small programmes.
    evidence_refs:
    - CLM:alphacognition:gwas.GPR158:001
    - CLM:alphacognition:l2g.GPR158:001
  - check: publication_bias
    result: flag
    note: 'The repository''s evidence base is predominantly literature-derived, and a literature search
      cannot see an intervention that was performed and never published. agent:power demonstrated this
      concretely: a target-directed REGISTRY search overturned two of its own stated zeros. Treat every
      level-0 human-evidence grade in this repository as provisional on a registry search having been
      run.'
  - check: negative_clinical_evidence
    result: not_applicable
    note: No human interventional study of GPR158 modulation exists.
  - check: dose_response_inversion
    result: flag
    note: 'With the sign unresolved, the exposure-response question cannot even be posed: it is not known
      which direction of manipulation is intended.'
    evidence_refs:
    - CLM:brakes:GPR158:003
  - check: seizure_liability
    result: not_applicable
    note: No seizure liability is annotated for this target in Open Targets Platform 26.06 and none was
      located in the literature reviewed.
  - check: psychiatric_liability
    result: not_applicable
    note: No psychiatric liability is annotated for this target in Open Targets Platform 26.06 and none
      was located in the literature reviewed.
  - check: systemic_adverse_effects
    result: not_applicable
    note: No systemic adverse-effect annotation exists for this target in Open Targets Platform 26.06,
      and no human exposure to an agent directed at it was located.
  - check: model_organism_translation_failure
    result: flag
    note: There is no human evidence for this target against which a model-organism result could fail,
      so translation is untested rather than failed. That is the maximum translation RISK and the minimum
      translation INFORMATION.
  - check: overclaiming
    result: fail
    note: 'agent:brakes records that this target''s SIGN IS UNRESOLVED: one literature makes it a prefrontal
      excitability brake, another makes it the receptor for a memory-promoting hormone in CA3, and the
      atlas records the conflict rather than picking a side. It grades mechanistic_causal_perturbation
      at level 1 with counter_level 2 - i.e. the contradicting evidence outweighs the supporting evidence.
      That agent asked whether, if that is right, the target belongs in a brake atlas at all. THE RED
      TEAM''S ANSWER IS THAT IT DOES NOT: a target whose direction of desirable manipulation is unknown
      is not a control point, and calling it a brake asserts a sign the evidence does not support. This
      is a legitimate finding and it is the reason for the deprioritise verdict.'
    evidence_refs:
    - CLM:brakes:GPR158:001
    - CLM:brakes:GPR158:002
    - CLM:brakes:GPR158:003
  - check: provenance_integrity
    result: pass
    note: The conflict is recorded in the claims and in the facet grades rather than resolved by assertion.
      That is the right handling of an unresolved sign.
    evidence_refs:
    - CLM:brakes:GPR158:003
  - check: proposes_prohibited_work
    result: pass
    note: No record for this target proposes wet-lab, in-vitro, ex-vivo, animal or human experimentation
      by this project. Every experiment referenced is an external published result ingested as evidence.
      Proposed follow-ups in the dossiers and in atlases/power/competing_models.yaml are computational
      (re-analysis, meta-analysis, public-data tests).
  findings:
  - finding_id: AUD:red_team:GPR158:001#f1
    severity: major
    category: overclaiming
    description: 'GPR158''s direction of desirable manipulation is unresolved in the evidence: one literature
      makes it an excitability brake, another the receptor for a memory-promoting hormone, and the brake
      atlas''s own grading puts the contradicting evidence above the supporting evidence. A target whose
      sign is unknown is not a control point, and its classification as a brake asserts a direction the
      evidence does not support. agent:brakes raised this question about its own target; the red team
      answers it.'
    evidence_refs:
    - CLM:brakes:GPR158:001
    - CLM:brakes:GPR158:003
  - finding_id: AUD:red_team:GPR158:001#f2
    severity: minor
    category: educational_attainment_mistaken_for_intelligence
    description: One of the two directly-relevant genetic records behind GPR158's level-3 grade is from
      an MTAG that combines education and intelligence GWAS for statistical power, so it is an education-informed
      composite rather than a pure intelligence endpoint. The grade survives on the other record.
    evidence_refs:
    - CLM:alphacognition:gwas.GPR158:001
  verdict: deprioritise
  provenance:
    created_by: agent:red_team
    created_on: '2026-09-17'
    method: literature_curation
    run_id: sprint1-red-team-01
