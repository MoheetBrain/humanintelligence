# Red-team audit - DRD1. agent:red_team, 2026-09-17.
# Contract section 6: every check in the mandatory catalogue appears, and
# `not_applicable` is a legitimate result but silence is not (rule V15).
# Adjustments are DOWNGRADES ONLY (rule V12); for `field: counter_level` a
# downgrade RAISES the level, because stronger contradicting evidence lowers
# the target's standing. Nothing here deletes or upgrades anything (P6).
- audit_id: AUD:red_team:DRD1:001
  schema_version: 0.1.0
  scope:
    kind: target
    id: TGT:DRD1
  audited_by: agent:red_team
  audited_on: '2026-09-17'
  checks:
  - check: association_mistaken_for_causation
    result: flag
    note: 'Every GWAS-derived claim in this repository carries causal_attribution.basis: gwas_association_only
      and locus_to_gene_resolved: ''no'' where attribution is positional, and causal_gene_attribution
      reaches 3 or 4 for no target. The records do not confuse association with causation. human_genetic_association
      reaches level 3 for nine targets on catalogued associations whose gene attribution is positional,
      while causal_gene_attribution reaches 0-2 for all 27 and 3-4 for none. The facet decomposition is
      correct and the association grade is not downgraded for the attribution gap - that would double-count
      it. The exposure is in the aggregation: D1 is a weighted sum, so a level-3 association contributes
      support at 0.25 weight regardless of the attribution level. Recorded against the model, not the
      atlas: evidence/audits/red_team/RANKING_MODEL.yaml.'
  - check: developmental_effect_mistaken_for_adult
    result: pass
    note: No developmental manipulation appears in the located evidence for this target.
  - check: rescue_mistaken_for_enhancement
    result: flag
    note: The inverted U means that whether a manipulation is rescue or enhancement depends entirely on
      where the individual sits on the curve, and nothing measures that in a living human.
    evidence_refs:
    - CLM:alphacognition:DRD1:001
  - check: animal_memory_mistaken_for_human_intelligence
    result: flag
    note: The inverted-U evidence is substantially non-human-primate and rodent working-memory work; the
      human genetic evidence is an education proxy.
    evidence_refs:
    - CLM:alphacognition:DRD1:001
  - check: educational_attainment_mistaken_for_intelligence
    result: flag
    note: 'DRD1''s human_genetic_association is level 1. Its one gwas record and one l2g record are both
      labelled educational_attainment, and the cap held. Repository-level: the trait panel classes GWAS
      Catalog trait ''mathematical ability'' (EFO_0004875) as phenotype_class fluid_reasoning while marking
      it use_in_ranking: supporting with the note ''never a stand-alone basis for a facet level''. pipelines/alphacognition/build_assessments.py
      tests phenotype_class, not use_in_ranking, so that restriction never fires. The underlying records
      are ''Self-reported math ability'' and ''Highest math class taken (MTAG)'' from SRC:PMID:30038396,
      a genome-wide association study of EDUCATIONAL ATTAINMENT. Five claims rest entirely on such records:
      gwas.CRTC1:002, gwas.GRIN2B:003, gwas.OTX2:002, gwas.PDE4B:003, gwas.SLC16A7:002. See evidence/audits/red_team/GENETICS_FACET_RULE.yaml.'
    evidence_refs:
    - CLM:alphacognition:gwas.DRD1:001
    - CLM:alphacognition:l2g.DRD1:002
  - check: duplicated_evidence
    result: flag
    note: Source fan-in was computed across all 289 curated claims. Where several claims for this target
      share a source, the claims declare it in `dependencies` or `risks`. The ranking invariance requirement
      is what must enforce this downstream.
  - check: citation_dependence
    result: flag
    note: Every Open Targets safetyLiabilities row used in this audit traces to one of two PMIDs, SRC:PMID:28216264
      and SRC:PMID:23197038, and both are pharmaceutical-industry safety-pharmacology curation reviews
      over overlapping published literature. Two rows agreeing is therefore close to one source agreeing
      with itself. The target-level safety layer for the six annotated seed targets rests on two review
      papers.
    evidence_refs:
    - CLM:red_team:DRD1:001
  - check: publication_bias
    result: flag
    note: 'The repository''s evidence base is predominantly literature-derived, and a literature search
      cannot see an intervention that was performed and never published. agent:power demonstrated this
      concretely: a target-directed REGISTRY search overturned two of its own stated zeros. Treat every
      level-0 human-evidence grade in this repository as provisional on a registry search having been
      run.'
  - check: negative_clinical_evidence
    result: flag
    note: No trial of a D1 agonist or modulator with a cognitive endpoint in healthy adults was located.
      agent:alphacognition typed its D1 record as an evidence gap rather than a null, which the red team
      verifies as correct.
    evidence_refs:
    - CLM:alphacognition:gap.DRD1:002
  - check: dose_response_inversion
    result: fail
    note: 'The textbook case, and the seed registry named it in advance: the D1 dose-response is an INVERTED
      U, with impairment at both low and high stimulation. agent:alphacognition graded dose_response_knowledge
      3 for this target, which is DRD1''s strength - the shape is known - and simultaneously the reason
      a ranking rule that rewards ''how far can this state variable be pushed'' would rank DRD1 well for
      the wrong reason. Checked against models/ranking/ranking_spec_v0_1.yaml: resolution R8 makes dose_response_knowledge
      a secondary input to D3 precisely so that an inverted U whose optimum sits at the healthy baseline
      counts as ABSENT supra-normal potential rather than as strength. The spec handles this correctly
      and the check passes at the model level even though it fails at the biology level.'
    evidence_refs:
    - CLM:alphacognition:DRD1:001
    - CLM:alphacognition:DRD1:002
  - check: seizure_liability
    result: flag
    note: Convulsions annotated to acute activation.
    evidence_refs:
    - CLM:red_team:DRD1:001
  - check: psychiatric_liability
    result: fail
    note: Psychosis, drug abuse and dependence, abuse potential, depression and suicidal intent are annotated
      across two curation reviews. This is the heaviest psychiatric liability in the audit apart from
      HTR2A's, and unlike HTR2A's it includes abuse liability, which is a distinct and harder problem
      for an enhancement context.
    evidence_refs:
    - CLM:red_team:DRD1:001
  - check: systemic_adverse_effects
    result: flag
    note: 'Fibrotic valvular heart disease and heart failure are annotated at CHRONIC activation - the
      only chronic-dosing rows in the whole safety set the red team retrieved. Chronic exposure is exactly
      the regime an enhancement use implies. Note the alternative reading recorded in the claim: valvular
      fibrosis is a well-known off-target 5-HT2B liability of some dopaminergic agonists rather than necessarily
      a D1 effect.'
    evidence_refs:
    - CLM:red_team:DRD1:001
  - check: model_organism_translation_failure
    result: flag
    note: There is no human evidence for this target against which a model-organism result could fail,
      so translation is untested rather than failed. That is the maximum translation RISK and the minimum
      translation INFORMATION.
  - check: overclaiming
    result: pass
    note: Read this target's dossier and facet rationales against its claims. No facet level exceeds what
      its cited claims support, and the limiting_factor fields state what would have to change.
  - check: provenance_integrity
    result: pass
    note: Every claim id, source id and node id referenced for this target resolves. No numeric field
      lacks an as_reported string or a derived_from pointer.
  - check: proposes_prohibited_work
    result: pass
    note: No record for this target proposes wet-lab, in-vitro, ex-vivo, animal or human experimentation
      by this project. Every experiment referenced is an external published result ingested as evidence.
      Proposed follow-ups in the dossiers and in atlases/power/competing_models.yaml are computational
      (re-analysis, meta-analysis, public-data tests).
  findings:
  - finding_id: AUD:red_team:DRD1:001#f1
    severity: major
    category: dose_response_inversion
    description: DRD1's dose-response is an inverted U with impairment at both extremes. Its high dose_response_knowledge
      grade encodes that the shape is KNOWN, not that the target can be pushed. The ranking spec handles
      this correctly via resolution R8, but any consumer reading the facet name without the rationale
      would rank this target well for the opposite of the right reason.
    evidence_refs:
    - CLM:alphacognition:DRD1:001
  - finding_id: AUD:red_team:DRD1:001#f2
    severity: major
    category: psychiatric_liability
    description: Psychosis, abuse potential and dependence are annotated to D1 activation across two reviews,
      with fibrotic valvular heart disease and heart failure at chronic dosing - the regime an enhancement
      use implies.
    evidence_refs:
    - CLM:red_team:DRD1:001
  verdict: retain_with_downgrade
  provenance:
    created_by: agent:red_team
    created_on: '2026-09-17'
    method: literature_curation
    run_id: sprint1-red-team-01
