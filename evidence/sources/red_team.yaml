  first_author: "Van Duinen MA"
  container: "Neuropharmacology"
  identifiers:
    pmid: "29241652"
    doi: "10.1016/j.neuropharm.2017.12.019"
  added_by: agent:red_team
  added_on: "2026-09-17"
  retrieval:
    method: pubmed_search
  notes: >-
    The only above-baseline human enhancement result anywhere in the brake atlas,
    retrieved independently by the red team in order to test it. Its own abstract
    states that the benefit occurred at the lowest of three doses and was confined to
    immediate recall, with 45-minute and 24-hour recall also measured. Roflumilast is
    a pan-PDE4 inhibitor and does not isolate PDE4B.

