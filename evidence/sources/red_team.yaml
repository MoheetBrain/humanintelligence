- source_id: SRC:PMID:39070254
  source_type: systematic_review
  title: "The effects of creatine supplementation on cognitive function in adults: a systematic review and meta-analysis."
  year: 2024
  first_author: "Xu C"
  container: "Front Nutr"
  identifiers:
    pmid: "39070254"
    doi: "10.3389/fnut.2024.1424972"
  added_by: agent:red_team
  added_on: "2026-09-17"
  retrieval:
    method: pubmed_search
  notes: >-
    An independent second pooled analysis, 16 RCTs and 492 participants, which the
    power atlas did not cite. It found no significant improvement in overall cognitive
    function or executive function, and reports that the benefit was larger in
    individuals with disease. Corroborates rather than contradicts the power atlas.

