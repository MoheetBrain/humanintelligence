# EVERY identifier here was seen in a tool response during this session:
#   * PMIDs via mcp__plugin_bio-research_pubmed__{search_articles,get_article_metadata}
#   * NCT ids via mcp__plugin_bio-research_c-trials__{search_trials,get_trial_details}
#     and then re-fetched from ClinicalTrials.gov API v2 into
#     data/raw/ctgov_v2/2026-09-17/ so that `whyStopped` is on disk and auditable.
#   * PMIDs 28216264 and 23197038 were reached from the `literature` field of
#     Open Targets Platform 26.06 `safetyLiabilities` rows, then verified as real
#     articles in PubMed. Registering them is the point: contract practice is to
#     cite the PMID a database annotation carries, not "Open Targets says so".
#
# NOTE ON DUPLICATE REGISTRATION (contract section 1.3): SRC:PMID:35123401 and
# SRC:PMID:30038396 are also registered by other agents. That is allowed and
# preferred, and the registry fields below were copied from the PubMed response in
# THIS session, not from the other agent's file, so a divergence would be a real
# disagreement rather than a copy error.
#
# NOTE ON WHAT IS *NOT* HERE: no source was registered to support a red-team
# opinion. Every one of the 17 records below carries at least one claim or at least
# one audit check's evidence_refs. Eight are registered specifically so that a
# NEGATIVE finding has provenance of the same quality this repository demands of a
# positive one, and two (SRC:NCT:NCT01791595, SRC:NCT:NCT01455376) were routed here
# by agent:power, which found them and correctly declined to grade them because the
# facet they bear on belongs to the red team.

- source_id: SRC:PMID:41983730
  source_type: journal_article
  title: "A Phase 2b Multicenter Study to Evaluate Basmisanil as an Adjunctive Treatment in Patients With Cognitive Impairment Associated With Schizophrenia."
  year: 2026
  first_author: "Umbricht D"
  container: "J Clin Psychiatry"
  identifiers:
    pmid: "41983730"
    doi: "10.4088/JCP.25m16022"
  added_by: agent:red_team
  added_on: "2026-09-17"
  retrieval:
    method: pubmed_search
  notes: >-
    The published result of NCT02953639 - the trial agent:brakes named as the single
    largest unresolved item in the GABRA5 dossier. Twenty-four weeks of an
    alpha5-GABA-A negative allosteric modulator did not improve the MATRICS
    neurocognitive composite or any functional measure, in any pre-specified subgroup,
    and the 80 mg arm was stopped for futility at a planned analysis.

