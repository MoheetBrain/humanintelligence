- source_id: SRC:NCT:NCT01455376
  source_type: clinical_trial_registration
  title: "Effect of Exogenous Lactate Infusion on Neurocognitive Function of Patients With Mild Traumatic Brain Injury"
  year: 2010
  first_author: "Universitas Padjadjaran"
  container: "ClinicalTrials.gov"
  identifiers:
    nct: "NCT01455376"
  added_by: agent:red_team
  added_on: "2026-09-17"
  retrieval:
    method: ctgov_api
  notes: >-
    Registered by the red team as the repository's canonical REPORTING gap, to be held
    distinct from its canonical MEASUREMENT gap. Completed in June 2010 with 60
    participants and a declared neurocognitive primary outcome, and has posted no results
    in sixteen years. A study that asked the question and never answered publicly is the
    exact asymmetry that makes a literature-only evidence base drift positive, and it is
    invisible to a literature search.
    DIVERGENCE CORRECTED 2026-09-17: this registration first carried the registry's
    `briefTitle`, which diverged from agent:power's registration of the same NCT id.
    agent:power's value was the correct one - `fetch_source_metadata.py` verifies against
    `officialTitle` first - and this record now matches it field for field. The error was
    the red team's, not agent:power's.
    A REPORTING gap is NOT recorded as a claim. It belongs in `reporting_gap_refs` on the
    lead atlas's facets, where agent:power has already placed it for HCAR1, and in this
    audit's `publication_bias` checks. An earlier red-team draft wrongly filed it as an
    `evidence_gap` claim; see docs/RED_TEAM_METHOD.md.
