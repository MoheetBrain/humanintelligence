    transporter or on the lactate receptor.

- source_id: SRC:NCT:NCT01791595
  source_type: clinical_trial_registration
  title: "A Cancer Research UK Phase I Trial of AZD3965, a Monocarboxylate Transporter 1 Inhibitor (MCT1) in Patients With Advanced Cancer"
  year: 2013
  first_author: "Cancer Research UK"
  container: "ClinicalTrials.gov"
  identifiers:
    nct: "NCT01791595"
  added_by: agent:power
  added_on: "2026-09-17"
  retrieval:
    method: ctgov_api
  notes: >-
    The only human MCT1-directed pharmacological intervention retrieved in this atlas.
    Completed, results posted, 53 participants. Every primary outcome is dose-limiting
    toxicity or adverse events and every secondary outcome is pharmacokinetic, cell-death
    marker or tumour response: there is NO cognitive endpoint anywhere in the protocol.
    That makes it an evidence gap rather than a reporting gap, and it carries
    CLM:power:SLC16A1:005.
