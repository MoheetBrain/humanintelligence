# ----------------- trial-registry records that GROUND level-0 facet zeros ----------
# Neither carries a claim. Both are registered so that the identifiers named in
# `search_basis` fields in atlases/power/assessments/ are machine-verified rather than
# asserted, and so a later agent can check the zeros rather than trusting them.

- source_id: SRC:NCT:NCT07285629
  source_type: clinical_trial_registration
  title: "Evaluating the Safety and Efficacy of Injectable Combination Klotho and Follistatin Plasmid Gene Therapy in Humans -- An Interventional, Non-Placebo Controlled Pilot Phase Study"
  year: 2025
  first_author: "Minicircle"
  container: "ClinicalTrials.gov"
  identifiers:
    nct: "NCT07285629"
  added_by: agent:power
  added_on: "2026-09-17"
  retrieval:
    method: ctgov_api
  notes: >-
    Registered so that the KL human_intervention_evidence zero can name it. A completed
    interventional study in healthy adults whose secondary outcomes include five NIH
    Toolbox cognitive measures, with no results posted, no placebo control, fourteen
    participants, and klotho co-administered with follistatin so that klotho's own
    contribution is unidentifiable by design.

