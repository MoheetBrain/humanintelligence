# Contract: docs/DATA_CONTRACT.md §3. Every record below was located through a PubMed
# tool call during the sprint-1 comparative curation run; none was written from memory.
# `title`, `year`, `first_author` and `container` are what this agent believes and are
# machine-checked by scripts/fetch_source_metadata.py against PubMed ESummary.
#
# No abstract text or source passage is stored anywhere in this repository.
#
# TWO SOURCES HERE ARE ALSO REGISTERED BY agent:brakes, DELIBERATELY:
#   SRC:PMID:30340039  (Beaulieu-Laroche 2018, human dendritic compartmentalisation)
#   SRC:PMID:20837545  (Lee 2010, RGS14 suppresses CA2 plasticity)
# Contract §1.3 allows and prefers duplicate registration across agents, so that every
# agent's claims are self-contained and no agent depends on a file it cannot edit. The
# store, the graph compiler and `independent_source_count` all deduplicate by
# `source_id`, so two registrations cannot inflate any evidence count. What IS a hard
# error is divergence: if two registrations of one `source_id` disagree on the verified
# registry fields, one of them was written from a different record. These two were
# checked field-by-field against evidence/sources/brakes.yaml before being written here
# and agree on title, year, first_author, container and DOI.
#
# The shared citation is itself a useful signal, not just bookkeeping. Both papers are
# load-bearing for agent:brakes' mechanistic case AND for this atlas's translation-risk
# case, which is exactly the pattern the red team's `citation_dependence` check exists to
# find: if either paper is wrong, two independent-looking lines of argument move together.
# The claims affected are CLM:comparative:DENDRITE:001, CLM:comparative:HCN1:004 and
# CLM:comparative:RGS14:001.

