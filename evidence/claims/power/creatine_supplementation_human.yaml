  statement: >-
    In a double-blind placebo-controlled crossover trial in 45 young adult vegetarians,
    oral creatine supplementation improved backward digit span and Raven's Advanced
    Progressive Matrices scores relative to placebo, which the authors attribute to a
    role for brain energy capacity in tasks requiring speed of processing.
  subject: METAB:creatine_monohydrate_supplementation
  predicate: CHANGES_STATE
  object: SV:cognition.fluid_reasoning_capacity
  claim_type: clinical_efficacy
  direction: increases
  context:
