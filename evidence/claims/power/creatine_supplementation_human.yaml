    life_stage: adult
    baseline_context: healthy_wildtype
    brain_regions: []
    cell_types: []
  phenotype_class: fluid_reasoning
  causal_attribution:
    basis: human_randomised_intervention
    locus_to_gene_resolved: not_applicable
    alternative_explanations:
      - "vegetarians have low dietary creatine intake, so this is a low-baseline population and the result is repletion rather than demonstrated enhancement above a normal baseline"
      - "a crossover design on Raven's matrices carries a practice-effect risk that the retrieved text does not describe controlling for"
      - "the later meta-analysis found no effect in the 11-31 year age band, which includes this cohort, so this single positive result is not corroborated by the pooled young-adult evidence"
      - "single site, single trial, 2003, and no independent replication was retrieved"
