    and physically active men and women, creatine monohydrate improved mean and peak
    cycling power output but had no effect on Stroop or Trail Making performance either
    before or after high-intensity exercise, and the authors note an apparent learning
    effect across the cognitive tests that may have masked any effect.
  subject: METAB:creatine_monohydrate_supplementation
  predicate: NO_DETECTED_EFFECT_ON
  negated_relation: CHANGES_STATE
  object: SV:cognition.attentional_control
  claim_type: clinical_null
