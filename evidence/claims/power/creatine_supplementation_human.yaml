# Claims — topic: human creatine supplementation and cognition
#
# Contract: docs/DATA_CONTRACT.md §4. Curated by agent:power.
#
# THIS FILE CONTAINS NO DOSES, REGIMENS OR SOURCING INFORMATION, BY DESIGN
# ------------------------------------------------------------------------
# docs/COMPUTATIONAL_ONLY_POLICY.md forbids it and this atlas is a constraint map,
# not advice. Where a source reported a dose, the paraphrase omits it.
#
# THE SHAPE OF THIS EVIDENCE BASE IS THE FINDING
# ----------------------------------------------
# 001  low-baseline group (vegetarians), normal state   -> positive, fluid reasoning
# 002  meta-analysis: positive overall, but the young-adult subgroup is NULL
# 003  young healthy active omnivores, normal state     -> NULL on every task
# 004  sleep-deprived state                             -> reduced deterioration
# 005  acute hypoxia                                    -> restored attention
#
# Read together, these say something specific and much narrower than "creatine
# improves cognition": the effect appears where the substrate baseline is low or the
# energetic state is stressed, and is absent in rested, fed, omnivorous young adults.
# That pattern is the single strongest piece of HUMAN evidence in this whole atlas,
# and its direction is toward H0 for the healthy-adult case and toward H2/H5 for
# stressed states. The response shape is recorded as `state_dependent`, not `linear`.

