- claim_id: CLM:power:creatine_human:002
  schema_version: 0.1.0
  statement: >-
    A systematic review and meta-analysis of ten randomised controlled trials in
    healthy individuals, eight of them pooled, found a small overall improvement in
    memory measures with creatine supplementation, but subgroup analysis showed the
    effect was carried by older adults while the younger band spanning roughly
    adolescence to early adulthood showed no effect at all, with dose, duration, sex
    and geographical origin not influencing the findings.
  subject: MECH:creatine_substrate_loading
  predicate: MODULATES
  object: PHENO:episodic_memory
  claim_type: causal_perturbation
  direction: state_dependent
  direction_context: >-
    Sign and magnitude depend on the baseline state of the substrate pool and on age
    band. In this pooled analysis the effect was carried by adults aged 66-76 and was
    absent in the 11-31 band; across the wider human evidence in this file, benefit
    appears where dietary creatine intake is low (vegetarians,
    CLM:power:creatine_human:001) or where the energetic state is stressed (sleep
    deprivation, CLM:power:creatine_human:004; acute hypoxia,
    CLM:power:creatine_human:005), and is absent in rested, fed, omnivorous young
    adults (CLM:power:creatine_human:003). The dependency is therefore on substrate
    baseline, age, and imposed energetic stress - not unknown.
  context:
    species: [SPECIES:NCBITaxon:9606]
    life_stage: mixed
    baseline_context: healthy_wildtype
    brain_regions: []
    cell_types: []
  phenotype_class: episodic_memory
  causal_attribution:
    basis: human_randomised_intervention
    locus_to_gene_resolved: not_applicable
    alternative_explanations:
      - "substantial heterogeneity is reported for the overall and older-adult estimates, so the pooled point estimates are unstable"
      - "the overall confidence interval nearly touches the null, so the aggregate positive finding is fragile"
      - "subgroup analysis by age is observational within a meta-analysis and is not a randomised comparison"
      - "only eight trials were pooled, which is too few to assess small-study effects or publication bias reliably"
  evidence:
    - source_id: SRC:PMID:35984306
      design: meta_analysis
      species: SPECIES:NCBITaxon:9606
      population: "healthy individuals across ten randomised controlled trials; subgroups aged 66-76 years and 11-31 years"
      sample_size:
        reported_as: "Ten RCTs examining the effect of creatine supplementation compared with placebo on measures of memory in healthy individuals met the inclusion criteria for systematic review, 8 of which were included in the meta-analysis."
        value: 10
        unit: trials
      endpoint: "pooled standardised mean difference in memory measures, overall and by age subgroup"
      endpoint_category: episodic_memory
      endpoint_measured: measured
      effect_direction: mixed
      effect_size:
        metric: smd
        as_reported: "Overall, creatine supplementation improved measures of memory compared with placebo (standard mean difference [SMD] = 0.29, 95%CI, 0.04-0.53; I2 = 66%; P = 0.02). Subgroup analyses revealed a significant improvement in memory in older adults (66-76 years) (SMD = 0.88; 95%CI, 0.22-1.55; I2 = 83%; P = 0.009) compared with their younger counterparts (11-31 years) (SMD = 0.03; 95%CI, -0.14 to 0.20; I2 = 0%; P = 0.72)."
        value: null
        ci_lower: null
        ci_upper: null
        p_value: null
      replication_status: replicated_independent
      evidence_role: qualifies
      extraction:
        basis: abstract
        extracted_by: agent:power
        extracted_on: "2026-09-17"
        content_checked: true
  translation:
    adult_relevance: demonstrated_in_adults
    healthy_baseline: tested_in_healthy
    supra_normal: no_enhancement_observed
    human_relevance: direct_human_interventional
    general_intelligence_relevance: single_domain_cognitive
  uncertainty:
    representation: ordinal_grade
    scale: evidence_strength_v1
    level: 3
    rationale: >-
      Pooled randomised human evidence with a relevant endpoint and a prospectively
      registered protocol; high heterogeneity, few trials, and the decisive
      young-adult null comes from a subgroup analysis rather than a dedicated trial.
    calibration_status: uncalibrated_subjective
  risks: []
  confounders: ["between-trial heterogeneity", "age composition", "baseline dietary creatine not reported in the pooled analysis"]
  dependencies: []
