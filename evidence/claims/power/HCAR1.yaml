    In mouse primary cortical neurons, HCAR1 agonists reduced miniature excitatory
    postsynaptic current frequency, reduced firing frequency and reduced spontaneous
    calcium spiking in wild-type but not receptor-null cells, while basal activity was
    higher in receptor-null neurons, so receptor activation lowers rather than raises
    network activity.
