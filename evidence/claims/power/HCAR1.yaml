# Claims — HCAR1 (GPR81, the G-protein-coupled receptor for L-lactate)
#
# Contract: docs/DATA_CONTRACT.md §4. Curated by agent:power. Declared depth: deep.
#
# READ THIS BEFORE USING THESE CLAIMS
# -----------------------------------
# The naive power-limitation story says: exercise raises lactate, lactate signals
# through HCAR1, therefore HCAR1 activation should raise cognitive capacity. The
# evidence retrieved here does NOT support that story, and three records actively
# cut against it:
#
#   001  HCAR1 activation DOWN-modulates cortical neuronal firing and spontaneous
#        calcium activity, and basal activity is HIGHER in receptor-null neurons.
#   002  An HCAR1 agonist enhanced memory when given AFTER training and IMPAIRED it
#        when given BEFORE training - the sign of the effect flips with timing.
#   004  Deleting the receptor INCREASED exercise endurance and preserved cortical
#        excitability; the lactate-HCAR1 axis was reported as a cause of central
#        fatigue, not a relief from it.
#
# 003 is a partial null (no HCAR1-dependent lactate effect in the hippocampal
# neurogenic niche), 005 is the concentration critique, and 006 is developmental only.
# There is NO human evidence for HCAR1 in this atlas.

