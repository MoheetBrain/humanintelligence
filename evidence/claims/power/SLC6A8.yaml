    Using tamoxifen-inducible ubiquitous deletion, the investigators report that mice
    losing Slc6a8 at postnatal day 5 developed Morris water maze and novel object
    recognition deficits whereas mice losing the same gene at postnatal day 60 showed
    no such deficits, so creatine transport was required during a developmental window
    rather than continuously in adulthood.
