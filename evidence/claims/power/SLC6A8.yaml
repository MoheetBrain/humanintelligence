# Claims — SLC6A8 (creatine transporter, SLC6 family)
#
# Contract: docs/DATA_CONTRACT.md §4. Curated by agent:power.
#
# READ THIS BEFORE USING THESE CLAIMS
# -----------------------------------
# SLC6A8 is the canonical rescue-vs-enhancement boundary case in this repository.
# Loss of function causes a severe developmental syndrome; that fact says almost
# nothing about whether adding creatine transport capacity to a healthy adult brain
# raises capacity. The claims below therefore separate:
#   (a) the human deficiency phenotype                       -> 001
#   (b) developmental vs adult-onset loss in rodents          -> 002 (adult loss: NO deficit)
#   (c) brain-autonomous vs whole-body loss                   -> 003
#   (d) cell-type locus of the deficit                        -> 004
#   (e) partial rescue of a deficit state                     -> 005, 006
# NOT ONE of these claims is evidence for above-baseline enhancement. 002 is the
# single most important record in this file and it argues AGAINST adult modifiability.

