    Mice lacking both brain-type cytosolic and ubiquitous mitochondrial creatine
    kinase largely failed to develop pentylenetetrazole-induced generalised seizures
    and showed no rhythmic electroencephalographic seizure activity, whereas all
    wild-type animals developed full seizures.
  subject: PROT:CKB
  predicate: POSITIVELY_REGULATES
  object: SV:safety.seizure_risk
  claim_type: causal_perturbation
  direction: increases
