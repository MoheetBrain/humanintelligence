# Claims — CKB (brain-type cytosolic creatine kinase, B-CK)
#
# Contract: docs/DATA_CONTRACT.md §4. Curated by agent:power.
#
# READ THIS BEFORE USING THESE CLAIMS
# -----------------------------------
# There is NO human perturbation evidence for CKB. The human records here (005, 006)
# are 31P-MRS associations with the phosphocreatine pool, which is the substrate of
# the creatine-kinase reaction but is not CKB-specific: no claim in this file
# establishes that changing CKB changes human cognition.
#
# 003 is the key counterweight: the creatine-kinase system is partially redundant,
# and the authors of the cited work state that the surviving reactions plus other
# phosphoryl-transfer systems sufficed for basic function. A power atlas that treats
# CKB as a bottleneck has not read that sentence.
#
# 001 is a SAFETY-DIRECTION result, not a cognitive one: creatine-kinase deficiency
# suppressed chemically induced seizures. Lower seizure susceptibility in a knockout
# is not evidence that inhibiting CKB is safe or useful.

