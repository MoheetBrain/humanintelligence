    brain_regions: [REGION:hippocampus]
    cell_types: []
  phenotype_class: electrophysiological_proxy
  causal_attribution:
    basis: germline_knockout
    locus_to_gene_resolved: not_applicable
    alternative_explanations:
      - "the model deletes two creatine-kinase isoforms simultaneously, so the effect cannot be assigned to CKB alone"
      - "germline deletion permits lifelong compensatory remodelling, including the hippocampal mossy-fibre changes reported by the same group"
