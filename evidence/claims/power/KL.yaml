# Claims — KL (klotho; systemic/endocrine modifier, not a brain energy transporter)
#
# Contract: docs/DATA_CONTRACT.md §4. Curated by agent:power. Declared depth: shallow.
#
# READ THIS BEFORE USING THESE CLAIMS
# -----------------------------------
# KL sits in this atlas as a SYSTEMIC MODIFIER, and its evidence base has a shape
# worth stating plainly: the enhancement claims (001, 002) are human OBSERVATIONAL
# genotype associations plus animal overexpression, the non-human primate result (004)
# is non-monotonic in dose, and there is a directly contradicting human cohort result
# (003) in which the same protective haplotype was associated with MORE dementia.
#
# Nothing here is an energy-supply claim. The reported mechanism runs through synaptic
# GluN2B and long-term potentiation, not through metabolic supply, so klotho is
# evidence about a modifier of computation, not evidence that computation is
# power-limited.

- claim_id: CLM:power:KL:001
  schema_version: 0.1.0
  statement: >-
    A lifespan-extending KLOTHO variant was associated with better cognition in
    heterozygous human carriers, and systemic klotho overexpression in mice improved
    performance across multiple learning and memory tests, enhanced long-term
    potentiation and enriched synaptic GluN2B, with the mouse effects abolished by
    GluN2B blockade and present in young as well as old animals.
  subject: GENE:KL
  predicate: ASSOCIATED_WITH
  object: PHENO:general_cognitive_ability
  claim_type: association
  direction: increases
  context:
    species: [SPECIES:NCBITaxon:9606, SPECIES:NCBITaxon:10090]
    life_stage: mixed
    baseline_context: healthy_wildtype
    brain_regions: []
    cell_types: []
  phenotype_class: not_reported
  causal_attribution:
    basis: human_observational_association
    locus_to_gene_resolved: partial
    alternative_explanations:
      - "the human arm is a genotype-phenotype association in existing cohorts, so population stratification and linkage with neighbouring variants are not excluded"
      - "the mouse arm is transgenic systemic overexpression from development, not an adult-onset intervention, so it cannot separate developmental from adult mechanisms"
      - "the mechanism reported is glutamatergic and synaptic, so this claim provides no support for an energy-supply account"
