- claim_id: CLM:power:KL:003
  schema_version: 0.1.0
  statement: >-
    In a prospective cohort of 527 initially cognitively unimpaired older men followed
    for ten years by data linkage, the same KL-VS variant reported as protective
    elsewhere was associated with a higher incidence of dementia, with risk increasing
    from heterozygous to homozygous carriers.
  subject: GENE:KL
  predicate: INCREASES_RISK
  object: AE:dementia
  claim_type: association
  direction: increases
  context:
    species: [SPECIES:NCBITaxon:9606]
    life_stage: aged
    baseline_context: healthy_wildtype
    brain_regions: []
    cell_types: []
  phenotype_class: clinical_cognitive_composite
  causal_attribution:
    basis: human_observational_association
    locus_to_gene_resolved: partial
    alternative_explanations:
      - "men only, single cohort, and the homozygous stratum contributed only a small number of person-years, so the dose-dependent reading rests on few events"
      - "dementia incidence by data linkage is a different endpoint from cognitive test performance, so this need not directly contradict the cognition associations"
      - "competing risk of death in an elderly male cohort can distort genotype-specific incidence"
  evidence:
