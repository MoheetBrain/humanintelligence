# Claims — topic: the brain signalling energy budget
#
# Contract: docs/DATA_CONTRACT.md §4. Curated by agent:power.
#
# EVERY NUMBER IN THIS FILE IS A MODEL OUTPUT, NOT A MEASUREMENT
# --------------------------------------------------------------
# Claims 001-004 are `claim_type: theoretical_construct` with
# `evidence.design: biophysical_model`. They are bottom-up apportionments computed
# from anatomical and electrophysiological parameters, not measured quantities. The
# clearest proof that they must be read that way is internal to this file: claim 002
# revised claim 001's apportionment substantially after the energy cost of the
# mammalian action potential was re-estimated. A budget that changed once can change
# again.
#
# 003 is included because it CONTRADICTS a premise this atlas would otherwise
# smuggle in: that myelination is an energy-saving adaptation.
#
# 005 is the only experimental record here, and it is a rodent deprivation-state
# result. It shows that an energy-precision trade-off exists and is actively
# regulated. It does NOT show that a rested, fed adult human sits on that trade-off.

- claim_id: CLM:power:budget:001
  schema_version: 0.1.0
  statement: >-
    Combining anatomical and physiological parameters into a bottom-up apportionment
    of excitatory signalling energy in rodent grey matter, the authors predict that
    action potentials and postsynaptic glutamate effects dominate the signalling
    budget with the resting potential and glutamate recycling much smaller, and argue
    that this favours distributed codes in which only a small fraction of neurons are
    simultaneously active.
  subject: PROC:cortical_signalling_energy_budget
  predicate: CONSTRAINS
  object: SV:efficiency.coding_sparseness
  claim_type: theoretical_construct
  direction: increases
  context:
    species: [SPECIES:NCBITaxon:10116, SPECIES:NCBITaxon:10090]
