    locus_to_gene_resolved: not_applicable
    alternative_explanations:
      - "a bottom-up model, not a measurement: the apportionment is only as good as the anatomical and conductance parameters fed into it"
      - "rodent parameters; the authors' own later work and the human budget work show substantial species differences in firing rate"
      - "sparse coding has many independent justifications (interference, capacity, learning) so an energy argument for it is not evidence that energy is what selected it"
