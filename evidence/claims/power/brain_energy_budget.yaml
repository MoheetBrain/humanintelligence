- claim_id: CLM:power:budget:003
  schema_version: 0.1.0
  statement: >-
    Deriving a signalling energy budget for CNS white matter and running a cost-benefit
    analysis of myelination, the authors report that white matter uses less energy than
    grey matter chiefly because its synapses are so few rather than because myelinated
    action potentials are cheaper, and that although the construction cost of myelin
    could be repaid by cheaper action potentials, the cost of maintaining the
    oligodendrocyte resting potential usually outweighs that saving, so myelination
    need not save energy.
  subject: PROC:axonal_myelination
  predicate: MODULATES
  object: SV:efficiency.axonal_conduction_efficiency
  claim_type: theoretical_construct
  direction: unclear
  context:
    species: [SPECIES:NCBITaxon:10116]
    life_stage: adult
    baseline_context: healthy_wildtype
    brain_regions: [REGION:optic_nerve, REGION:corpus_callosum]
    cell_types: [CELL:oligodendrocyte, CELL:neuron]
  phenotype_class: not_applicable
  causal_attribution:
    basis: computational_prediction
    locus_to_gene_resolved: not_applicable
    alternative_explanations:
      - "a model built on rodent optic nerve and corpus callosum parameters, and the authors describe the conclusion as surprising, which is a signal to check the inputs rather than to adopt the result"
      - "myelin's principal benefit is conduction speed, which the same analysis affirms; an energy-neutral adaptation can still be strongly advantageous"
  evidence:
