- claim_id: CLM:power:budget:005
  schema_version: 0.1.0
  statement: >-
    Using whole-cell recording and two-photon imaging in layer 2/3 of mouse visual
    cortex, the investigators found that food restriction reduced AMPA receptor
    conductance and synaptic ATP use while a compensatory rise in input resistance and
    a depolarised resting potential preserved spike rates, and that this saving came at
    the cost of more variable visually evoked subthreshold responses, broader
    orientation tuning and impaired fine visual discrimination, all reversed by
    exogenous leptin.
  subject: SV:power.glucose_oxidation_rate
  predicate: CONSTRAINS
  object: SV:efficiency.signal_to_noise_ratio
  claim_type: causal_perturbation
  direction: increases
  context:
    species: [SPECIES:NCBITaxon:10090]
    life_stage: adult
    baseline_context: sleep_deprived_or_stressed
    brain_regions: [REGION:visual_cortex]
    cell_types: [CELL:neuron]
  phenotype_class: cellular_excitability
  causal_attribution:
    basis: acute_circuit_perturbation
    locus_to_gene_resolved: not_applicable
    alternative_explanations:
      - "food restriction is a deprivation state; the result establishes that the trade-off is available and hormonally gated, not that it is active in a fed animal"
      - "the mechanism identified runs through leptin signalling, so it is a regulated set-point change rather than a direct supply limitation"
      - "the endpoint is fine visual discrimination in mouse V1, several inferential steps from human cognitive capacity"
      - "single laboratory, single study"
  evidence:
