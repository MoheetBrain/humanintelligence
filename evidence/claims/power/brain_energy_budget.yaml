- claim_id: CLM:power:budget:004
  schema_version: 0.1.0
  statement: >-
    Combining measured human and rat grey- and white-matter metabolic rates with a
    bottom-up biophysical calculation validated against PET, autoradiography, carbon-13
    magnetic resonance spectroscopy and electrophysiology, the authors report that
    awake resting cortical signalling accounts for roughly seventy per cent and
    mass-dependent non-signalling processes for roughly thirty per cent of glucose
    oxidation, that inhibitory neurons and glia together take a modest share, and that
    the implied human cortical glutamatergic signalling rate is several-fold lower than
    the rat's.
  subject: PROC:cortical_signalling_energy_budget
  predicate: CONSTRAINS
  object: SV:efficiency.housekeeping_to_compute_energy_ratio
  claim_type: theoretical_construct
  direction: unclear
  context:
