# Claims — topic: the astrocyte-neuron lactate shuttle (ANLS)
#
# Contract: docs/DATA_CONTRACT.md §4. Curated by agent:power.
#
# THIS TOPIC IS CONTESTED AND THIS FILE IS BUILT TO SHOW THAT
# -----------------------------------------------------------
# 001  the founding causal result                                     evidence_role: supports
# 002  the methodological critique: the shuttle was never measured    evidence_role: contradicts
# 003  a region- and phase-specific counter-result                    evidence_role: contradicts
# 004  a correlational result whose sign reverses with baseline       evidence_role: qualifies
# 005  reconsolidation of an appetitive drug memory                   evidence_role: supports
#
# Anyone consuming this atlas should note that 001, the founding study, and 002, the
# critique, are BOTH registered here with opposite roles and neither is marked
# withdrawn. The shuttle is not settled physiology in this repository and must not be
# compiled into the graph as though it were.
#
# All of it is rodent. None of it is human. None of it concerns a healthy rested adult
# human at normal baseline, and none of it tests whether increasing shuttle flux above
# normal increases anything.

- claim_id: CLM:power:anls:001
  schema_version: 0.1.0
  statement: >-
    In rat hippocampus, learning raised extracellular lactate derived from astrocytic
    glycogen, and blocking glycogen breakdown or the astrocytic lactate transporters
    produced amnesia and impaired maintenance of in-vivo long-term potentiation that
    L-lactate but not equicaloric glucose reversed, while short-term memory was spared.
  subject: PROC:astrocyte_neuron_lactate_shuttle
  predicate: POSITIVELY_REGULATES
  object: SV:consolidation.synaptic_consolidation_efficiency
  claim_type: causal_perturbation
  direction: increases
  context:
    species: [SPECIES:NCBITaxon:10116]
    life_stage: adult
    baseline_context: healthy_wildtype
    brain_regions: [REGION:hippocampus]
    cell_types: [CELL:astrocyte, CELL:neuron]
  phenotype_class: animal_fear_conditioning
  causal_attribution:
    basis: acute_circuit_perturbation
    locus_to_gene_resolved: not_applicable
    alternative_explanations:
      - "lactate transfer itself was not measured in this study; it is inferred from the effects of blocking transporters and from extracellular lactate levels"
      - "glycogenolysis inhibition also disturbs astrocytic potassium and calcium handling and glutamate synthesis, any of which could block consolidation without a fuel shuttle"
      - "rescue by L-lactate is equally compatible with lactate acting as a signal"
  evidence:
