- claim_id: CLM:power:anls:002
  schema_version: 0.1.0
  statement: >-
    Reviewing the shuttle literature, the author states that lactate shuttling was not
    measured in any of the studies used to support it and that the procedures used to
    inhibit glycogenolysis and neuronal monocarboxylate uptake are not specific, and
    proposes testable alternatives including disrupted potassium and calcium
    homeostasis, gliotransmitter release, inhibition of mitochondrial pyruvate
    transport by the blockers themselves, and interference with astrocytic filopodial
    movement.
  subject: PROC:astrocyte_neuron_lactate_shuttle
  predicate: MODULATES
  object: SV:consolidation.synaptic_consolidation_efficiency
  claim_type: theoretical_construct
