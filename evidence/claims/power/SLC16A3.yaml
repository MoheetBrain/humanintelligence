# Claims — SLC16A3 (MCT4; low-affinity, high-capacity, predominantly astrocytic
# monocarboxylate transporter, the canonical lactate EXPORTER of the shuttle)
#
# Contract: docs/DATA_CONTRACT.md §4. Curated by agent:power. Declared depth: shallow.
#
# READ THIS BEFORE USING THESE CLAIMS
# -----------------------------------
# All three claims are rodent knockdown-with-rescue. There is NO human evidence of
# any kind for SLC16A3 in this atlas: no human genetic phenotype was retrieved, no
# human intervention exists, and nothing tests whether raising MCT4 above normal does
# anything. The lactate-rescue pattern is the single most repeated observation in the
# lactate-shuttle literature and also the observation the critical literature says is
# most easily produced by non-specific energetic disruption.

- claim_id: CLM:power:SLC16A3:001
  schema_version: 0.1.0
  statement: >-
    Disrupting expression of the astrocytic lactate transporter MCT4 in rat
    hippocampus caused amnesia for an inhibitory avoidance task and impaired
    maintenance of in-vivo long-term potentiation, both reversed by L-lactate but not
    by equicaloric glucose.
  subject: PROT:SLC16A3
  predicate: POSITIVELY_REGULATES
  object: SV:consolidation.synaptic_consolidation_efficiency
  claim_type: causal_perturbation
  direction: increases
  context:
