    life_stage: adult
    baseline_context: healthy_wildtype
    brain_regions: [REGION:hippocampus]
    cell_types: [CELL:astrocyte]
  phenotype_class: animal_fear_conditioning
  causal_attribution:
    basis: acute_circuit_perturbation
    locus_to_gene_resolved: not_applicable
    alternative_explanations:
      - "the specificity of antisense knockdown and of pharmacological monocarboxylate-transport block is directly disputed in the critical literature"
      - "blocking astrocytic lactate export could disturb astrocytic potassium and calcium handling, which is an alternative route to memory impairment that does not require a fuel shuttle"
