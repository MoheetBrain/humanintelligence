    recurrent severe ketoacidosis, with mutational status correlated with ketoacidosis
    severity, MCT1 protein level and transport capacity, establishing a human
    loss-of-function phenotype that is an acid-base and ketone-utilisation disorder
    rather than a defined cognitive syndrome.
