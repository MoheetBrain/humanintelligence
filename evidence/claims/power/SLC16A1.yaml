      endpoint: "inhibitory avoidance long-term memory and in-vivo long-term potentiation maintenance, with L-lactate or glucose rescue"
      endpoint_category: animal_fear_conditioning
      endpoint_measured: measured
      effect_direction: decrease
      effect_size:
        metric: not_extracted
        as_reported: null
        value: null
        ci_lower: null
        ci_upper: null
        p_value: null
      replication_status: replicated_independent
      evidence_role: supports
      extraction:
        basis: abstract
        extracted_by: agent:power
        extracted_on: "2026-09-17"
        content_checked: true
  translation:
    adult_relevance: demonstrated_in_adults
    healthy_baseline: tested_in_healthy
    supra_normal: no_enhancement_observed
