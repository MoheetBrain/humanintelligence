# Claims — SLC16A1 (MCT1; astrocytic, endothelial and ubiquitous monocarboxylate
# transporter; also the principal extrahepatic ketone-body transporter)
#
# Contract: docs/DATA_CONTRACT.md §4. Curated by agent:power. Declared depth: shallow.
#
# READ THIS BEFORE USING THESE CLAIMS
# -----------------------------------
# SLC16A1 is the one lactate-axis gene in this atlas with a defined human
# loss-of-function phenotype, and that phenotype is METABOLIC (recurrent
# ketoacidosis), not primarily cognitive. Developmental delay is reported in
# homozygotes but not as the presenting or defining feature. This is direct human
# evidence against treating MCT1 as a cognitive bottleneck whose relief would raise
# capacity in a healthy adult - see CLM:power:SLC16A1:003.

- claim_id: CLM:power:SLC16A1:001
  schema_version: 0.1.0
  statement: >-
    Disrupting expression of the astrocytic lactate transporter MCT1 in rat
    hippocampus caused amnesia for an inhibitory avoidance task and impaired
    maintenance of in-vivo long-term potentiation, and both were reversed by L-lactate
    but not by equicaloric glucose.
  subject: PROT:SLC16A1
  predicate: POSITIVELY_REGULATES
  object: SV:consolidation.synaptic_consolidation_efficiency
  claim_type: causal_perturbation
  direction: increases
  context:
    species: [SPECIES:NCBITaxon:10116]
    life_stage: adult
    baseline_context: healthy_wildtype
    brain_regions: [REGION:hippocampus]
    cell_types: [CELL:astrocyte]
  phenotype_class: animal_fear_conditioning
  causal_attribution:
    basis: acute_circuit_perturbation
    locus_to_gene_resolved: not_applicable
    alternative_explanations:
      - "antisense knockdown specificity is disputed and MCT blockade can inhibit mitochondrial pyruvate transport, producing an energy crisis rather than a selective shuttle block"
      - "MCT1 is expressed in endothelium as well as astrocytes, so a vascular contribution to the deficit is not excluded by the retrieved text"
      - "rescue by L-lactate but not glucose is also consistent with lactate acting as a signal rather than as a transported fuel"
  evidence:
