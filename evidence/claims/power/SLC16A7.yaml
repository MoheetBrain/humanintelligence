  schema_version: 0.1.0
  statement: >-
    Disrupting expression of the neuronal lactate transporter MCT2 in rat hippocampus
    produced amnesia for an inhibitory avoidance task that, unlike amnesia from
    astrocytic MCT1 or MCT4 disruption, was not reversed by L-lactate or by
    equicaloric glucose.
  subject: PROT:SLC16A7
