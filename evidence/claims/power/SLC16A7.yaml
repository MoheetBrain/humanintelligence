# Claims — SLC16A7 (MCT2, the predominantly neuronal monocarboxylate transporter)
#
# Contract: docs/DATA_CONTRACT.md §4. Curated by agent:power.
#
# READ THIS BEFORE USING THESE CLAIMS
# -----------------------------------
# The MCT2 evidence is the strongest single strand of the astrocyte-neuron lactate
# shuttle hypothesis, because the same laboratories that could rescue astrocytic
# transporter knockdown with lactate could NOT rescue neuronal MCT2 knockdown with
# lactate, pyruvate, ketone body or glucose. That asymmetry is the argument.
#
# It is also entirely rodent, entirely knockdown-of-normal, and entirely within the
# antisense-oligodeoxynucleotide / viral-knockdown toolkit whose specificity is
# directly disputed - see CLM:power:anls:002 in
# evidence/claims/power/astrocyte_neuron_lactate_shuttle.yaml. There is NO human
# evidence of any kind for SLC16A7 in this atlas, and no evidence at any level that
# increasing MCT2 above normal improves anything.

