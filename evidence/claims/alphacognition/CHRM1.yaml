# Hand-curated claims — CHRM1 (lead atlas: alphacognition, dossier_depth: deep)
#
# CHRM1 is the only target in this atlas with a randomised, placebo-controlled,
# HEALTHY-ADULT human interventional result on cognitive endpoints (HTL0018318). It also
# has a long patient-population history (xanomeline in Alzheimer disease; the
# xanomeline-trospium combination in schizophrenia) whose cognitive and psychosis endpoints
# must not be pooled with healthy-adult enhancement, and a dose-limiting peripheral
# cholinergic safety burden that is part of the same pharmacology.
#
# Three separations are enforced explicitly below:
#   healthy adult enhancement   CLM:...:CHRM1:001
#   patient-population efficacy CLM:...:CHRM1:002 (cognition, AD), CLM:...:CHRM1:004 (psychosis)
#   safety / dose ceiling       CLM:...:CHRM1:003
# and one direction-reversing rodent result: CLM:...:CHRM1:005.
# schema_version: 0.1.0 (carried per claim below; contract §2 requires this file to be a YAML list)

- claim_id: CLM:alphacognition:CHRM1:001
  schema_version: 0.1.0
  statement: In a randomised, double-blind, placebo-controlled multiple-ascending-dose study of the selective
    M1 receptor partial agonist HTL0018318 in 36 healthy younger adults and 50 healthy elderly subjects
    at 15-35 mg/day for 10 days, the compound had significant effects on tests of short-term (working)
    memory (n-back) and learning (Milner maze), which the authors describe as having moderate to large
    effect sizes and label exploratory pro-cognitive effects.
  subject: GENE:CHRM1
  predicate: MODULATES
  object: PHENO:working_memory
  claim_type: pharmacodynamic
  direction: increases
  context:
    species:
    - SPECIES:NCBITaxon:9606
    life_stage: mixed
    baseline_context: healthy_wildtype
    brain_regions: []
    cell_types: []
  phenotype_class: working_memory
  causal_attribution:
    basis: human_randomised_intervention
    locus_to_gene_resolved: not_applicable
    alternative_explanations:
    - the cognitive battery was exploratory pharmacodynamics in a safety and pharmacokinetics study, not
      a pre-registered efficacy endpoint, so multiplicity is uncontrolled
    - the source reports mild or moderate cholinergic adverse events and modest increases in blood pressure
      and pulse rate; unblinding by peripheral effects is not excluded
    - HTL0018318 is described as selective for M1 but receptor selectivity in vivo is never absolute,
      so the effect is attributable to the compound rather than strictly to CHRM1
    - two cohorts (younger adults, elderly) are pooled in the reported cognitive finding
  evidence:
  - source_id: SRC:PMID:33883008
    design: rct_parallel
    species: SPECIES:NCBITaxon:9606
    population: healthy younger adults (n = 36, 3 cohorts) and healthy elderly subjects (n = 50, 4 cohorts),
      oral 15-35 mg/day HTL0018318 or placebo
    sample_size:
      reported_as: healthy younger adult (n = 36; 3 cohorts) and elderly (n = 50; 4 cohorts) subjects
      value: 86
      unit: participants
    endpoint: neurocognitive battery including n-back short-term (working) memory and Milner maze learning;
      electrophysiological biomarkers of synaptic and cognitive function
    endpoint_category: working_memory
    endpoint_measured: measured
    effect_direction: increase
    effect_size:
      metric: not_extracted
      as_reported: significant effects on tests of short-term (working) memory (n-back) and learning (Milner
        maze) with moderate to large effect sizes
      value: null
      ci_lower: null
      ci_upper: null
      p_value: null
    replication_status: single_study
    evidence_role: supports
    extraction:
      basis: abstract
      extracted_by: agent:alphacognition
      extracted_on: '2026-09-17'
      content_checked: true
    note: Registered as Netherlands Trial Register NTR5781, which scripts/fetch_source_metadata.py cannot
      verify; the identifier is recorded here for traceability only and no SRC:NTR source was invented.
  translation:
    adult_relevance: demonstrated_in_adults
    healthy_baseline: tested_in_healthy
    supra_normal: enhancement_above_healthy_baseline
    human_relevance: direct_human_interventional
    general_intelligence_relevance: single_domain_cognitive
  uncertainty:
    representation: ordinal_grade
    scale: evidence_strength_v1
    level: 3
    rationale: one randomised placebo-controlled human study in healthy adults with directly relevant
      cognitive endpoints; single study, exploratory endpoints, small cohorts
    calibration_status: uncalibrated_subjective
  risks:
  - single sponsor-affiliated study; the red team should audit citation_dependence and sponsor involvement
    (several authors are affiliated with the developer)
  - the phrase 'moderate to large effect sizes' is the authors' wording and is recorded verbatim; no numeric
    effect size was extracted and none should be inferred
  - a 10-day exposure says nothing about whether the effect persists, tolerates, or reverses
  confounders:
  - peripheral cholinergic side effects as an unblinding cue
  - practice effects across repeated cognitive testing
  - pooling of younger and elderly cohorts
  dependencies: []
  status: active
  provenance:
    created_by: agent:alphacognition
    created_on: '2026-09-17'
    method: literature_curation
    run_id: sprint1-alphacognition-curation-01
- claim_id: CLM:alphacognition:CHRM1:002
  schema_version: 0.1.0
  statement: In a 6-month randomised, double-blind, placebo-controlled trial of oral xanomeline, an M1/M4-selective
    muscarinic agonist, in 343 patients with mild to moderate probable Alzheimer disease, the high-dose
    arm showed a significant treatment effect on the cognitive subscale of the Alzheimer's Disease Assessment
    Scale and on the Clinician's Interview-Based Impression of Change relative to placebo.
  subject: CPD:CHEMBL21536
  predicate: CHANGES_STATE
  object: PHENO:clinical_cognitive_composite
  claim_type: clinical_efficacy
  direction: increases
  context:
    species:
    - SPECIES:NCBITaxon:9606
    life_stage: aged
    baseline_context: disease_population
    brain_regions: []
    cell_types: []
  phenotype_class: clinical_cognitive_composite
  causal_attribution:
    basis: human_randomised_intervention
    locus_to_gene_resolved: not_applicable
    alternative_explanations:
    - xanomeline is an M1 AND M4 agonist (ChEMBL records both mechanisms), so the cognitive effect is
      not attributable to CHRM1 alone
    - a deficit-state population with cholinergic denervation; benefit there is restoration toward a lost
      baseline, not enhancement of an intact one
    - 52% discontinuation in the high-dose arm makes the completer analysis vulnerable to informative
      dropout
  evidence:
  - source_id: SRC:PMID:9109749
    design: rct_parallel
    species: SPECIES:NCBITaxon:9606
    population: 343 men and women at least 60 years of age with mild to moderate probable Alzheimer disease,
      outpatients at 17 centres in the United States and Canada
    sample_size:
      reported_as: A total of 343 men and women at least 60 years of age with mild to moderate AD
      value: 343
      unit: participants
    endpoint: ADAS-Cog, Clinician's Interview-Based Impression of Change, Alzheimer's Disease Symptomatology
      Scale, Nurses' Observational Scale for Geriatric Patients
    endpoint_category: clinical_cognitive_composite
    endpoint_measured: measured
    effect_direction: increase
    effect_size:
      metric: p_value_only
      as_reported: A significant treatment effect existed for ADAS-Cog (high dose vs placebo; P < or =
        .05), and CIBIC+ (high dose vs placebo; P < or = .02)
      value: null
      ci_lower: null
      ci_upper: null
      p_value: null
    replication_status: replicated_same_group
    evidence_role: supports
    extraction:
      basis: abstract
      extracted_by: agent:alphacognition
      extracted_on: '2026-09-17'
      content_checked: true
    note: The same trial is reported twice in the literature (a companion report exists); it is registered
      and cited once, under this PMID, so that a single trial cannot be counted as two independent results.
  translation:
    adult_relevance: demonstrated_in_adults
    healthy_baseline: deficit_state_only
    supra_normal: rescue_only
    human_relevance: direct_human_interventional
    general_intelligence_relevance: multi_domain_cognitive
  uncertainty:
    representation: ordinal_grade
    scale: evidence_strength_v1
    level: 2
    rationale: large randomised human trial with a cognitive endpoint, but a patient population, a mixed
      M1/M4 agonist, and a completer analysis undermined by high dropout
    calibration_status: uncalibrated_subjective
  risks:
  - this result is the canonical rescue-mistaken-for-enhancement hazard for CHRM1 and must never be pooled
    with CLM:alphacognition:CHRM1:001
  - the trial dates from 1997 and the oral formulation was abandoned on tolerability grounds
  confounders:
  - cholinergic denervation in Alzheimer disease
  - M4 agonism
  - differential dropout
  dependencies: []
  status: active
  provenance:
    created_by: agent:alphacognition
    created_on: '2026-09-17'
    method: literature_curation
    run_id: sprint1-alphacognition-curation-01
