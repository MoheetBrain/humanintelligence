- claim_id: CLM:alphacognition:CHRM1:004
  schema_version: 0.1.0
  statement: A random-effects meta-analysis of three double-blind randomised placebo-controlled trials
    in adults with schizophrenia experiencing acute psychosis reported that the xanomeline-trospium combination
    was superior to placebo on PANSS total, positive and negative subscale scores, was comparable to placebo
    on all-cause discontinuation and on metabolic and extrapyramidal measures, and was associated with
    a higher incidence of at least one adverse event, dry mouth, hypertension, nausea, vomiting, dyspepsia,
    constipation and increased serum triglyceride.
  subject: CPD:CHEMBL21536
  predicate: INCREASES_RISK
  object: AE:nausea
  claim_type: clinical_harm
  direction: increases
  context:
    species:
    - SPECIES:NCBITaxon:9606
    life_stage: adult
    baseline_context: disease_population
    brain_regions: []
    cell_types: []
  phenotype_class: not_applicable
  causal_attribution:
    basis: human_randomised_intervention
    locus_to_gene_resolved: not_applicable
    alternative_explanations:
    - the combination includes trospium, a peripherally restricted non-selective muscarinic antagonist
      added specifically to blunt peripheral cholinergic effects, so neither the efficacy nor the residual
      adverse events are attributable to M1 agonism alone
    - the efficacy endpoint is psychosis severity, not cognition; the meta-analysis addressed safety and
      tolerability outcomes
  evidence:
  - source_id: SRC:PMID:39880004
    design: meta_analysis
    species: SPECIES:NCBITaxon:9606
    population: adults with schizophrenia experiencing acute psychosis, pooled from three double-blind
      randomised placebo-controlled trials
    sample_size:
      reported_as: three double-blind, randomized placebo-controlled trials in adults with schizophrenia
        experiencing acute psychosis
      value: null
      unit: trials
    endpoint: PANSS total and subscale change; discontinuation; metabolic, cardiovascular and gastrointestinal
      adverse events
    endpoint_category: not_applicable
    endpoint_measured: measured
    effect_direction: increase
    effect_size:
      metric: not_extracted
      as_reported: null
      value: null
      ci_lower: null
      ci_upper: null
      p_value: null
    replication_status: replicated_independent
    evidence_role: supports
    extraction:
      basis: abstract
      extracted_by: agent:alphacognition
      extracted_on: '2026-09-17'
      content_checked: true
    note: 'adverse events and PANSS WERE measured. NO COGNITIVE ENDPOINT was measured in these three trials,
      so with respect to cognition this record is an evidence GAP, not evidence against a cognitive effect;
      it contributes no counter_level to any cognitive facet (R5) — Recorded here for two reasons only:
      it establishes that M1/M4 agonism is pharmacologically deliverable in humans at a tolerated dose
      when peripheral blockade is co-administered, and it enumerates the residual adverse events. It is
      NOT cognitive evidence and its general_intelligence_relevance is none.'
  translation:
    adult_relevance: demonstrated_in_adults
    healthy_baseline: disease_model_only
    supra_normal: untested
    human_relevance: direct_human_interventional
    general_intelligence_relevance: none
