    representation: ordinal_grade
    scale: evidence_strength_v1
    level: 3
    rationale: pooled randomised human safety data across three trials, directly relevant to tolerability
      of M1/M4 agonism in adults
    calibration_status: uncalibrated_subjective
  risks:
  - approval for schizophrenia says nothing about a healthy-adult risk-benefit balance; a person with
