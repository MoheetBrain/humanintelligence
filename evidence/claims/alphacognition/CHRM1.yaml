    design: knockout
    species: SPECIES:NCBITaxon:10090
    population: mice with a null mutation of the gene coding the M1 receptor and wild-type controls
    sample_size:
      reported_as: null
      value: null
      unit: animals
    endpoint: matching-to-sample and non-matching-to-sample memory tasks, consolidation, theta-burst long-term
      potentiation in hippocampus
    endpoint_category: animal_working_memory
    endpoint_measured: measured
    effect_direction: mixed
    effect_size:
      metric: not_extracted
      as_reported: null
      value: null
      ci_lower: null
      ci_upper: null
      p_value: null
    replication_status: single_study
    evidence_role: contradicts
    extraction:
      basis: abstract
      extracted_by: agent:alphacognition
      extracted_on: '2026-09-17'
      content_checked: true
  translation:
    adult_relevance: developmental_only
    healthy_baseline: tested_in_healthy
    supra_normal: no_enhancement_observed
    human_relevance: rodent_only
    general_intelligence_relevance: animal_task_only
  uncertainty:
    representation: ordinal_grade
    scale: evidence_strength_v1
    level: 2
    rationale: clean genetic loss-of-function in a healthy rodent baseline, showing that removing M1 improves
      some memory measures while impairing others
    calibration_status: uncalibrated_subjective
  risks:
  - 'this is the direction-complicating result for CHRM1: the cognitive consequence of changing M1 signalling
    depends on which process is measured, so ''more M1 is better'' is not supported even in rodents'
  - a task-dependent bidirectional effect is exactly the pattern that a single favourable endpoint in
    an exploratory human battery could mask
  confounders:
  - developmental compensation in germline knockouts
  - task-specific demands
