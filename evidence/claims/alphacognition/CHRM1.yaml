- claim_id: CLM:alphacognition:CHRM1:005
  schema_version: 0.1.0
  statement: 'Mice with a null mutation of the M1 muscarinic receptor gene showed a selective and bidirectional
    memory phenotype rather than a uniform deficit: normal or enhanced memory on matching-to-sample problems
    alongside severe impairment of non-matching-to-sample working memory and of consolidation, together
    with reduced hippocampal long-term potentiation in response to theta burst stimulation.'
  subject: GENE:CHRM1
  predicate: MODULATES
  object: PHENO:animal_working_memory
  claim_type: causal_perturbation
  direction: bidirectional
  context:
    species:
    - SPECIES:NCBITaxon:10090
    life_stage: adult
    baseline_context: healthy_wildtype
    brain_regions:
    - REGION:hippocampus
    cell_types: []
  phenotype_class: animal_working_memory
  causal_attribution:
    basis: germline_knockout
    locus_to_gene_resolved: not_applicable
    alternative_explanations:
    - germline knockout permits lifelong compensation, so the adult phenotype is not the phenotype of
      acute M1 blockade
    - the source contrasts its result explicitly with earlier work using non-selective muscarinic antagonists,
      which produced uniform deficits; receptor-subtype specificity is the point of the paper
  evidence:
