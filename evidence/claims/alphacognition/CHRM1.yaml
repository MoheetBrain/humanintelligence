  predicate: INCREASES_RISK
  object: AE:syncope
  claim_type: safety
  direction: increases
  context:
    species:
    - SPECIES:NCBITaxon:9606
    life_stage: aged
    baseline_context: disease_population
    brain_regions: []
    cell_types: []
  phenotype_class: not_applicable
  causal_attribution:
