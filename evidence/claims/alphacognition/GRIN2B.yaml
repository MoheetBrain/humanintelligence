# Hand-curated claims — GRIN2B (lead atlas: alphacognition, dossier_depth: deep)
#
# The organising tension in this file, and the reason GRIN2B is in the seed list at all:
# rodent OVEREXPRESSION of the Grin2b product enhances learning above wild-type baseline,
# while human PERTURBATION of GRIN2B causes a neurodevelopmental disorder with intellectual
# disability. Those are different species, different life stages, different directions of
# change and different endpoints. Nothing in this file licenses the inference that
# increasing GRIN2B function in an adult human would increase intelligence.
# schema_version: 0.1.0 (carried per claim below; contract §2 requires this file to be a YAML list)

- claim_id: CLM:alphacognition:GRIN2B:001
  schema_version: 0.1.0
  statement: Transgenic forebrain overexpression of the NMDA receptor NR2B subunit in mice facilitated
    synaptic potentiation and produced better performance than wild-type littermates across several learning
    and memory tasks, which the authors interpreted as NR2B gating an age-dependent threshold for plasticity.
  subject: GENE:GRIN2B
  predicate: MODULATES
  object: PHENO:animal_recognition_memory
  claim_type: causal_perturbation
  direction: increases
  context:
    species:
    - SPECIES:NCBITaxon:10090
    life_stage: adult
    baseline_context: healthy_wildtype
    brain_regions: []
    cell_types: []
  phenotype_class: animal_recognition_memory
  causal_attribution:
    basis: germline_knockout
    locus_to_gene_resolved: not_applicable
    alternative_explanations:
    - transgenic overexpression is constitutive from development, so the adult phenotype may be a developmental
      consequence rather than an adult-modifiable one
    - forebrain-wide overexpression is not a physiological perturbation and has no dose analogue in a
      human intervention
    - improved task performance can reflect changes in motivation, exploration or sensory processing rather
      than memory
  evidence:
  - source_id: SRC:PMID:10485705
    design: overexpression
    species: SPECIES:NCBITaxon:10090
    population: transgenic mice with forebrain-specific NR2B overexpression and wild-type littermates
    sample_size:
      reported_as: null
      value: null
      unit: animals
    endpoint: multiple behavioural learning and memory tasks; synaptic potentiation at 10-100 Hz stimulation
    endpoint_category: animal_recognition_memory
    endpoint_measured: measured
    effect_direction: increase
    effect_size:
      metric: not_extracted
      as_reported: null
      value: null
      ci_lower: null
      ci_upper: null
      p_value: null
    replication_status: replicated_independent
    evidence_role: supports
    extraction:
      basis: abstract
      extracted_by: agent:alphacognition
      extracted_on: '2026-09-17'
      content_checked: true
    note: The abstract's own closing sentence proposes that genetic enhancement of mental and cognitive
      attributes in mammals is feasible. That is the authors' inference from a mouse experiment, not a
      human result, and it is recorded here as an authors' interpretation rather than as evidence.
  translation:
    adult_relevance: developmental_only
    healthy_baseline: tested_in_healthy
    supra_normal: enhancement_above_healthy_baseline
    human_relevance: rodent_only
    general_intelligence_relevance: animal_task_only
  uncertainty:
    representation: ordinal_grade
    scale: evidence_strength_v1
    level: 2
    rationale: landmark rodent causal experiment with an independent later replication of the same direction,
      but constitutive transgenic perturbation in one species and an animal task endpoint
    calibration_status: uncalibrated_subjective
  risks:
  - this is the single most over-cited result in the genetic-enhancement literature; the red team should
    check citation_dependence on it
  - the enhancement was measured against a wild-type rodent baseline in a laboratory environment, which
    is not a supra-normal human baseline
  confounders:
  - constitutive developmental overexpression
  - transgene insertion site effects
  - background strain
  dependencies: []
  status: active
  provenance:
    created_by: agent:alphacognition
    created_on: '2026-09-17'
    method: literature_curation
    run_id: sprint1-alphacognition-curation-01
