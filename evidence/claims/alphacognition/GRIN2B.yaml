- claim_id: CLM:alphacognition:GRIN2B:004
  schema_version: 0.1.0
  statement: De novo GRIN2B variants classified as pathogenic or likely pathogenic in 86 individuals were
    associated with neurodevelopmental disorder presenting with intellectual disability, epilepsy, autism,
    hypotonia, movement disorder, cortical visual impairment and, in six individuals, a malformation of
    cortical development; functional testing of the variants revealed both gain-of-function and loss-of-function
    mechanisms.
  subject: GENE:GRIN2B
  predicate: ASSOCIATED_WITH
  object: PHENO:clinical_cognitive_composite
  claim_type: association
  direction: decreases
  context:
    species:
    - SPECIES:NCBITaxon:9606
    life_stage: prenatal
    baseline_context: disease_population
    brain_regions: []
    cell_types: []
  phenotype_class: clinical_cognitive_composite
  causal_attribution:
    basis: monogenic_disorder
    locus_to_gene_resolved: 'yes'
    alternative_explanations:
    - ascertainment is through clinically affected individuals, so the phenotypic range of GRIN2B variation
      in the general population is unknown from this design
    - variant-level functional consequences were heterogeneous in direction, so 'GRIN2B perturbation'
      is not a single exposure
  evidence:
  - source_id: SRC:PMID:28377535
    design: clinical_case_series
    species: SPECIES:NCBITaxon:9606
    population: 86 individuals with de novo GRIN2B variants (48 from diagnostic/research cohorts plus
      43 from the literature) classified as pathogenic or likely pathogenic
    sample_size:
      reported_as: de novo variants in 86 patients were classified as pathogenic/likely pathogenic
      value: 86
      unit: individuals
    endpoint: clinical neurodevelopmental phenotype including intellectual disability and epilepsy; in
      vitro functional consequence of each variant; retained sensitivity to memantine
    endpoint_category: clinical_cognitive_composite
    endpoint_measured: measured
    effect_direction: decrease
    effect_size:
      metric: not_extracted
      as_reported: null
      value: null
      ci_lower: null
      ci_upper: null
      p_value: null
    replication_status: replicated_independent
    evidence_role: contradicts
    extraction:
      basis: abstract
      extracted_by: agent:alphacognition
      extracted_on: '2026-09-17'
      content_checked: true
    note: the clinical cognitive phenotype WAS measured; the memantine treatment response was NOT — the
      source states an objectifiable beneficial response remains to be demonstrated. That part of the
      record is an evidence GAP about intervention, not evidence against it, and contributes no counter_level
      (R5) — The paper reports retained in vitro sensitivity of variant receptors to memantine (CPD:CHEMBL807)
      and states explicitly that an objectifiable beneficial treatment response in patients still remains
      to be demonstrated. That absence is recorded here so that the memantine observation is never read
      as clinical efficacy.
  translation:
    adult_relevance: developmental_only
    healthy_baseline: disease_model_only
    supra_normal: contradicted
    human_relevance: human_genetic
    general_intelligence_relevance: multi_domain_cognitive
  uncertainty:
    representation: ordinal_grade
    scale: evidence_strength_v1
    level: 3
    rationale: large, gene-resolved human genetic series with functional validation; a directly relevant
      human cognitive endpoint, though a clinical one and developmental in onset
    calibration_status: uncalibrated_subjective
  risks:
  - 'this is the direction-reversing evidence for GRIN2B: in humans, perturbing this gene during development
    reduces cognitive ability, and both gain- and loss-of-function do so'
  - a gene whose disruption causes a developmental encephalopathy is a poor candidate for adult enhancement
    without a mechanism for restricting the perturbation in time and magnitude
  confounders:
  - clinical ascertainment
  - variant heterogeneity
  dependencies: []
