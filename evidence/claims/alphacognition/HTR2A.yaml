- claim_id: CLM:alphacognition:HTR2A:003
  schema_version: 0.1.0
  statement: In healthy human subjects given psilocybin 0.215 mg/kg orally, emotional empathy increased
    relative to placebo on the multifaceted empathy test while cognitive empathy did not change, and performance
    on a hypothetical moral dilemma task was unaffected.
  subject: GENE:HTR2A
  predicate: NO_DETECTED_EFFECT_ON
  negated_relation: MODULATES
  object: PHENO:executive_function
  claim_type: pharmacodynamic
  direction: no_change
  context:
    species:
    - SPECIES:NCBITaxon:9606
    life_stage: adult
    baseline_context: healthy_wildtype
    brain_regions: []
    cell_types: []
  phenotype_class: executive_function
  causal_attribution:
    basis: human_randomised_intervention
    locus_to_gene_resolved: not_applicable
    alternative_explanations:
    - the authors attribute the emotional-empathy effect to 5-HT2A/1A activation, so the receptor attribution
      is itself compound-level and shared with 5-HT1A
    - small samples (n = 32 for the empathy test, n = 24 for the moral dilemma task) give limited power
      to detect a cognitive-empathy effect, so 'no change' is weak evidence of absence
  evidence:
  - source_id: SRC:PMID:28637246
    design: rct_crossover
    species: SPECIES:NCBITaxon:9606
    population: healthy human subjects; multifaceted empathy test n = 32, moral dilemma task n = 24; psilocybin
      0.215 mg/kg orally versus placebo
    sample_size:
      reported_as: the multifaceted empathy test (n=32) and the moral dilemma task (n=24)
      value: 32
      unit: participants
    endpoint: explicit and implicit emotional empathy, cognitive empathy, hypothetical moral decision-making
    endpoint_category: executive_function
    endpoint_measured: measured
    effect_direction: no_change
    effect_size:
      metric: not_extracted
      as_reported: null
      value: null
      ci_lower: null
      ci_upper: null
      p_value: null
    replication_status: single_study
    evidence_role: null_result
    extraction:
      basis: abstract
      extracted_by: agent:alphacognition
      extracted_on: '2026-09-17'
      content_checked: true
    note: cognitive empathy and moral decision-making were measured and reported as unchanged, which is
      what licenses NO_DETECTED_EFFECT_ON rather than evidence_gap (R5, rule V16c)
  translation:
    adult_relevance: demonstrated_in_adults
    healthy_baseline: tested_in_healthy
    supra_normal: no_enhancement_observed
    human_relevance: direct_human_interventional
    general_intelligence_relevance: single_domain_cognitive
  uncertainty:
    representation: ordinal_grade
    scale: evidence_strength_v1
    level: 1
    rationale: small randomised human study; a null on the cognitive measures with limited power, recorded
      so the dissociation from the affective effect is visible
    calibration_status: uncalibrated_subjective
  risks:
  - affective effects of 5-HT2A agonism are frequently reported in language that sounds cognitive ('insight',
    'openness'); this claim marks the boundary where a measured cognitive endpoint did not move
  confounders:
  - small samples
  - 5-HT1A co-activation
  - acute exposure only
  dependencies:
  - CLM:alphacognition:HTR2A:002
  status: active
  provenance:
    created_by: agent:alphacognition
    created_on: '2026-09-17'
    method: literature_curation
    run_id: sprint1-alphacognition-curation-01
