# Hand-curated claims — DRD1 (lead atlas: alphacognition, dossier_depth: shallow)
#
# DRD1 is in the seed list as the textbook counter-example to "maximise the state
# variable". The dose-response relation between D1 receptor stimulation and prefrontal
# working memory is an inverted U: too little and too much both impair. A project that
# ranked targets by "how much can we push this" would rank DRD1 highly and be wrong.
# Response shape is therefore recorded as a first-class property (direction: inverted_u),
# not as prose.
# schema_version: 0.1.0 (carried per claim below; contract §2 requires this file to be a YAML list)

- claim_id: CLM:alphacognition:DRD1:001
  schema_version: 0.1.0
  statement: Increasing doses of the D1 receptor agonist SKF81297 produced an inverted-U dose/response
    curve on spatial working memory performance in mice, matching the pattern the authors describe as
    typical when D1 receptor agents are given to rats or monkeys performing working memory tasks, where
    either too little or too much D1 receptor stimulation impairs performance.
  subject: GENE:DRD1
  predicate: MODULATES
  object: PHENO:animal_working_memory
  claim_type: pharmacodynamic
  direction: inverted_u
  context:
    species:
    - SPECIES:NCBITaxon:10090
    life_stage: adult
    baseline_context: healthy_wildtype
    brain_regions:
    - REGION:prefrontal_cortex
    cell_types: []
  phenotype_class: animal_working_memory
  causal_attribution:
    basis: adult_pharmacological_perturbation
    locus_to_gene_resolved: not_applicable
    alternative_explanations:
    - the source states plainly that no pharmacological agent can distinguish D1 from D5 receptors, and
      that both subtypes are present in mouse prefrontal cortex, so 'D1 agonist' means D1/D5 agonist
    - systemic administration; the inverted U may arise anywhere in the circuit, not necessarily at prefrontal
      D1 receptors
    - high-dose impairment can reflect stereotypy or motor effects rather than a working-memory mechanism
  evidence:
  - source_id: SRC:PMID:12454947
    design: pharmacological_perturbation
    species: SPECIES:NCBITaxon:10090
    population: male C57BL/6 mice performing a spatial working memory task; immunostaining of mouse brain
      for D1A and D1B receptor subtypes
    sample_size:
      reported_as: null
      value: null
      unit: animals
    endpoint: spatial working memory performance across increasing doses of SKF81297
    endpoint_category: animal_working_memory
    endpoint_measured: measured
    effect_direction: mixed
    effect_size:
      metric: not_extracted
      as_reported: null
      value: null
      ci_lower: null
      ci_upper: null
      p_value: null
    replication_status: replicated_independent
    evidence_role: supports
    extraction:
      basis: abstract
      extracted_by: agent:alphacognition
      extracted_on: '2026-09-17'
      content_checked: true
  translation:
    adult_relevance: demonstrated_in_adults
    healthy_baseline: tested_in_healthy
    supra_normal: no_enhancement_observed
    human_relevance: rodent_only
    general_intelligence_relevance: animal_task_only
  uncertainty:
    representation: ordinal_grade
    scale: evidence_strength_v1
    level: 2
    rationale: rodent pharmacology in a healthy baseline, consistent with a wider rat and primate literature
      that the source describes as already typical
    calibration_status: uncalibrated_subjective
  risks:
  - 'the response shape means there is no monotonic ''improvement'' direction for DRD1: any intervention
    needs a state-dependent target level, not a maximum'
  - the optimum is itself state-dependent (baseline dopamine tone), which no single dose-response curve
    captures
  confounders:
  - D1/D5 pharmacological non-selectivity
  - locomotor and stereotypic effects at high dose
  - baseline dopamine tone
  dependencies: []
  status: active
  provenance:
    created_by: agent:alphacognition
    created_on: '2026-09-17'
    method: literature_curation
    run_id: sprint1-alphacognition-curation-01
- claim_id: CLM:alphacognition:DRD1:002
  schema_version: 0.1.0
  statement: A review of dopaminergic approaches to cognitive deficits in schizophrenia states that D1
    receptors are concentrated on dendritic spines in primate dorsolateral prefrontal cortex, that their
    stimulation produces an inverted-U dose response on both neuronal firing and working-memory performance,
    that the full D1 agonist dihydrexidine improved working memory in monkeys at low doses, and that dihydrexidine
    has begun to be tested in patients with schizophrenia or schizotypal disorder with initial results
    the authors call encouraging but limited by the drug's pharmacokinetics.
  subject: GENE:DRD1
  predicate: MODULATES
  object: PHENO:working_memory
  claim_type: pharmacodynamic
  direction: inverted_u
  context:
    species:
    - SPECIES:NCBITaxon:9606
    life_stage: adult
    baseline_context: disease_population
    brain_regions:
    - REGION:dorsolateral_prefrontal_cortex
    cell_types: []
  phenotype_class: working_memory
  causal_attribution:
    basis: theoretical_argument
    locus_to_gene_resolved: not_applicable
    alternative_explanations:
    - this is a narrative review written in part by authors with pharmaceutical affiliations; every statement
      in it is a secondary report
    - the human testing described is in patient populations with reduced prefrontal dopamine, so any benefit
      would be restoration toward a setpoint rather than enhancement
    - no healthy-adult D1 agonist cognitive trial was found in this session
  evidence:
  - source_id: SRC:PMID:26946382
    design: narrative_review
    species: SPECIES:NCBITaxon:9606
    population: 'review scope: patients with schizophrenia or schizotypal disorder, plus non-human primate
      studies'
    sample_size:
      reported_as: null
      value: null
      unit: null
    endpoint: working memory performance; prefrontal neuronal firing; clinical status
    endpoint_category: working_memory
    endpoint_measured: unknown
    effect_direction: mixed
    effect_size:
      metric: not_extracted
      as_reported: null
      value: null
      ci_lower: null
      ci_upper: null
      p_value: null
    replication_status: not_assessed
    evidence_role: qualifies
    extraction:
      basis: secondary_report
      extracted_by: agent:alphacognition
      extracted_on: '2026-09-17'
      content_checked: true
    note: a narrative review reports no protocol of its own — Deliberately graded at level 1 and marked
      as a secondary report. A review cannot carry a claim on its own in this repository; this record
      exists so that the inverted-U response shape and the existence of dihydrexidine (CPD:CHEMBL25856)
      patient testing are in the graph with an honest provenance label, and so the red team can find the
      primary sources rather than trusting the review.
  translation:
    adult_relevance: demonstrated_in_adults
    healthy_baseline: deficit_state_only
    supra_normal: rescue_only
    human_relevance: nonhuman_primate
    general_intelligence_relevance: single_domain_cognitive
  uncertainty:
    representation: ordinal_grade
    scale: evidence_strength_v1
    level: 1
    rationale: secondary report only; no primary human interventional result for DRD1 and cognition was
      retrieved in this session
    calibration_status: uncalibrated_subjective
  risks:
  - review-level evidence is where the inverted U tends to be asserted without its dose axis; treat the
    shape as a hypothesis with rodent support (CLM:alphacognition:DRD1:001), not as a characterised human
    dose-response curve
  confounders:
  - author industry affiliations
  - patient-population baselines
  - dihydrexidine pharmacokinetics
  dependencies:
  - CLM:alphacognition:DRD1:001
  status: active
  provenance:
    created_by: agent:alphacognition
    created_on: '2026-09-17'
    method: literature_curation
    run_id: sprint1-alphacognition-curation-01
