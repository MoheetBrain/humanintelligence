      effect_direction: no_change
      effect_size:
        metric: not_extracted
        as_reported: "Study treatment AFQ056 failed to demonstrate efficacy in the adult patient with Fragile X Syndrome in 2 other clinical studies (CAFQ056B2214 and CAFQ056A2212)"
        value: null
