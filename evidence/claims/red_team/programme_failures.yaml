# Red-team claims recording HUMAN PROGRAMME OUTCOMES that no atlas recorded.
# Contract: docs/DATA_CONTRACT.md section 4. schema_version 0.1.0.
#
# Each of these is a registry-recorded fact about what happened to the only human
# pharmacology that exists for a seed target's mechanism. They are registry records, so
# each one is graded on what the registry actually establishes and no further.
#
# A NOTE ON WHAT A TERMINATION IS AND IS NOT, because agent:brakes got this right and
# the distinction must survive into this file. A trial that stopped is not a trial that
# failed. Three of the four records below name an EFFICACY failure or a market withdrawal
# explicitly in the registry's own words; that is why they are claims rather than audit
# prose. Terminations whose stated reason was low enrolment or an unexplained "company
# decision" are NOT recorded as claims anywhere - they appear only as audit-check notes,
# because a sponsor's silence is not evidence about biology.

- claim_id: CLM:red_team:KCNQ2:001
  schema_version: 0.1.0
  statement: >-
    A long-term open-label safety and efficacy extension study of retigabine in adults
    with partial-onset seizures was terminated, and the registry gives as the reason that
    retigabine has been withdrawn from market; retigabine is the only KCNQ2/KCNQ3 channel
    opener to have reached marketing authorisation, so the sole marketed pharmacology for
    this channel family is no longer available.
  subject: DRUG:CHEMBL41355
  predicate: INCREASES_RISK
  object: AE:systemic_tolerability_burden
  claim_type: safety
  direction: increases
  context:
    species: [SPECIES:NCBITaxon:9606]
    life_stage: adult
    baseline_context: disease_population
    brain_regions: []
    cell_types: []
  phenotype_class: not_applicable
  causal_attribution:
    basis: human_randomised_intervention
    locus_to_gene_resolved: not_applicable
    alternative_explanations:
      - "the registry states the fact of market withdrawal but not its cause; no reason for the withdrawal was retrieved from any source in this session, so the nature of the limiting liability is NOT established here"
      - "commercial factors can contribute to a market withdrawal and the registry does not separate commercial from safety reasons"
      - "retigabine is a channel OPENER, which is the opposite of the direction a brake-release strategy would propose for KCNQ2/KCNQ3; its fate therefore bears on the druggability and tolerability of this channel family in humans rather than directly on the proposed direction"
      - "a companion GlaxoSmithKline post-marketing surveillance study of urinary retention in retigabine users (NCT01462656) was itself terminated for insufficient numbers, so no incidence estimate for that liability was produced"
  evidence:
    - source_id: SRC:NCT:NCT00310388
      design: registry_record
      species: SPECIES:NCBITaxon:9606
      population: "adult epilepsy patients with partial-onset seizures enrolled in a long-term open-label extension; registry-reported actual enrolment 376"
      sample_size:
        reported_as: "376"
        value: 376
        unit: participants
      endpoint: "registry status and whyStopped field for a long-term safety, tolerability and efficacy extension"
      endpoint_category: not_applicable
      endpoint_measured: measured
      effect_direction: not_reported
      effect_size:
        metric: not_extracted
        as_reported: "No longer any benefit in collecting data since retigabine has been withdrawn from market."
        value: null
        ci_lower: null
        ci_upper: null
        p_value: null
      replication_status: not_assessed
      evidence_role: contradicts
      extraction:
        basis: registry_record
        extracted_by: agent:red_team
        extracted_on: "2026-09-17"
        content_checked: true
  translation:
    adult_relevance: demonstrated_in_adults
    healthy_baseline: deficit_state_only
    supra_normal: untested
    human_relevance: direct_human_interventional
    general_intelligence_relevance: none
  uncertainty:
    representation: ordinal_grade
    scale: evidence_strength_v1
    level: 2
    rationale: >-
      one registry record, but the fact it states - the market withdrawal of the only
      marketed modulator of this channel family - is both unambiguous and directly
      relevant to whether a usable human window exists; the cause of the withdrawal is
      not established, which caps this at moderate
    calibration_status: uncalibrated_subjective
  risks:
    - "this claim establishes that the drug was withdrawn, NOT why. Reporting a specific cause would go beyond the retrieved text."
  confounders: []
  dependencies: []
  status: active
  provenance:
    created_by: agent:red_team
    created_on: "2026-09-17"
    method: literature_curation
    run_id: sprint1-red-team-01
    supporting_accessions: ["NCT00310388", "NCT01462656"]

- claim_id: CLM:red_team:GRM5:001
  schema_version: 0.1.0
  statement: >-
    A long-term open-label study of the mGluR5 negative allosteric modulator AFQ056 in
    148 adults with fragile X syndrome was terminated, and the registry gives as the
    reason that the study treatment failed to demonstrate efficacy in the adult fragile X
    population in two other named clinical studies; a parallel adolescent open-label
    study was terminated for the same stated reason.
  subject: MECH:mglur5_negative_allosteric_modulation
  predicate: NO_DETECTED_EFFECT_ON
  negated_relation: CHANGES_STATE
  object: PHENO:clinical_cognitive_composite
  claim_type: clinical_null
  direction: no_change
  context:
    species: [SPECIES:NCBITaxon:9606]
    life_stage: adult
    baseline_context: disease_population
    brain_regions: []
    cell_types: []
  phenotype_class: clinical_cognitive_composite
  causal_attribution:
    basis: human_randomised_intervention
    locus_to_gene_resolved: not_applicable
    alternative_explanations:
      - "the two studies named in the registry as having failed were not themselves retrieved in this session, so the failed endpoints are known only as the sponsor's summary of them, not read directly"
      - "the fragile X primary endpoints in that programme were behavioural rather than cognitive, so 'failed to demonstrate efficacy' does not by itself establish a cognitive null; the endpoint category recorded here is the sponsor's population-level efficacy judgement"
      - "fragile X syndrome is a monogenic developmental disorder, so this is a rescue setting and a null in it does not test enhancement in healthy adults"
  evidence:
