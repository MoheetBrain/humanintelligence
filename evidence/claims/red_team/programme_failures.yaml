- claim_id: CLM:red_team:PDE4B:001
  schema_version: 0.1.0
  statement: >-
    In a double-blind placebo-controlled four-way crossover study in healthy young adults,
    the pan-PDE4 inhibitor roflumilast improved immediate recall on a verbal learning task
    at the lowest of three doses tested, with no benefit reported at the higher doses and
    no benefit reported at the 45-minute or 24-hour recall timepoints that were also
    measured; the authors note that no PDE4-typical side effects occurred at that lowest
    effective dose.
  subject: DRUG:CHEMBL193240
  predicate: CHANGES_STATE
  object: PHENO:episodic_memory
  claim_type: pharmacodynamic
  direction: inverted_u
  context:
    species: [SPECIES:NCBITaxon:9606]
    life_stage: adult
    baseline_context: healthy_wildtype
    brain_regions: []
    cell_types: []
  phenotype_class: episodic_memory
  causal_attribution:
    basis: human_randomised_intervention
    locus_to_gene_resolved: not_applicable
    alternative_explanations:
      - "roflumilast is a pan-PDE4 inhibitor and does not isolate PDE4B, so this result is evidence about a drug and a family, not about this gene"
      - "the benefit was on one of three recall timepoints of one task in a four-way crossover, so multiplicity is a live concern and the abstract reports no correction"
      - "a benefit at the lowest of three doses with none at higher doses is a non-monotone exposure-response; an alternative reading is that the finding is a chance result at one dose rather than a real inverted-U"
      - "this study shares its senior authorship with the other PDE4 cognitive-enhancement reports in this repository, so the three results are not independent replications"
  evidence:
    - source_id: SRC:PMID:29241652
      design: rct_crossover
      species: SPECIES:NCBITaxon:9606
      population: "healthy young adults, three capsulated doses of roflumilast and placebo in four study periods, dosed one hour before testing"
      sample_size:
        reported_as: null
        value: null
        unit: participants
      endpoint: "number of words recalled on a 30-word Verbal Learning Task immediately and after 45 minutes and 24 hours, with concurrent event-related potentials"
      endpoint_category: episodic_memory
      endpoint_measured: measured
      effect_direction: increase
      effect_size:
        metric: not_extracted
        as_reported: "Memory performance was significantly improved after acute administration of 100 μg roflumilast. Specifically, immediate recall performance on the VLT increased 2-3 words"
        value: null
        ci_lower: null
        ci_upper: null
        p_value: null
      replication_status: single_study
      evidence_role: qualifies
      extraction:
        basis: abstract
        extracted_by: agent:red_team
        extracted_on: "2026-09-17"
        content_checked: true
  translation:
    adult_relevance: demonstrated_in_adults
    healthy_baseline: tested_in_healthy
    supra_normal: enhancement_above_healthy_baseline
    human_relevance: direct_human_interventional
    general_intelligence_relevance: single_domain_cognitive
  uncertainty:
    representation: ordinal_grade
    scale: evidence_strength_v1
    level: 2
    rationale: >-
      one randomised crossover study in healthy adults with a genuine above-baseline
      improvement, but on a single endpoint of a single task at a single dose, with a
      non-selective drug, unreplicated outside one research group
    calibration_status: uncalibrated_subjective
  risks:
    - "This record is deliberately typed `qualifies` rather than `supports`. The red team retrieved it in order to TEST the brake atlas's only above-baseline human enhancement grade, and what it establishes is narrower than that grade assumes: a 2-3 word gain on immediate recall only, at the lowest dose only, with a drug that does not isolate PDE4B."
    - "the non-monotone dose pattern is the reason this claim's `direction` is inverted_u; anyone reading PDE4 inhibition as monotonically pro-cognitive has committed a dose-response inversion"
  confounders:
    - "acute single-dose design cannot speak to sustained use"
    - "overlapping authorship across the PDE4 cognitive literature in this repository"
  dependencies: []
  status: active
  provenance:
    created_by: agent:red_team
    created_on: "2026-09-17"
    method: literature_curation
    run_id: sprint1-red-team-01
    supporting_pubmed_ids: ["29241652"]

- claim_id: CLM:red_team:creatine:001
