    A second, independent systematic review and meta-analysis of sixteen randomised
    controlled trials of creatine monohydrate in adults, not cited by any atlas in this
    repository, found no significant improvement in overall cognitive function or in
    executive function, and reports that the benefit was larger in individuals with
    disease than in healthy participants.
