  translation:
    adult_relevance: demonstrated_in_adults
    healthy_baseline: disease_model_only
    supra_normal: no_enhancement_observed
    human_relevance: direct_human_interventional
    general_intelligence_relevance: multi_domain_cognitive
  uncertainty:
    representation: ordinal_grade
    scale: evidence_strength_v1
    level: 4
    rationale: >-
      two independently reported randomised placebo-controlled trials of the same
      mechanism, in two different populations, each with a pre-specified multi-domain
      cognitive primary endpoint, both null and consistent in direction; the companion
      trial demonstrated pharmacodynamic target engagement; and the posted results of the
      larger trial bound the treatment difference on a composite whose population
      standard deviation is 10 T-score points to a confidence interval of roughly -1.5 to
      +2.0, so this is a precise null rather than an uninformative one
    calibration_status: uncalibrated_subjective
  risks:
    - "neither trial tested healthy adults, so this pair of nulls does not establish that the mechanism cannot enhance a healthy adult; it establishes that it did not improve cognition in the two deficit populations where it was tested"
    - "reading this as 'the alpha5 brake does not exist' would be an over-read: the rodent plasticity phenotypes are separate evidence and are not addressed by these trials"
    - "the placebo arm itself improved by 1.08 composite T-score points over 24 weeks, which is nearly four times the treatment difference; anyone comparing a single-arm result against a historical baseline in this indication would mistake that drift for an effect"
  confounders:
    - "antipsychotic co-medication in the schizophrenia trial"
    - "instrument floor and ceiling effects in intellectual disability in the Down syndrome trial"
