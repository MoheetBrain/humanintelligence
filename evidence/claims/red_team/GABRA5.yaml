      endpoint: "curated adverse-effect annotation for the alpha5-containing GABA-A receptor, retrieved as Open Targets Platform 26.06 safetyLiabilities rows 'convulsions' (direction: Inhibition/Decrease/Downregulation, dosing: acute) and 'decreased convulsions' (direction: Activation/Increase/Upregulation, dosing: acute)"
      endpoint_category: not_applicable
