- claim_id: CLM:red_team:GABRA5:002
  schema_version: 0.1.0
  statement: >-
    A curated safety-pharmacology review indexed by the Open Targets Platform attributes
    convulsions to inhibition of the alpha5-containing GABA-A receptor and attributes
    decreased convulsions to its activation, so the direction of manipulation this
    project proposes for this target is the direction associated with seizure liability
    rather than the direction that protects against it.
  subject: GENE:GABRA5
  predicate: INCREASES_RISK
  object: AE:seizure
  claim_type: safety
  direction: increases
  context:
    species: [SPECIES:NCBITaxon:9606]
    life_stage: not_reported
    baseline_context: not_reported
    brain_regions: []
    cell_types: []
  phenotype_class: not_applicable
  causal_attribution:
    basis: theoretical_argument
    locus_to_gene_resolved: not_applicable
    alternative_explanations:
      - "the source is a literature curation table, not a primary experiment; its rows carry no species, dose or design attribution, so this is a class-level expectation rather than an observed outcome for any specific compound"
      - "the developer's own preclinical report for the clinical alpha5 negative allosteric modulator states that no proconvulsant effect was seen in rats at the 30-65 percent occupancy range taken into the clinic, so the liability is plausibly occupancy-dependent and avoidable at partial occupancy"
      - "the curation table lists both directions for this event, which is consistent with a bidirectional relationship rather than a one-way risk"
  evidence:
