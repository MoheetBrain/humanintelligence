# Red-team contradicting evidence — GABRA5.
# Contract: docs/DATA_CONTRACT.md section 4. schema_version 0.1.0.
#
# WHY THIS FILE EXISTS. agent:brakes named NCT02953639 as "the largest single
# unresolved item in the GABRA5 dossier" and refused to grade it, because it had the
# registry record but not the result. That refusal was correct. This file closes the
# gap the right way: by retrieving the published result and recording it as evidence,
# not by asserting what the trial probably showed.
#
# The effect is that the human null for the alpha5-GABA-A mechanism is now REPLICATED
# across two independent trials in two different populations, both with a pre-specified
# cognitive primary endpoint. That is the strongest negative finding in this audit and
# it is the reason TGT:GABRA5's human facets are downgraded in
# evidence/audits/red_team/GABRA5.yaml.

- claim_id: CLM:red_team:GABRA5:001
  schema_version: 0.1.0
  statement: >-
    In a 24-week randomised placebo-controlled phase 2b trial in adults with cognitive
    impairment associated with schizophrenia, the selective alpha5-GABA-A negative
    allosteric modulator basmisanil did not improve the MATRICS Consensus Cognitive
    Battery neurocognitive composite, which was the pre-specified primary endpoint, nor
    any secondary cognitive or functional measure, nor any of the pre-specified
    stratified subgroups, and recruitment into the lower-dose arm was stopped at a
    planned futility analysis.
  subject: CPD:CHEMBL3681419
  predicate: NO_DETECTED_EFFECT_ON
  negated_relation: CHANGES_STATE
  object: PHENO:clinical_cognitive_composite
  claim_type: clinical_null
  direction: no_change
  context:
    species: [SPECIES:NCBITaxon:9606]
    life_stage: adult
    baseline_context: disease_population
    brain_regions: []
    cell_types: []
  phenotype_class: clinical_cognitive_composite
  causal_attribution:
    basis: human_randomised_intervention
    locus_to_gene_resolved: not_applicable
    alternative_explanations:
      - "the population had schizophrenia and was on stable antipsychotics, so a null here does not establish a null for healthy adults"
      - "antipsychotic co-medication could in principle occlude an effect of alpha5 negative modulation, and the retrieved text does not exclude that"
      - "the report states that practice and learning effects were not observed at week 12, which removes one common explanation for a null but not all of them"
      - "no receptor-occupancy measurement is reported for this trial in the retrieved text, so adequate target engagement at the tested doses is inferred from the wider programme rather than demonstrated here"
      - "the terminated paediatric study (SRC:NCT:NCT02484703, n=45) carries endpoint_measured: unknown deliberately. Its whyStopped text is the sponsor stating that it stopped because ANOTHER study showed no efficacy and that safety was not the reason, which is a fact about the programme rather than a result from this trial; no results were posted and whether its protocol cognitive endpoints were ever administered cannot be determined. agent:brakes reached the same `unknown` determination and refused to write a claim on it; that determination is confirmed here, and the record is included only as a qualifying evidence item so the registered source is not left dangling. A terminated trial is not a reported null and this evidence item must never be read as one."
      - "one secondary sub-score was nominally significant in the posted results (Wechsler Memory Scale IV Verbal Paired Associates, treatment difference 0.91, 95% CI 0.23 to 1.58, p=0.028) among many secondary comparisons with no correction reported, alongside p-values of 0.211, 0.787 and 0.477 on the other sub-scores of the same instrument and 0.556, 0.848, 0.973 and 0.651 across the MCCB cognitive domains; the red team records this because it is the one result a reader seeking a positive finding would quote, and treats it as consistent with chance"
