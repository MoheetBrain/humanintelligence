    healthy_baseline: disease_model_only
    supra_normal: untested
    human_relevance: direct_human_interventional
    general_intelligence_relevance: none
  uncertainty:
    representation: ordinal_grade
    scale: evidence_strength_v1
    level: 3
    rationale: >-
      one human interventional result with a directly relevant endpoint, in 53
      participants, with results posted in full and a protocol that names the
      dose-limiting toxicity classes in advance; the ophthalmic finding is
      mechanistically predicted and arose in a population screened to exclude
      pre-existing retinal disease
    calibration_status: uncalibrated_subjective
  risks:
    - "The population is advanced cancer, not healthy adults, so incidence here is not transportable to a healthy-adult exposure. What transports is the identification of the dose-limiting organ systems, which is the decision-relevant content."
    - "This claim must NOT be cited in the safety grade for SLC16A7 or SLC16A3. Retinal and erythrocyte lactate transport are MCT1 functions; extending this to the other isoforms would manufacture two liabilities out of one."
  confounders:
    - "advanced cancer with prior and concurrent therapy"
    - "no placebo arm"
    - "reported AZD3965 activity at MCT2 as well as MCT1"
