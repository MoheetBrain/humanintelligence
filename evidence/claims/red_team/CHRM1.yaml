    locus_to_gene_resolved: not_applicable
    alternative_explanations:
      - "the registry does not state what the toxicology finding was, in which species it occurred, at what exposure, or whether it was later resolved; the fact established is that the sponsor halted the programme pending its investigation, not the nature of the hazard"
      - "a withdrawn trial with zero enrolment generates no human safety data of its own, so this record says nothing about what the compound does in a human at the doses previously tested"
      - "an unexpected preclinical finding is a routine reason to pause a programme and does not necessarily indicate a hazard that would have appeared in humans"
      - "the finding is about this compound, not necessarily about M1 agonism as a mechanism, although the wider muscarinic literature makes a class contribution plausible"
