# Red-team contradicting evidence — CHRM1.
# Contract: docs/DATA_CONTRACT.md section 4. schema_version 0.1.0.
#
# CLM:alphacognition:CHRM1:001 is, on that agent's own account, the ONLY healthy-adult
# human cognitive result anywhere in this repository. Its quality therefore matters
# disproportionately. The red team's independent search did not break the record - it is
# accurately extracted and well caveated - but it found what happened NEXT to the
# compound, which nothing in the repository recorded: the phase 2 was withdrawn before
# enrolling anyone, for an unexpected animal toxicology finding.
#
# This is a safety and programme-viability fact, not a refutation of the cognitive
# signal. It is recorded here so that the repository's single healthy-adult result
# carries its own development history alongside it.

- claim_id: CLM:red_team:CHRM1:001
  schema_version: 0.1.0
  statement: >-
    The phase 2 dose-ranging trial of the selective M1 receptor agonist HTL0018318 in
    dementia with Lewy bodies was withdrawn with zero participants enrolled, and the
    registry records the reason as a pending investigation of an unexpected animal
    toxicology finding; this is the same compound and sponsor whose earlier multiple
    ascending dose study in healthy adults reported exploratory pro-cognitive effects.
  subject: CPD:htl0018318
  predicate: INCREASES_RISK
  object: AE:preclinical_toxicology_finding
  claim_type: safety
