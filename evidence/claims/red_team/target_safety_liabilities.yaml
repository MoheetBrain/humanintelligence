# Red-team safety-liability claims derived from Open Targets Platform 26.06
# safetyLiabilities rows, each bound to the PMID the annotation itself carries.
# Contract: docs/DATA_CONTRACT.md section 4. schema_version 0.1.0.
#
# WHY THESE ARE HERE. The red team owns `safety_liability_burden` for all 27 targets.
# Grading it from "Open Targets says so" would be unciteable, so the two PMIDs behind
# essentially every row were retrieved, read and registered as sources
# (SRC:PMID:28216264, SRC:PMID:23197038). These claims are the citeable form.
#
# TWO LIMITS, STATED ONCE AND APPLYING TO EVERY CLAIM IN THIS FILE.
# 1. Both sources are CURATION REVIEWS, not primary experiments. Neither attributes a
#    species, a dose or a design to an individual row. So each claim is a class-level
#    expectation, graded `level: 1` or `level: 2`, never higher.
# 2. They are NOT independent of each other. Both are pharmaceutical-industry
#    safety-pharmacology curation exercises over overlapping published literature.
#    Two rows agreeing is close to one row agreeing with itself, and the red team's own
#    `citation_dependence` check fires on this file.
#
# WHAT THIS MEANS FOR THE FACET, per contract section 5.4. `safety_liability_burden` is
# INVERSE-POLARITY, so the methodological weakness of these sources caps `counter_level`
# and NEVER `level`. Weak evidence cannot establish the ABSENCE of a risk. A target whose
# Open Targets safetyLiabilities list is empty is therefore NOT graded 0 on the strength
# of that emptiness alone; the empty list is recorded as this source being silent.

