# Claims — RTN4R (NgR1, Nogo-66 receptor 1), Cognitive Brake Atlas.
#
# Brake class: structural plasticity and critical-period closure.
#
# This target is the sharpest development-versus-adulthood case in the atlas after OTX2,
# and the only one where the loss-of-function cognitive evidence points the wrong way:
# NgR1-null mice show reduced working memory, and human RTN4R variation has been
# investigated as a schizophrenia risk factor rather than as a cognitive advantage.
#
# schema_version: 0.1.0

- claim_id: CLM:brakes:RTN4R:001
  statement: >-
    Mice lacking NgR1 retained ocular-dominance plasticity of the kind normally confined to
    the juvenile critical period into adulthood, and in adult mutants the gene was shown to
    act within parvalbumin-expressing interneurons to restrict the loss of intracortical
    excitatory input after monocular deprivation.
  subject: GENE:RTN4R
  predicate: NEGATIVELY_REGULATES
  object: SV:plasticity.critical_period_permissiveness
  claim_type: causal_perturbation
  direction: decreases
  context:
    species: [SPECIES:NCBITaxon:10090]
    life_stage: adult
    baseline_context: healthy_wildtype
    brain_regions: []
    cell_types: []
  phenotype_class: synaptic_plasticity_ltp_ltd
  causal_attribution:
    basis: germline_knockout
    locus_to_gene_resolved: not_applicable
    alternative_explanations:
      - "the mutant is a germline line, so lifelong absence of NgR1 could itself alter cortical development and thereby the adult plasticity phenotype"
      - "retained juvenile-type plasticity is a change in the plasticity rule, not a demonstrated cognitive benefit"
  evidence:
    - source_id: SRC:PMID:27798181
      design: knockout
      species: SPECIES:NCBITaxon:10090
      population: "adult and critical-period-aged male and female C57BL/6 ngr1 mutant mice and wild-type controls"
      sample_size:
        reported_as: null
        value: null
        unit: animals
      endpoint: "ocular-dominance shift after monocular deprivation; laser-scanning photostimulation maps of intracortical excitatory input to parvalbumin interneurons; parvalbumin expression level"
      endpoint_category: synaptic_plasticity_ltp_ltd
      endpoint_measured: measured
      effect_direction: increase
      effect_size:
        metric: not_extracted
        as_reported: null
        value: null
        ci_lower: null
        ci_upper: null
        p_value: null
      replication_status: single_study
      evidence_role: supports
      extraction:
        basis: abstract
        extracted_by: agent:brakes
        extracted_on: "2026-09-17"
        content_checked: true
  translation:
    adult_relevance: demonstrated_in_adults
    healthy_baseline: tested_in_healthy
    supra_normal: no_enhancement_observed
    human_relevance: rodent_only
    general_intelligence_relevance: none
  uncertainty:
    representation: ordinal_grade
    scale: evidence_strength_v1
    level: 2
    rationale: "circuit-level mechanism measured in adults, but germline deletion and a sensory-plasticity endpoint with no cognitive measure"
    calibration_status: uncalibrated_subjective
