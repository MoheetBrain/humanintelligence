    locus_to_gene_resolved: not_applicable
    alternative_explanations:
      - "forebrain-restricted deletion is genetically specific but not temporally restricted to adulthood, so developmental reorganisation of dendritic excitability is not excluded"
      - "increased theta power could itself drive the behavioural change, making the dendritic-integration account one of several consistent readings"
      - "general and forebrain-restricted knockouts were used; compensation by HCN2 is not excluded by the retrieved abstract"
