# Claims — HCN1 (hyperpolarisation-activated cyclic-nucleotide-gated channel 1),
# Cognitive Brake Atlas.
#
# Brake class: dendritic integration and intrinsic excitability. The h-current shunts
# distal dendritic inputs and shortens the temporal window for synaptic summation.
# The organising fact of this file is that the same current is recruited by activity as
# a negative-feedback homeostat, so the brake is part of a stability loop rather than a
# free parameter.
#
# schema_version: 0.1.0

- claim_id: CLM:brakes:HCN1:001
  statement: >-
    Deleting HCN1 from forebrain neurons enhanced hippocampus-dependent learning and
    memory, increased the power of theta oscillations, and enhanced long-term potentiation
    specifically at the direct perforant-path input to distal CA1 dendrites while leaving
    proximal Schaffer-collateral potentiation largely unchanged.
  subject: GENE:HCN1
  predicate: NEGATIVELY_REGULATES
  object: SV:workspace.dendritic_integration_gain
  claim_type: causal_perturbation
  direction: decreases
