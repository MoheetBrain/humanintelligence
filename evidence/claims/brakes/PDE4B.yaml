# Claims — PDE4B, Cognitive Brake Atlas.
#
# Brake class: second-messenger degradation. PDE4 enzymes hydrolyse cAMP and thereby
# limit PKA- and CREB-dependent signalling needed for consolidation.
#
# This is the only target in the brake atlas with randomised interventional evidence of
# above-baseline memory improvement in healthy adults. Two caveats are recorded in every
# claim: the drug used, roflumilast, is a pan-PDE4 inhibitor and does not isolate PDE4B;
# and the benefit appeared at a low dose while the higher doses produced adverse events
# and no benefit, so the dose-response is not monotone.
#
# schema_version: 0.1.0

- claim_id: CLM:brakes:PDE4B:001
  statement: >-
    In a randomised, double-blind, placebo-controlled four-way crossover study in healthy
    young adults, a single 100 microgram dose of the PDE4 inhibitor roflumilast improved
    immediate recall on a 30-word verbal learning task and enhanced an event-related
    potential associated with word learning, with no typical PDE4-inhibitor side effects
    reported at that dose.
  subject: DRUG:CHEMBL193240
  predicate: CHANGES_STATE
  object: PHENO:episodic_memory
  claim_type: clinical_efficacy
  direction: increases
  context:
    species: [SPECIES:NCBITaxon:9606]
    life_stage: adult
    baseline_context: healthy_wildtype
    brain_regions: []
    cell_types: []
  phenotype_class: episodic_memory
  causal_attribution:
    basis: human_randomised_intervention
    locus_to_gene_resolved: not_applicable
    alternative_explanations:
      - "roflumilast inhibits PDE4 broadly (PDE4A to PDE4D); nothing in this study attributes the effect to PDE4B"
      - "the benefit was confined to immediate recall; delayed recall at 45 minutes and 24 hours was measured but the abstract reports the improvement for immediate recall specifically"
      - "acute single-dose crossover design, so nothing follows about repeated dosing"
      - "the effective dose was the lowest tested, which is an unusual pattern and could reflect chance in a multi-dose comparison"
  evidence:
