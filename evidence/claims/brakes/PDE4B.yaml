- claim_id: CLM:brakes:PDE4B:002
  statement: >-
    In a randomised, double-blind, placebo-controlled four-way crossover study in 20 healthy
    people aged 60 to 80 screened to have normal memory, a single 100 microgram dose of
    roflumilast improved delayed verbal recall while producing no effect on a spatial memory
    task, and mild adverse events including headache, dizziness, insomnia and diarrhoea were
    reported after the 1000 microgram dose.
