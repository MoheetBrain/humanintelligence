- claim_id: CLM:brakes:EIF2B_COMPLEX:006
  statement: >-
    A case report together with a summary of 33 genetically confirmed female patients with
    adult-onset vanishing white matter disease, all carrying mutations in one of the five
    eIF2B subunit genes, reports a mean age of clinical onset of 36.8 years and neurological
    features including executive deficits, cerebellar ataxia and paraparesis, so reduced
    eIF2B function in the adult human brain produces progressive cognitive and motor
    decline.
