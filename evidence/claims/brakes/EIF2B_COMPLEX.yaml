# Claims — EIF2B_COMPLEX (decameric eIF2B guanine-nucleotide exchange factor),
# Cognitive Brake Atlas.
#
# Brake class: translational control. The integrated stress response reduces eIF2B
# activity and thereby limits the cap-dependent translation required for memory
# consolidation. The decisive distinctions in this file are (a) the state-dependence of
# pharmacological eIF2B activation, which only works below a threshold of eIF2-alpha
# phosphorylation, and (b) the fact that the only phase 2/3 human trial of an eIF2B
# activator measured motor function and survival, not cognition.
#
# schema_version: 0.1.0

