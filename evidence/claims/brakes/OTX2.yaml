# Claims — OTX2, Cognitive Brake Atlas.
#
# Brake class: critical-period closure. OTX2 is captured from the extracellular space by
# perineuronal nets on parvalbumin interneurons; its continued internalisation maintains
# the closed state of the cortical critical period.
#
# This is the atlas's cleanest illustration that a brake exists for a reason. The single
# experiment that reopens adult plasticity by disrupting OTX2 capture also shows that the
# reopened adult cortex loses acuity when deprived, and separately restores vision in
# amblyopic animals. The same manipulation is therefore harmful or beneficial depending
# entirely on the state of the system it acts on.
#
# schema_version: 0.1.0

- claim_id: CLM:brakes:OTX2:001
  statement: >-
    Infusing a short arginine-lysine peptide that competes with the glycosaminoglycan-binding
    domain of OTX2 disrupted OTX2 localisation to parvalbumin interneurons in adult mice,
    reduced parvalbumin and perineuronal-net expression, and reopened ocular-dominance
    plasticity; closing one eye during the reopened window reduced cortical acuity, while in
    amblyopic animals the same treatment restored binocular vision.
  subject: GENE:OTX2
  predicate: POSITIVELY_REGULATES
  object: SV:plasticity.critical_period_permissiveness
  claim_type: causal_perturbation
  direction: decreases
  context:
    species: [SPECIES:NCBITaxon:10090]
    life_stage: adult
    baseline_context: mixed
    brain_regions: []
    cell_types: []
  phenotype_class: synaptic_plasticity_ltp_ltd
  causal_attribution:
    basis: adult_pharmacological_perturbation
    locus_to_gene_resolved: not_applicable
    alternative_explanations:
      - "the peptide acts on OTX2 capture by perineuronal nets rather than on OTX2 expression, so it perturbs a transfer step and not the transcription factor's own function"
      - "alanine-substituted and scrambled control peptides failed to reactivate plasticity, which supports specificity of the motif but not selectivity for OTX2 over other glycosaminoglycan-binding ligands"
      - "the endpoint is visual-cortex plasticity, not cognition; nothing here shows that reopening plasticity improves learning"
  evidence:
