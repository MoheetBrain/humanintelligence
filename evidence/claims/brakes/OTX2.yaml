- claim_id: CLM:brakes:OTX2:002
  statement: >-
    Visual experience drove accumulation of non-cell-autonomous OTX2 in cortical
    parvalbumin interneurons during postnatal development, infusing exogenous OTX2
    accelerated parvalbumin-cell maturation and advanced critical-period timing, and
    conditionally removing OTX2 from non-parvalbumin cells or from the visual pathway
    abolished plasticity altogether.
  subject: GENE:OTX2
  predicate: POSITIVELY_REGULATES
  object: SV:plasticity.critical_period_permissiveness
  claim_type: causal_perturbation
  direction: increases
  context:
