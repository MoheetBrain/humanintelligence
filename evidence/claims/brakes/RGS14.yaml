# Claims — RGS14, Cognitive Brake Atlas.
#
# Brake class: plasticity suppression (hippocampal area CA2).
# The evidence base is rodent-only and rests on a germline knockout, so the two
# distinctions that dominate this file are (a) germline deletion versus adult
# modifiability and (b) the complete absence of any human interventional or human
# genetic cognitive evidence.
#
# schema_version: 0.1.0

- claim_id: CLM:brakes:RGS14:001
  statement: >-
    Mice carrying a germline deletion of RGS14 exons 2-7 expressed robust long-term
    potentiation at glutamatergic CA2 synapses, which wild-type littermates lack, with no
    change in CA1 plasticity.
  subject: GENE:RGS14
  predicate: NEGATIVELY_REGULATES
  object: SV:plasticity.ltp_magnitude
  claim_type: causal_perturbation
  direction: decreases
  context:
    species: [SPECIES:NCBITaxon:10090]
    life_stage: adult
    baseline_context: healthy_wildtype
    brain_regions: []
    cell_types: []
  phenotype_class: synaptic_plasticity_ltp_ltd
  causal_attribution:
    basis: germline_knockout
    locus_to_gene_resolved: not_applicable
    alternative_explanations:
      - "a germline deletion cannot distinguish a developmental requirement from an ongoing adult brake"
      - "RGS14 scaffolds G-protein, H-Ras/ERK and calcium pathways, so the plasticity change need not be a direct consequence of losing one of them; the reported block by a MEK inhibitor localises the effect to ERK signalling but does not isolate a single mechanism"
  evidence:
