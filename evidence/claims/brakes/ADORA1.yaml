# Claims — ADORA1 (adenosine A1 receptor), Cognitive Brake Atlas.
#
# Brake class: arousal and sleep pressure. Adenosine accumulating with waking acts partly
# through A1 receptors to reduce excitability and to build sleep pressure.
#
# The decisive question for this target is whether antagonising the brake improves
# cognition in rested, non-withdrawn adults, or mostly restores a withdrawal deficit.
# The human evidence collected here is the sceptical literature, because that is the
# literature that actually tests the question. Note throughout that caffeine is a
# non-selective antagonist at A1 and A2A receptors, so no human caffeine result isolates
# ADORA1.
#
# schema_version: 0.1.0

