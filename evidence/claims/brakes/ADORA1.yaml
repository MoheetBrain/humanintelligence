    Mice with a conditional central-nervous-system deletion of the adenosine A1 receptor
    showed a selectively blunted slow-wave-activity rebound after restricted sleep and,
    unlike controls, failed to maintain normal working-memory performance under sleep
    restriction, while performing normally when sleep was not restricted.
