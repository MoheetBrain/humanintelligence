- claim_id: CLM:brakes:EIF2S1:002
  statement: >-
    The efficacy of the eIF2B-stabilising small molecule depends on the concentration of
    phosphorylated eIF2-alpha, disappearing above a critical intracellular threshold, so
    the phosphorylation state of EIF2S1 sets whether the downstream brake can be released
    pharmacologically at all.
  subject: GENE:EIF2S1
  predicate: NEGATIVELY_REGULATES
  object: SV:consolidation.consolidation_protein_synthesis_capacity
