# Claims — EIF2S1 (eIF2 alpha subunit), Cognitive Brake Atlas.
#
# Brake class: translational control. Phosphorylation of eIF2-alpha converts eIF2 from
# substrate to competitive inhibitor of eIF2B, arresting cap-dependent translation.
# EIF2S1 is the substrate; the inhibited node is the eIF2B complex, so this file and
# atlases/brakes claims for EIF2B_COMPLEX share evidence and cross-reference each other.
#
# schema_version: 0.1.0

- claim_id: CLM:brakes:EIF2S1:001
  statement: >-
    Learning reduced eIF2-alpha phosphorylation in mouse hippocampal excitatory neurons and
    in somatostatin-expressing but not parvalbumin-expressing inhibitory neurons, and
    genetically ablating the phosphorylation site in either of the two responsive
    populations raised general mRNA translation, strengthened synaptic plasticity and
    enhanced long-term memory.
  subject: GENE:EIF2S1
  predicate: NEGATIVELY_REGULATES
