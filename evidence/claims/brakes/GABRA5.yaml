# Claims — GABRA5 (alpha5 subunit of the GABA-A receptor), Cognitive Brake Atlas.
#
# Brake class: excitation / working-memory gain (tonic and slow dendritic inhibition).
# Central discipline of this file: the alpha5 brake plausibly protects representational
# specificity. Every claim that a reduction improves a memory domain is paired with the
# evidence that the same reduction costs discrimination, and with the human trial that
# failed.
#
# schema_version: 0.1.0

