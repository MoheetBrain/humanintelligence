# Claims — HDAC2, Cognitive Brake Atlas.
#
# Brake class: transcriptional. HDAC2 occupancy at plasticity-gene promoters limits the
# transcriptional programme available for synapse formation and consolidation.
#
# The two things this file must carry honestly are (a) that the rodent evidence rests on
# overexpression and germline deficiency rather than on adult-onset HDAC2-selective
# perturbation, and (b) that the human record for HDAC inhibitors in a CNS indication
# includes a randomised trial in which the class failed even to move its
# pharmacodynamic biomarker.
#
# schema_version: 0.1.0

