    Neuron-specific overexpression of HDAC2 in mice reduced dendritic spine density,
    synapse number, synaptic plasticity and memory formation, whereas HDAC2 deficiency
    increased synapse number and facilitated memory, and the overexpression phenotype was
    ameliorated by chronic histone-deacetylase inhibition.
