# Claims — KCNQ2 (Kv7.2), Cognitive Brake Atlas.
#
# Brake class: excitability homeostasis. KCNQ2/3 heteromers carry the M-current, which
# limits repetitive firing, produces spike-frequency adaptation and the medium
# afterhyperpolarisation, and supports subthreshold theta resonance.
#
# This is the clearest case in the atlas where releasing a brake in the adult impairs
# rather than improves cognition, and does so alongside seizures.
#
# schema_version: 0.1.0

- claim_id: CLM:brakes:KCNQ2:001
  statement: >-
    Conditional transgenic expression of dominant-negative KCNQ2 subunits in mouse brain
    produced spontaneous seizures, behavioural hyperactivity and hippocampal morphological
    change, and when the transgene was restricted to the period after the first postnatal
    weeks it produced increased neuronal excitability together with deficits, not
    improvements, in hippocampus-dependent spatial memory.
  subject: GENE:KCNQ2
  predicate: POSITIVELY_REGULATES
  object: PHENO:animal_spatial_memory
  claim_type: causal_perturbation
  direction: decreases
  context:
    species: [SPECIES:NCBITaxon:10090]
    life_stage: adult
    baseline_context: healthy_wildtype
    brain_regions: []
    cell_types: []
  phenotype_class: animal_spatial_memory
  causal_attribution:
    basis: adult_inducible_genetic_perturbation
    locus_to_gene_resolved: not_applicable
    alternative_explanations:
      - "a dominant-negative subunit suppresses the heteromeric M-current and therefore implicates KCNQ2 and KCNQ3 jointly rather than KCNQ2 alone"
      - "seizure activity is itself sufficient to impair spatial memory, so the memory deficit need not be a direct consequence of reduced M-current in memory circuits"
      - "the retrieved abstract reports restriction of transgene expression to defined developmental periods; the post-critical-period condition is the adult-relevant arm and is the one cited here"
  evidence:
    - source_id: SRC:PMID:15608631
      design: overexpression
      species: SPECIES:NCBITaxon:10090
      population: "male and female transgenic mice with conditional, temporally restricted dominant-negative KCNQ2 expression and controls"
      sample_size:
        reported_as: null
        value: null
        unit: animals
      endpoint: "spontaneous seizures, locomotor activity, hippocampal morphology, spatial memory in a swimming task; CA1 excitability, spike-frequency adaptation, medium afterhyperpolarisation and subthreshold theta resonance"
      endpoint_category: animal_spatial_memory
      endpoint_measured: measured
      effect_direction: decrease
      effect_size:
        metric: not_extracted
        as_reported: null
        value: null
        ci_lower: null
        ci_upper: null
        p_value: null
      replication_status: single_study
      evidence_role: contradicts
      extraction:
        basis: abstract
        extracted_by: agent:brakes
        extracted_on: "2026-09-17"
        content_checked: true
  translation:
    adult_relevance: demonstrated_in_adults
    healthy_baseline: tested_in_healthy
    supra_normal: contradicted
    human_relevance: rodent_only
