- claim_id: CLM:brakes:KCNQ2:002
  statement: >-
    In adult mouse hippocampal slices, stimulating cholinergic afferents produced a
    muscarinic, calcium-dependent inhibition of the axonal KCNQ/M current in dentate
    granule cells that lowered the action-potential threshold and raised intrinsic
    excitability for at least 30 minutes, and KCNQ2 and KCNQ3 subunits were localised
    immunohistochemically to those axons.
  subject: GENE:KCNQ2
  predicate: NEGATIVELY_REGULATES
  object: SV:stability.intrinsic_excitability
  claim_type: mechanistic
  direction: decreases
  context:
