# Claims — KCNQ3 (Kv7.3), Cognitive Brake Atlas.
#
# Brake class: excitability homeostasis. KCNQ3 is the obligate partner of KCNQ2 in the
# neuronal M-current heteromer. Every claim below is therefore a claim about the
# heteromer, and none isolates KCNQ3. This is recorded as a limitation, not smoothed
# over: the atlas has no KCNQ3-selective causal evidence at all.
#
# schema_version: 0.1.0

- claim_id: CLM:brakes:KCNQ3:001
  statement: >-
    Suppressing the neuronal M-current in mouse brain with a dominant-negative KCNQ2
    subunit, which acts on the KCNQ2/KCNQ3 heteromer, caused seizures and hyperactivity,
    and when restricted to the period after the first postnatal weeks produced increased
    excitability with impaired hippocampus-dependent spatial memory.
  subject: GENE:KCNQ3
  predicate: POSITIVELY_REGULATES
  object: PHENO:animal_spatial_memory
  claim_type: causal_perturbation
  direction: decreases
  context:
    species: [SPECIES:NCBITaxon:10090]
    life_stage: adult
    baseline_context: healthy_wildtype
    brain_regions: []
    cell_types: []
  phenotype_class: animal_spatial_memory
  causal_attribution:
    basis: adult_inducible_genetic_perturbation
    locus_to_gene_resolved: not_applicable
    alternative_explanations:
      - "the transgene encodes a KCNQ2 subunit, so KCNQ3 involvement is inferred from obligate heteromerisation and is not directly demonstrated"
      - "seizures can mediate the memory deficit"
      - "no KCNQ3-selective genetic or pharmacological perturbation was located in this session"
  evidence:
    - source_id: SRC:PMID:15608631
      design: overexpression
      species: SPECIES:NCBITaxon:10090
      population: "transgenic mice with conditional dominant-negative suppression of the neuronal M-current and controls"
      sample_size:
        reported_as: null
        value: null
        unit: animals
      endpoint: "seizures, locomotor activity, spatial memory, CA1 excitability and subthreshold theta resonance"
      endpoint_category: animal_spatial_memory
      endpoint_measured: measured
      effect_direction: decrease
      effect_size:
        metric: not_extracted
        as_reported: null
        value: null
        ci_lower: null
        ci_upper: null
        p_value: null
      replication_status: single_study
      evidence_role: contradicts
      extraction:
        basis: abstract
        extracted_by: agent:brakes
        extracted_on: "2026-09-17"
        content_checked: true
  translation:
    adult_relevance: demonstrated_in_adults
    healthy_baseline: tested_in_healthy
    supra_normal: contradicted
    human_relevance: rodent_only
    general_intelligence_relevance: animal_task_only
  uncertainty:
    representation: ordinal_grade
    scale: evidence_strength_v1
