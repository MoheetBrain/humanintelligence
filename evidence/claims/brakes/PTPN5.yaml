# Claims — PTPN5 (STEP, striatal-enriched protein tyrosine phosphatase),
# Cognitive Brake Atlas.
#
# Brake class: synaptic signalling. STEP dephosphorylates substrates that promote
# glutamate-receptor surface expression and ERK signalling, opposing synaptic
# strengthening.
#
# Both claims below are deficit-reversal results in disease models from the same
# laboratory. This atlas records no evidence that inhibiting STEP raises an intact
# baseline, and no human evidence of any kind.
#
# schema_version: 0.1.0

- claim_id: CLM:brakes:PTPN5:001
  statement: >-
    A benzopentathiepin inhibitor of STEP, identified in a large screening effort and shown
    to form a reversible covalent bond with the catalytic cysteine, raised tyrosine
    phosphorylation of STEP substrates in cells and improved performance on several
    cognitive tasks in 6- and 12-month-old triple-transgenic Alzheimer-model mice without
    changing amyloid-beta or phosphorylated tau levels.
  subject: CPD:tc_2153
  predicate: CHANGES_STATE
  object: SV:plasticity.ltp_threshold
