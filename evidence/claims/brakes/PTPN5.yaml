- claim_id: CLM:brakes:PTPN5:002
  statement: >-
    In mice treated with the NMDA-receptor antagonist phencyclidine, STEP61 levels rose and
    brain-derived neurotrophic factor expression fell, and both genetic knockdown and
    pharmacological inhibition of STEP prevented the fall in BDNF expression and normalised
    the drug-induced hyperlocomotion and cognitive deficits.
  subject: GENE:PTPN5
  predicate: NEGATIVELY_REGULATES
  object: SV:plasticity.ltp_threshold
  claim_type: causal_perturbation
  direction: increases
  context:
    species: [SPECIES:NCBITaxon:10090]
