# Claims — GPR158, Cognitive Brake Atlas.
#
# Brake class: metabotropic negative regulation of excitability, via the GPR158-RGS7
# complex and the Kv4.2 A-type potassium channel in prefrontal cortex.
#
# Important caution recorded up front: GPR158 is not unambiguously a brake. In one line
# of work it suppresses prefrontal excitability and its deletion confers stress
# resilience, which fits the brake frame. In another line it is the receptor that
# transduces a pro-cognitive peripheral hormone signal in CA3, where losing it would be
# expected to impair rather than improve memory. Both are recorded.
#
# schema_version: 0.1.0

- claim_id: CLM:brakes:GPR158:001
  statement: >-
    Deleting GPR158 or its partner RGS7 in mice raised the intrinsic excitability of layer
    2/3 pyramidal neurons in the prelimbic prefrontal cortex and prevented the reduction in
    excitability that chronic restraint stress otherwise caused, and GPR158 was shown to
    associate physically with the Kv4.2 A-type potassium channel and to promote its
    function.
  subject: GENE:GPR158
  predicate: NEGATIVELY_REGULATES
  object: SV:stability.intrinsic_excitability
  claim_type: causal_perturbation
  direction: decreases
  context:
    species: [SPECIES:NCBITaxon:10090]
    life_stage: adult
    baseline_context: sleep_deprived_or_stressed
    brain_regions: []
    cell_types: []
  phenotype_class: cellular_excitability
  causal_attribution:
    basis: germline_knockout
    locus_to_gene_resolved: not_applicable
    alternative_explanations:
      - "constitutive deletion; adult-onset removal was not tested in the retrieved abstract"
      - "the endpoint is cellular excitability and a depressive-like behavioural state, not cognition"
      - "the Kv4.2 interaction was characterised partly in heterologous cells"
