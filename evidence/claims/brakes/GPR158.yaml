- claim_id: CLM:brakes:GPR158:003
  statement: >-
    In a separate line of work GPR158 was identified as the neuronal receptor in
    hippocampal area CA3 through which the bone-derived hormone osteocalcin supports
    hippocampus-dependent memory, and peripherally delivered osteocalcin improved memory and
    reduced anxiety-like behaviour in 16-month-old mice, which places GPR158 in a
    memory-promoting rather than memory-limiting role.
