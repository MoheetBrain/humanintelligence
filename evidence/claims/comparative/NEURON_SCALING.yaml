# Comparative claims: neuron counts, cellular scaling rules, and their metabolic
# correlates. Contract: docs/DATA_CONTRACT.md §4.
#
# READ THIS BEFORE READING THE CLAIMS.
#
# Every claim in this file is an ANATOMICAL OR METABOLIC MEASUREMENT. Not one of these
# studies measured cognition in the same animals whose neurons it counted. The cognitive
# framing that surrounds this literature — "cognitive power per unit mass", "superior
# cognitive abilities" — is the authors' inference from published behavioural work on
# other individuals, usually other species, and it is exactly the narrative inference
# this atlas exists to suppress. The `statement` of each claim therefore says what was
# counted, in what tissue, by what method; the cognitive interpretation appears only in
# `risks`.
#
# ontology/edges.yaml has no relation meaning "this anatomical property differs between
# species" (see docs/blackboard/schema_change_requests/comparative-001.yaml). These
# claims use `CONSTRAINS` — the weakest legal capacity relation — with
# `direction: unclear` and `claim_type: theoretical_construct`, because the neuron count
# is measured but its relation to information throughput is not. CONSTRAINS' own
# semantics in ontology/edges.yaml state that asserting a constraint does not assert that
# removing it raises performance; that reading is intended here.
#
# `context.phylogenetic_control`, `context.phylogenetic_control_basis` and
# `context.species_count` are not yet in the schema; see the change request above.

