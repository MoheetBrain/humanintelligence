      - "allometry: neuron density falls with brain size in mammals, so a comparison at equal brain mass compares a large bird brain against a small mammal brain, two different positions on each clade's own scaling curve"
      - "publication and sampling bias towards large-brained parrots and corvids, the species the avian-cognition literature has already selected as impressive"
      - "smaller neurons are not equivalent processing units: neuron count says nothing about connectivity, synapse number, firing rate or coding scheme"
