    phylogenetic_control: none
    phylogenetic_control_basis: >-
      Two bird species, chosen for tractability and for differing sensory
      specialisations, compared qualitatively against mammalian cortical architecture.
      No phylogenetic model, and with two species none is possible. The PubMed record's
      MeSH terms include Columbidae, Strigiformes, Rats, Chlorocebus aethiops and Humans,
      indicating mammalian comparison material was also examined.
