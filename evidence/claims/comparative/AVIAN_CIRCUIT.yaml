# Convergent circuit architecture in the avian pallium. Contract: docs/DATA_CONTRACT.md §4.
#
# This is the atlas's strongest candidate for genuine mechanistic convergence — a
# repeated circuit motif in a lineage that has no laminated neocortex at all — and it is
# recorded at a low evidence level because it is fibre-architecture anatomy in two bird
# species with no physiology and no behaviour. That combination is the whole point:
# "convergent mechanism" and "well-evidenced" are independent properties, and this atlas
# will not let the appeal of the first substitute for the second.

- claim_id: CLM:comparative:AVIAN_CIRCUIT:001
  schema_version: 0.1.0
  statement: >-
    Stacho and colleagues imaged fibre architecture with three-dimensional polarised
    light imaging and traced connections in pigeon and barn owl pallium, describing an
    iteratively repeated column-like circuit crossing the layer-like nuclear boundaries
    of the hyperpallium and sensory dorsal ventricular ridge, linked to neighbouring
    columns and to associative and motor areas.
