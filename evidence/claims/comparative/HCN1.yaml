  predicate: MODULATES
  object: CELL:cortical_pyramidal_neuron
  claim_type: theoretical_construct
  direction: state_dependent
  direction_context: >-
    cortical layer: the human-versus-rodent difference in h-current reverses sign between supragranular layers, where h-channel-dependent membrane properties are stronger in human than mouse, and layer 5, where human HCN conductance falls below the mammalian allometric prediction. The dependency is on laminar position, not on physiological state.
