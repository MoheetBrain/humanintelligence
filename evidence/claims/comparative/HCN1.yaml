  statement: >-
    Kalmbach and colleagues found by single-cell and single-nucleus RNA sequencing that
    HCN1 transcript is present across excitatory neurons of human supragranular temporal
    cortex but not across mouse supragranular excitatory neurons, where the labelling
    they detected was attributed to interneurons.
  subject: GENE:HCN1
  predicate: EXPRESSED_IN
  object: CELL:supragranular_pyramidal_neuron
  claim_type: expression
  direction: unclear
  context:
    species: [SPECIES:NCBITaxon:9606, SPECIES:NCBITaxon:10090]
    species_count: 2
    phylogenetic_control: none
    phylogenetic_control_basis: >-
      A two-species contrast. With two species there is one comparison and zero degrees
      of freedom for ancestry, so no phylogenetic control is possible even in principle
      and none is claimed. Any lineage-specific interpretation rests on outgroup data
      this study does not provide.
    life_stage: adult
    baseline_context: disease_population
    brain_regions: [REGION:temporal_cortex]
    cell_types: [CELL:supragranular_pyramidal_neuron]
  phenotype_class: not_applicable
  causal_attribution:
    basis: correlational_expression
    locus_to_gene_resolved: not_applicable
    alternative_explanations:
      - "human tissue came from temporal lobe epilepsy and tumour resections; HCN channel expression is itself altered in epilepsy, so disease could produce the species difference"
      - "the mouse comparator region is temporal association area, chosen as an analogue of human middle temporal cortex; the regions are homologised by argument, not by a conserved landmark"
      - "transcript abundance is not channel protein, surface density or conductance"
      - "cross-species single-cell data require cell-type matching across species, and the human and mouse taxonomies were built separately"
  evidence:
