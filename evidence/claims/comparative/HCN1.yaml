- claim_id: CLM:comparative:HCN1:003
  schema_version: 0.1.0
  statement: >-
    Beaulieu-Laroche and colleagues recorded layer 5 pyramidal neurons in ten mammalian
    species and found that HCN and voltage-gated potassium conductances follow an
    allometric relationship with neuron size in nine of them, while human layer 5
    neurons were statistically significant outliers with much lower conductances than
    their size predicts.
  subject: PROT:HCN1
  predicate: MODULATES
  object: CELL:layer5_pyramidal_neuron
  claim_type: mechanistic
  direction: unclear
  context:
    species:
      - SPECIES:NCBITaxon:9606
      - SPECIES:NCBITaxon:109475
      - SPECIES:NCBITaxon:10090
      - SPECIES:NCBITaxon:10047
      - SPECIES:NCBITaxon:10116
      - SPECIES:NCBITaxon:9668
      - SPECIES:NCBITaxon:10141
      - SPECIES:NCBITaxon:9986
      - SPECIES:NCBITaxon:9483
      - SPECIES:NCBITaxon:9544
    species_count: 10
    phylogenetic_control: none
    phylogenetic_control_basis: >-
      The methods report Pearson and Spearman correlation, ANCOVA for differences in
      linear fits, and ordinary linear regression on log-log scales. No PGLS,
      phylogenetic mixed model or independent contrasts. The analysis controls for
      NEURON SIZE (allometry), which is a real and important control, but not for shared
      ancestry: five of the nine non-human species (mouse, gerbil, rat, guinea pig,
      rabbit) are Glires, so the "conserved rule" is fitted largely within one clade,
      and several sub-analyses rest on n = 5, all of them Glires. The methods also state
      species were included on grounds of tissue availability, brain-size range and
      technical convenience, not phylogenetic sampling design.
    life_stage: adult
    baseline_context: disease_population
    brain_regions: [REGION:temporal_cortex]
    cell_types: [CELL:layer5_pyramidal_neuron]
  phenotype_class: cellular_excitability
  causal_attribution:
    basis: in_vitro_perturbation
    locus_to_gene_resolved: not_applicable
    alternative_explanations:
      - "human tissue is neurosurgical; every other species contributed healthy tissue, so the human outlier status is confounded with disease at the level of the whole comparison and cannot be separated by this design"
      - "phylogenetic pseudoreplication: with five Glires among nine species, the allometric rule could be a Glires rule that primates and the human were then tested against"
      - "the brain region differed across species, selected as the closest analogue to human anterior temporal lobe by the authors' judgement"
      - "conductance was estimated from recordings, so it inherits the assumptions of the extraction procedure and the cell-size measurement it is normalised by"
      - "an outlier in a fitted relationship is a statement about the fit, not a demonstrated functional consequence"
  evidence:
    - source_id: SRC:PMID:34759318
      design: electrophysiology
      endpoint_measured: measured
      species: SPECIES:NCBITaxon:9606
      population: "layer 5 thick-tufted cortical pyramidal neurons in acute slices from adult individuals of ten mammalian species; human tissue from neurosurgical patients"
      sample_size:
        reported_as: "n = 9 for shrew, mouse, gerbil, rat, ferret, guinea pig, rabbit, marmoset, and macaque"
        value: 10
        unit: species
      endpoint: "HCN and voltage-gated potassium conductance as a function of neuron size, fitted on log-log scales"
      endpoint_category: cellular_excitability
      effect_direction: decrease
      effect_size:
        metric: not_extracted
        as_reported: "Normalized average of HCN, Kpeak and Kplateau conductance (exponent 1.43 +/- 0.15, R= 0.966, p = 0.003, linear regression on log-log scale, F = 85.7 & 3 df, n = 5 for mouse, gerbil, rat, guinea pig, and rabbit)"
        value: null
        ci_lower: null
        ci_upper: null
        p_value: null
      replication_status: single_study
      evidence_role: supports
      extraction:
        basis: full_text
        extracted_by: agent:comparative
        extracted_on: "2026-09-17"
        content_checked: true
  translation:
    adult_relevance: demonstrated_in_adults
    healthy_baseline: disease_model_only
    supra_normal: untested
    human_relevance: human_observational
    general_intelligence_relevance: none
  uncertainty:
    representation: ordinal_grade
    scale: evidence_strength_v1
    level: 2
    rationale: >-
      Ten-species direct electrophysiology including adult human tissue is about as good
      as comparative cellular physiology gets, and the size control is genuine. Capped
      at 2 by this atlas's rule because there is no phylogenetic control, the
      non-human sample is clade-skewed, and the effect size quoted rests on n = 5 Glires.
    calibration_status: uncalibrated_subjective
  risks:
    - "THIS IS THE CLAIM THAT SHOULD MOST WORRY ANYONE RELYING ON RODENT HCN1 EVIDENCE. If human layer 5 neurons genuinely sit off the mammalian conductance relationship, the quantitative dose-response of an h-current intervention in mouse is not transferable to human, and the sign of a dendritic-integration effect may not be either."
    - "it also points OPPOSITE to CLM:comparative:HCN1:001 and :002 — see CLM:comparative:HCN1:004. The honest summary is layer-specific, not species-specific."
    - "the human outlier result is confounded with the fact that only the human tissue was diseased; that confound is structural to the design and no analysis in the paper removes it"
  confounders: ["neurosurgical tissue in the human arm only", "clade composition of the comparison set", "region non-equivalence across species", "neuron size estimation"]
