# Comparative claims bearing on the seed target TGT:HCN1 (h-current, HCN1 subunit).
# Contract: docs/DATA_CONTRACT.md §4. Lead atlas for the HCN1 dossier is agent:brakes;
# this file supplies only the comparative evidence and the two facets this agent owns.
#
# WHY THIS FILE MATTERS MORE THAN ITS SIZE SUGGESTS
#
# HCN1 is the one seed target where human-versus-rodent divergence has been measured
# directly by patch-clamp in both species, rather than inferred. It is therefore the
# best available test of how much rodent causal evidence transfers to adult humans.
# The answer is uncomfortable, and this file records the discomfort rather than
# resolving it:
#
#   * SRC:PMID:30392798 (Kalmbach 2018) finds h-channel-related membrane properties
#     STRONGER in human than mouse, in SUPRAGRANULAR (layer 2/3) pyramidal neurons,
#     with HCN1 transcript ubiquitous in human but not mouse supragranular excitatory
#     neurons.
#   * SRC:PMID:34759318 (Beaulieu-Laroche 2021) finds HCN conductance LOWER in human
#     than the mammalian allometric rule predicts, in LAYER 5 pyramidal neurons, with
#     human the sole outlier among ten species.
#
# These are not contradictory once the layer is attended to, and they are not
# reconcilable into a single "human HCN1 is higher/lower than rodent" statement. Any
# summary that picks one direction has discarded half the evidence.
# CLM:comparative:HCN1:004 records the tension explicitly so that no downstream reader
# can inherit only one side of it.
#
# Both human datasets come from neurosurgical tissue (epilepsy and tumour patients).
# `baseline_context` is therefore `disease_population` on every human claim here, and
# no claim in this file describes a healthy adult human.

- claim_id: CLM:comparative:HCN1:001
