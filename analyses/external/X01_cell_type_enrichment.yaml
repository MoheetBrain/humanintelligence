# Mandatory. The predictable failure mode of this result is over-reading it in whichever
# direction the reader already preferred, and BOTH over-readings are available here.
interpretation_guards:
  - >-
    A corrected P of approximately 0.08 does NOT mean pyramidal cells do not matter for
    cognition. It means this analysis, at this power, did not meet its own prespecified
    specificity threshold.
  - >-
    Two nominal P values of approximately 0.011 in two references do NOT mean pyramidal
    cells are proven intelligence cells. The references are not fully independent — they
    sample overlapping biology with related annotation pipelines — and the corrected
    value is the one the producer prespecified as decisive.
  - >-
    The analysis does NOT establish that cell-type effects are equal. Failure to
    demonstrate specificity is not demonstration of uniformity.
  - >-
    The analysis does NOT establish the absence of modest specificity; the producer
    reports power was insufficient to exclude it.
  - >-
    The analysis does NOT establish a causal cell type. Expression-weighted enrichment of
    association signal is a correlational design: gene size, gene density and the
    correlation structure between cell-class expression profiles are all live confounders,
    and none is addressed by a positive beta.
  - >-
    Nothing here licenses an intervention. A cell class is not a target, and an enriched
    cell class would not tell us which direction to push anything.

methodological_constraints_adopted:
  - constraint: >-
      Claude-side human-genetics analysis stays genome-wide and cell-class-agnostic. No
      pyramidal-only gate, and no cell-class prefilter of any kind, on candidate discovery
      or on X02 ingestion.
    rationale: >-
      X01 reportedly failed to establish cell-class specificity while leaving pyramidal
      effects positive in both references. Under that result a pyramidal gate would
      discard signal on the strength of a criterion that was not met.
    safe_before_verification: true

  - constraint: >-
      Extreme cognition is treated as continuous with ordinary-range cognition unless
      evidence shows otherwise, so discovery does not carve out an "exceptional" stratum
      by assumption.
    rationale: >-
      Reported by the producer and consistent with this repository's own polygenic
      picture; treating it as an assumption to be tested rather than a finding costs
      nothing and avoids building a separate evidence silo on unverified grounds.
    safe_before_verification: true

