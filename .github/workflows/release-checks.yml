name: Release checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-release-lock.txt
      - run: python -m pip install -r requirements-release-lock.txt
      - run: python -m pip install --no-deps -e .
      - run: python scripts/fetch_gene_identifiers.py --offline
      - run: python scripts/release/smoke.py
      - run: python scripts/release/audit_tree.py
      - run: python -m pytest -q -m 'not network and not slow'
