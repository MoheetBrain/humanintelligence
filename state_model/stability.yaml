        modality: questionnaire_or_diary
        status: established_human_proxy
    response_shape:
      shape: unknown
      basis: default_no_evidence_yet
      claim_refs: []
    polarity: risk
    desirability: unknown
    safety_coupling: []
    safety_coupling_basis: not_asserted_pending_claims
    status: active
    provenance:
      defined_by: agent:ontology
      basis: project_brief_sprint1

  - id: SV:stability.circadian_alignment
    name: "circadian alignment"
    definition: >-
      Phase agreement between the internal circadian oscillator and the organism's actual sleep,
      activity and light schedule.
    kind: observable_proxy
    timescale: days
    level: systems
    units: "hours of phase difference"
    measurement_proxies:
      - name: "dim-light melatonin onset"
        modality: blood_or_csf_biomarker
        status: established_human_proxy
