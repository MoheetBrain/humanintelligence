        modality: device_or_wearable
        status: established_human_proxy
    response_shape:
      shape: unknown
      basis: default_no_evidence_yet
      claim_refs: []
    polarity: margin
    desirability: unknown
    safety_coupling: []
    safety_coupling_basis: not_asserted_pending_claims
    status: active
    provenance:
      defined_by: agent:ontology
      basis: project_brief_sprint1

  - id: SV:stability.affective_stability
    name: "affective stability"
    definition: >-
      Degree to which affective state remains within its usual range and returns to baseline
      after perturbation.
    kind: latent_cognitive
    timescale: days
    level: behavioural
    units: null
    measurement_proxies:
      - name: "ecological momentary assessment variability"
        modality: questionnaire_or_diary
        status: established_human_proxy
      - name: "validated mood rating scales"
        modality: questionnaire_or_diary
        status: established_human_proxy
    response_shape:
      shape: unknown
      basis: default_no_evidence_yet
      claim_refs: []
    polarity: margin
    desirability: unknown
    safety_coupling: []
    safety_coupling_basis: not_asserted_pending_claims
    status: active
    provenance:
      defined_by: agent:ontology
      basis: project_brief_sprint1

  - id: SV:stability.stress_axis_load
    name: "stress axis load"
