  - id: SV:consolidation.retrieval_fidelity
    name: "retrieval fidelity"
    definition: >-
      Precision and completeness of a retrieved memory relative to the original event, separably
      from whether retrieval succeeded at all.
    kind: latent_cognitive
    timescale: weeks
    level: behavioural
    units: null
    measurement_proxies:
      - name: "continuous-report precision paradigms"
        modality: behavioural_task
        status: established_human_proxy
      - name: "source and detail memory scoring"
        modality: neuropsychological_battery
        status: established_human_proxy
    response_shape:
      shape: unknown
