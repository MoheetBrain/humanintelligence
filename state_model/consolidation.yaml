  - id: SV:consolidation.long_term_interference_resistance
    name: "long-term interference resistance"
    definition: >-
      Degree to which consolidated content resists degradation by subsequently learned similar
      content.
    kind: latent_cognitive
    timescale: weeks
    level: behavioural
    units: null
    measurement_proxies:
      - name: "AB/AC interference designs"
        modality: behavioural_task
        status: established_human_proxy
    response_shape:
