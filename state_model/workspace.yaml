  - id: SV:workspace.updating_efficiency
    name: "updating efficiency"
    definition: >-
      Cost, in time and accuracy, of replacing part of the maintained set with new content while
      preserving the rest.
    kind: latent_cognitive
    timescale: seconds
    level: behavioural
    units: null
    measurement_proxies:
      - name: "n-back and running-span updating tasks"
        modality: behavioural_task
        status: established_human_proxy
      - name: "reference-back paradigm"
        modality: behavioural_task
        status: research_proxy
    response_shape:
      shape: unknown
