  - id: SV:workspace.tonic_inhibition_level
    name: "tonic inhibition level"
    definition: >-
      Magnitude of persistent, non-synaptic inhibitory conductance setting the baseline
      excitability of a stated cell population, as distinct from phasic synaptic inhibition.
    kind: latent_biological
    timescale: minutes
    level: cellular
    units: "conductance per unit membrane area"
    measurement_proxies:
      - name: "ex-vivo whole-cell holding-current measurement"
        modality: ex_vivo_or_animal_only
        status: animal_only_proxy
      - name: "MRS GABA concentration as an indirect index"
        modality: mrs
        status: research_proxy
    response_shape:
      shape: unknown
      basis: default_no_evidence_yet
      claim_refs: []
    desirability: unknown
    safety_coupling: []
    safety_coupling_basis: not_asserted_pending_claims
    status: active
    provenance:
      defined_by: agent:ontology
      basis: project_brief_sprint1

  - id: SV:workspace.dendritic_integration_gain
    name: "dendritic integration gain"
    definition: >-
      Magnitude of the somatic response produced per unit of spatially distributed dendritic
      input, for a stated cell class and input pattern.
    kind: latent_biological
    timescale: milliseconds
    level: cellular
    units: "somatic response per unit dendritic input"
