      claim_refs: []
    desirability: unknown
    safety_coupling: []
    safety_coupling_basis: not_asserted_pending_claims
    related_primitives: [PRIM:relational_binding, PRIM:variable_binding]
    status: active
    provenance:
      defined_by: agent:ontology
