    kind: latent_cognitive
    timescale: seconds
    level: behavioural
    units: "bindings"
    measurement_proxies:
      - name: "feature-conjunction working memory tasks"
        modality: behavioural_task
        status: research_proxy
      - name: "item-context binding tasks"
        modality: behavioural_task
