  - id: SV:power.thermal_burden
    name: "thermal burden"
    definition: >-
      Local tissue temperature elevation attributable to metabolic heat production, relative to
      the regulated baseline.
    kind: latent_biological
    timescale: minutes
    level: systems
    units: "degrees C above baseline"
    measurement_proxies:
      - name: "MR thermometry"
        modality: mrs
