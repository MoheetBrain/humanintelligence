  - id: SV:power.ros_production_rate
    name: "reactive oxygen species production rate"
    definition: >-
      Rate of reactive oxygen species generation in neural tissue per unit mass per unit time.
    kind: latent_biological
    timescale: minutes
    level: cellular
    units: "arbitrary units per unit mass per time"
    measurement_proxies:
      - name: "oxidative damage markers in blood or CSF"
        modality: blood_or_csf_biomarker
        status: research_proxy
