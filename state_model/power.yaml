  - id: SV:power.neurovascular_coupling_gain
    name: "neurovascular coupling gain"
    definition: >-
      Magnitude of the local blood-flow response per unit of local neural activity change.
    kind: latent_biological
    timescale: seconds
    level: systems
    units: "flow change per unit activity"
    measurement_proxies:
      - name: "simultaneous EEG-fMRI response amplitude"
        modality: fmri_bold
        status: research_proxy
      - name: "stimulus-evoked flow response by ASL"
        modality: arterial_spin_labelling
        status: research_proxy
    response_shape:
      shape: unknown
