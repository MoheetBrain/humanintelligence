    kind: latent_biological
    timescale: hours
    level: cellular
    units: "mmol/kg wet weight"
    measurement_proxies:
      - name: "13C magnetic resonance spectroscopy glycogen"
        modality: mrs
        status: research_proxy
      - name: "ex-vivo biochemical assay"
        modality: ex_vivo_or_animal_only
        status: animal_only_proxy
    response_shape:
      shape: unknown
      basis: default_no_evidence_yet
      claim_refs: []
    desirability: unknown
    safety_coupling: []
    safety_coupling_basis: not_asserted_pending_claims
    status: active
    provenance:
      defined_by: agent:ontology
      basis: project_brief_sprint1

  - id: SV:power.cerebral_blood_flow
    name: "cerebral blood flow"
    definition: >-
      Volume of blood delivered per unit brain mass per unit time.
    kind: observable_proxy
    timescale: seconds
    level: systems
    units: "mL/100g/min"
    measurement_proxies:
      - name: "arterial spin labelling MRI"
        modality: arterial_spin_labelling
        status: established_human_proxy
      - name: "15O-water positron emission tomography"
        modality: pet
        status: established_human_proxy
      - name: "transcranial Doppler velocity"
        modality: device_or_wearable
        status: research_proxy
    response_shape:
      shape: unknown
      basis: default_no_evidence_yet
      claim_refs: []
    desirability: unknown
