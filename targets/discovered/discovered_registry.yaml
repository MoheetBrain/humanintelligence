# DISCOVERED candidate registry — Sprint 2, Task E.
#
# These genes were found by asking cognition GWAS which genes it implicates, rather than
# by being named in the project brief. They are HYPOTHESES and they are deliberately
# UNRANKED: entering this file confers no priority, and every entry faces the same
# contract, the same red team and the same gates as a seeded target.
#
# WHAT THIS EVIDENCE IS: positional mapping. A gene is here because an associated variant
# lies in or near it. That is the weakest available claim about causality — not a causal
# gene, not a direction, not an adult mechanism.
#
# THE ANCHORING RESULT THAT PROMPTED THIS FILE: of the 31 genes in the brief-supplied seed
# registry, only 9 appear anywhere in 10,741 cognition associations, and the best-supported
# of them (CKB, 5 studies) would rank outside the top 500 genes in this sweep. 151 genes
# not in the seed registry have >=10 distinct studies. The seed list is not what cognition
# GWAS implicates.
