# Seed target registry — Sprint 1.
#
# These are WORK ASSIGNMENTS AND STARTING HYPOTHESES, not conclusions and not a
# shortlist of "intelligence genes". The list originates from the project brief
# (user_seed_list) plus the brake/power exemplars named in it. Nothing here is
# privileged: a seed target that fails causal integration or red-team review is
# expected to be downgraded, and that outcome is a result, not a failure.
#
# Identifiers are deliberately absent: they are resolved from HGNC by
# scripts/fetch_gene_identifiers.py so that no agent hand-writes an accession.
#
# dossier_depth:
#   deep    — full dossier, >=4 verified claims incl. >=1 human-relevant claim where
#             one exists, all owner facets graded
#   shallow — registered seed, >=2 verified claims, facets graded only where the
#             evidence was actually reviewed; the rest stay `not_assessed`
schema_version: 0.1.0
registry_version: 0.1.0
