control_point_hypothesis:
  statement: 'The integrated stress response converts phosphorylated eIF2 into an inhibitor of eIF2B,
    arresting the cap-dependent translation that memory consolidation requires. Pharmacologically stabilising
    the active eIF2B decamer releases that arrest and enhances learning in healthy mice. The brake plausibly
    protects the cell: the same arrest is cytoprotective under acute stress, and the compound is inactive
    precisely when the stress response is strongly engaged, which may be why it is tolerated.'
