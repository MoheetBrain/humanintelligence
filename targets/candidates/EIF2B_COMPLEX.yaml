developmental_confound_rationale: The enhancing manipulation is an acute systemic small molecule given
  to adult mice, which does not depend on developmental history, and the human genetic evidence located
  here includes an ADULT-onset form with a mean age of clinical onset in the thirties, so the complex
  is required in the mature human brain and not only during development. The cell-type genetic evidence
  is of unstated onset but is corroborative rather than load-bearing. The residual developmental concern
  is that the same mutations more commonly present in childhood, so the requirement spans both windows.
open_questions:
- What is the phosphorylated-eIF2-alpha threshold in adult human neurons, and can it be measured non-invasively?
  Without that, the mechanism cannot be dosed.
- Has the mouse enhancement result been replicated by an independent laboratory in healthy animals?
- Does chronically suppressing a cytoprotective stress response have a cost that a short rodent experiment
  cannot see? Adults who lose eIF2B function progressively lose executive capacity, so the complex's activity
  is required; nothing located here bounds the safe range above normal.
- The one phase 2/3 human trial of an eIF2B activator measured motor function and survival; what would
  a cognitive endpoint have shown?
- Is enhancement observed in healthy animals distinct from restoration in animals with elevated baseline
  stress-response tone, for example after sleep loss or injury?
