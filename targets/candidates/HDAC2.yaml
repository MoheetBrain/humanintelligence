developmental_confound_rationale: The enhancement arm of the defining study is an Hdac2-deficient line,
  so a developmental contribution cannot be excluded, and no adult-onset HDAC2-selective perturbation
  was located. The adult pharmacological evidence that does exist is non-selective and produced only a
  phase-limited effect. HDAC2 also has broad roles outside the nervous system, so the developmental question
  is entangled with a systemic-exposure question.
open_questions:
- Does adult-onset, HDAC2-selective reduction enhance memory in healthy animals, or was the germline result
  developmental?
- The only randomised HDAC-inhibitor trial located in a CNS indication failed to move its own biomarker.
  Was that exposure, formulation or mechanism?
- Chronic histone-deacetylase inhibition carries an oncology-derived safety burden that no located cognitive
  study evaluates. What is the tolerable chronic exposure in healthy adults?
- If HDAC2 activity rises after potentiation as part of feedback, does inhibiting it raise a ceiling or
  destabilise a controller?
- Why did an inhibitor enhance an intermediate phase of potentiation lasting days but not the phase lasting
  weeks, which is the phase relevant to durable knowledge?
