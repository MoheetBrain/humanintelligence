control_point_hypothesis:
  statement: 'HDAC2 occupancy at the promoters of plasticity genes limits the transcriptional programme
    available for synapse formation and consolidation, so reducing HDAC2 activity should raise the ceiling
    on durable learning. The brake plausibly protects specificity and energy: transcriptional programmes
    that are cheap to open are also cheap to open for the wrong experience, and the enzyme is recruited
    by plasticity itself, which makes it a feedback element rather than a static cap.'
