control_point_hypothesis:
  statement: >-
    CKB catalyses the reaction that regenerates ATP from phosphocreatine on a
    millisecond-to-second timescale, so its activity could set how fast a neuron can
    refill its energy charge during bursts. The evidence here is weak for that reading:
    the only behavioural CKB data retrieved is a secondary report, the isoform-specific
    knockouts are partially compensated by the surviving phosphoryl-transfer systems,
    and the one clear causal phenotype is a SAFETY-DIRECTION result (suppressed
    chemically induced seizures), not a capacity result. No human perturbation
    evidence exists.
  proposed_modulation: unknown
  mechanism_chain:
