developmental_confound: high
developmental_confound_rationale: >-
  All CKB and creatine-kinase perturbations retrieved are germline knockouts, and the
  authors themselves report accompanying hippocampal mossy-fibre structural change.
  There is no adult-inducible manipulation of CKB in this dossier at any level.
open_questions:
  - "Is there a primary behavioural characterisation of the CKB single knockout? This dossier could only reach it as a secondary report (CLM:power:CKB:002) and that gap should be closed before CKB is ranked."
  - "Does the 31P-MRS phosphocreatine pool carry any information about creatine-kinase flux, or only about pool size? CLM:power:CKB:006 shows a LARGER pool in early Alzheimer's disease, which is the wrong direction for a reserve interpretation."
  - "Given the redundancy reported in CLM:power:CKB:003, is there any perturbation that would raise flux rather than remove a component?"
