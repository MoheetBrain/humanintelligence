control_point_hypothesis:
  statement: 'OTX2 protein captured from the extracellular space by perineuronal nets on parvalbumin interneurons
    maintains the closed state of the cortical critical period. Disrupting that capture in an adult reopens
    juvenile-type plasticity. This is the atlas''s clearest demonstration that a brake exists for a reason:
    in the same experiment, the reopened adult cortex lost acuity when an eye was closed, and amblyopic
    animals regained binocular vision. The brake protects acquired representations from being overwritten.'
