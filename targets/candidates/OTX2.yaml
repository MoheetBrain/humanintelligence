developmental_confound_rationale: 'OTX2''s demonstrated primary role is developmental: experience-driven
  transfer into parvalbumin cells sets critical-period timing, and conditional removal abolishes plasticity.
  The one adult manipulation reopens a developmental programme rather than tuning an adult parameter,
  and its consequence depended entirely on what happened next. A target whose function is to build and
  then protect the system is a poor candidate for adult enhancement.'
open_questions:
- Reopened adult plasticity was harmful under deprivation and beneficial in amblyopia. What state variable
