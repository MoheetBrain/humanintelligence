developmental_confound_rationale: The only causal evidence is a germline knockout, and the protein is
  undetectable at birth and rises through the first postnatal weeks to a sustained adult level. A lifelong
  absence of a plasticity brake during the period when hippocampal circuits are assembled is a different
  manipulation from removing it in an adult, and no adult-onset experiment exists.
open_questions:
- What does the CA2 plasticity brake protect? No located study measures a cost of removing it.
- Does adult-onset RGS14 reduction reproduce the germline phenotype, or is the phenotype developmental?
- Has the germline knockout behavioural phenotype been replicated by an independent laboratory? None was
  located in this session.
- Is there any human phenotype associated with RGS14 variation? Only expression-level evidence was located.
- Is a scaffolding protein with multiple interaction surfaces tractable at all by small molecule, and
  what would selectivity mean for it?
