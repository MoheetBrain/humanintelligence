control_point_hypothesis:
  statement: 'RGS14 in hippocampal area CA2 holds that subfield''s Schaffer-collateral synapses in a state
    that does not potentiate, by integrating G-protein and H-Ras/ERK signalling at the postsynaptic spine.
    Removing it permits CA2 potentiation and improves hippocampus-dependent learning in mice. What the
    brake protects is unknown and is the central open question: CA2 has been proposed to support social
    and temporal coding that may require stable rather than plastic weights.'
