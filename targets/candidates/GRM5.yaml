developmental_confound_rationale: Not assessed. The human trial was in 3- to 6-year-old children and was
  designed on the expectation that younger brains would have more learning plasticity than the adults
  in whom earlier mGluR5 NAM trials had failed; that design choice implies a developmental dependence
  hypothesis which the null result neither confirms nor refutes. No developmental expression data was
  retrieved.
open_questions:
- Why did a strong animal-model literature fail to transfer? The trial authors call explicitly for better
  strategies to decide which mechanisms will translate; that question is the reason GRM5 belongs in this
  repository.
- Both directions of mGluR5 modulation are claimed pro-cognitive in different disease contexts. Is there
  any healthy-baseline evidence at all? None was retrieved.
- No human genetic or healthy-adult interventional evidence for GRM5 and cognitive ability was retrieved.
