control_point_hypothesis:
  statement: 'GRM5 encodes mGluR5, a Gq-coupled metabotropic glutamate receptor that gates protein-synthesis-dependent
    plasticity and is physically and functionally coupled to NMDA receptors. The seed hypothesis is that
    mGluR5 signalling sets a gain on metabotropic plasticity. This dossier''s main contribution is negative:
    mGluR5 negative allosteric modulation had a large, confident animal-model literature in fragile X
    syndrome and a randomised human trial found no benefit on the primary or any secondary measure (CLM:...:GRM5:001),
    while the opposite direction of modulation is claimed to be pro-cognitive in Alzheimer models with
    an internal null of its own (CLM:...:GRM5:002).'
