control_point_hypothesis:
  statement: >-
    MCT4 is the low-affinity high-capacity exporter that would move glycolytically
    produced lactate out of astrocytes, making it the supply side of the proposed
    shuttle. Three rodent studies agree that knocking it down impairs learning and that
    exogenous lactate, pyruvate or ketone body restores performance. That rescue
    pattern is the most repeated observation in the field and also the one the critical
    literature says is most easily produced by non-specific energetic disruption.
