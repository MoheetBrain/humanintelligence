control_point_hypothesis:
  statement: >-
    HCAR1 makes lactate a signal rather than only a fuel, which would let activity
    -driven metabolic state feed back onto excitability, vascular supply and plasticity
    - an attractive "activity-dependent energy routing" control point. The retrieved
    evidence points the OTHER WAY. HCAR1 is Gi-coupled and its activation lowers
    cortical firing and spontaneous activity; receptor-null neurons are more active at
    baseline; receptor-null mice have HIGHER exercise endurance and preserved cortical
    excitability, with the lactate-HCAR1 axis reported as a cause of central fatigue;
    and an agonist that helps memory after training impairs it before training. The
    honest summary is that HCAR1 looks like a brake or a state-signal, not a throttle.
  proposed_modulation: context_dependent
