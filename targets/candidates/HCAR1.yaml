developmental_confound: moderate
developmental_confound_rationale: >-
  The clearest anatomical HCAR1 phenotype retrieved is developmental (retinal ganglion
  cell axon growth and ipsilateral projection to dLGN, CLM:power:HCAR1:006), and both
  in-vivo knockout studies used germline nulls, which permits lifelong compensation -
  the raised basal activity of receptor-null neurons in CLM:power:HCAR1:001 may be
  exactly that. The pharmacological arms (001, 002) are genuinely acute and adult.
open_questions:
  - "Can HCAR1 be engaged at physiological extracellular lactate at all, given the concentration objection recorded in CLM:power:HCAR1:005, or only in ischaemia, seizure and unmeasured microdomains?"
  - "If HCAR1 activation lowers cortical gain and contributes to central fatigue, is the correct hypothesis that HCAR1 antagonism rather than agonism raises sustainable load? Nothing retrieved tests that in a cognitive paradigm."
  - "The timing-dependent sign flip in CLM:power:HCAR1:002 has never been replicated and has no knockout control. Is it real?"
  - "There is NO human evidence for HCAR1 of any kind in this atlas."
