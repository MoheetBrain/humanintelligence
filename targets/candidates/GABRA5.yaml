control_point_hypothesis:
  statement: 'Extrasynaptic and slow dendritic inhibition carried by alpha5-containing GABA-A receptors
    in hippocampal pyramidal neurons sets a floor on the excitation required for NMDA-receptor-dependent
    plasticity, and therefore caps how readily a weak or temporally separated input can be encoded. The
    brake plausibly protects representational specificity: the same reduction that speeds spatial and
    trace learning slows discrimination between similar contexts in the same animals.'
