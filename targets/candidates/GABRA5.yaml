developmental_confound_rationale: 'The rodent genetic evidence comes from deletions whose onset precedes
  testing: the CA1-restricted line loses receptors progressively from about four weeks of age. Against
  that, the target is pharmacologically accessible in adults and human trials dosed adults and adolescents,
  so a developmental requirement is not the limiting unknown here; the limiting unknown is whether adult
  reduction helps a healthy adult at all.'
