control_point_hypothesis:
  statement: 'PDE4 enzymes hydrolyse cAMP and so limit the PKA- and CREB-dependent signalling that consolidation
    requires; inhibiting them should raise the ceiling on durable encoding. This is the only target in
    the brake atlas with randomised human evidence of above-baseline memory improvement in healthy adults.
    The brake plausibly protects against emesis and against indiscriminate second-messenger amplification:
    the benefit appeared at the lowest dose tested and adverse events at the highest, so the response
    is not monotone.'
