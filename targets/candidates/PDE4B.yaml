developmental_confound_rationale: Every located human result is acute adult dosing, and there is no developmental
  manipulation in the evidence base at all. The developmental confound is not the issue for this target;
  the issues are subtype selectivity and the non-monotone dose-response.
open_questions:
- All human evidence uses a pan-PDE4 inhibitor. Is any part of the effect attributable to PDE4B rather
  than to PDE4D, which is the subtype usually blamed for emesis?
- Why was the effective dose the lowest tested, with no benefit and adverse events at ten times that dose?
  A non-monotone curve of that shape needs replication before it can be believed.
- Verbal memory improved while working memory did not. Does this mechanism act on consolidation specifically
  rather than on capacity?
- All three located human studies come from overlapping groups. Has an independent group replicated the
  healthy-adult result?
- What happens on repeated rather than acute dosing, where tolerance and tolerability both change?
