developmental_confound_rationale: The gene's identified function is to close a developmental critical
  period, and the causal cognitive evidence comes from germline lines whose cortex developed without the
  brake. Adult pharmacological blockade has been shown to work, but only for repair after injury and with
  a motor endpoint, so the adult-versus-developmental question is unresolved for cognition.
open_questions:
- Two independent loss-of-function lines impair cognition. Is there any design in which removing this
  brake improves it?
- Does adult pharmacological blockade, which works for post-stroke repair, have any cognitive effect in
  an uninjured adult?
- Reopening juvenile-type plasticity in an adult cortex creates vulnerability as well as capacity. Nothing
  located here measures the vulnerability for RTN4R, unlike for OTX2 where it was measured directly.
- The human RTN4R literature is candidate-gene association with schizophrenia at a 22q11 locus. That is
  alphacognition's facet, and this atlas did not evaluate it.
