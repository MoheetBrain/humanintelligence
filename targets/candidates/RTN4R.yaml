control_point_hypothesis:
  statement: 'NgR1 transduces myelin-derived inhibition of axonal sprouting and, acting within parvalbumin
    interneurons, confines the disinhibitory step of cortical critical-period plasticity to the juvenile
    window. Blocking it in adults promotes structural plasticity and repair after injury. The brake plausibly
    protects the stability of learned circuits, and the cognitive evidence points the wrong way for release:
    two independent loss-of-function mouse lines show impaired rather than improved cognition.'
