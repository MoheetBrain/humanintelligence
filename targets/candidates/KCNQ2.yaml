developmental_confound_rationale: 'The defining study explicitly separates the two regimes: restricting
  M-channel suppression to the first postnatal weeks disturbed hippocampal morphological development,
  while suppression after that window produced excitability and memory changes without the morphological
  phenotype. That is the cleanest developmental-versus-adult dissociation in the atlas, and it shows the
  developmental role is real and separable, which is why the confound risk is recorded as high even though
  an adult-onset arm exists.'
open_questions:
- Is there any circumstance in which reducing the M-current improves cognition rather than impairing it?
  Nothing located here suggests one.
- Does the seizure liability mediate the memory deficit, or are they parallel consequences? The located
  study does not separate them.
- Endogenous acetylcholine already inhibits the axonal M-current transiently. Is there a role for modulating
  that endogenous control rather than the channel itself?
- Human KCNQ pharmacology exists only in the opening direction, and its liabilities are peripheral. What
  would the human safety profile of M-current reduction look like, and is the question even answerable
  without prohibited experimentation?
