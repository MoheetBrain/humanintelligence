control_point_hypothesis:
  statement: 'KCNQ2, with KCNQ3, carries the M-current, which limits repetitive firing, produces spike-frequency
    adaptation and the medium afterhyperpolarisation, and supports subthreshold theta resonance. It is
    the clearest case in this atlas of a brake that must not be released: suppressing it after the early
    postnatal period raises excitability and impairs spatial memory while causing seizures. What it protects
    is the seizure threshold and the resonance properties that make theta-band coding possible.'
