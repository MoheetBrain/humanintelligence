control_point_hypothesis:
  statement: In prefrontal cortex the GPR158-RGS7 complex suppresses intrinsic excitability by promoting
    Kv4.2 A-type potassium current and by damping homeostatic cAMP regulation, and its deletion confers
    stress resilience. That fits the brake frame. But in hippocampal area CA3 the same receptor transduces
    a pro-cognitive peripheral hormone signal, so losing it would be expected to impair memory. This dossier
    therefore records the target's sign as unresolved rather than asserting a brake.
