developmental_confound_rationale: The excitability and affect evidence rests on germline deletions, and
  the memory evidence on a germline receptor knockout in aged animals, so developmental contributions
  are unexcluded throughout. One adult regional restoration experiment shows adult sufficiency for the
  partner protein, which keeps the confound at moderate rather than high.
open_questions:
- Is GPR158 a cognitive brake at all? The prefrontal and hippocampal literatures assign it opposite signs
  and this atlas leaves the question open.
- Does adult-onset GPR158 removal reproduce either phenotype, or are both developmental?
- The prefrontal work uses affective endpoints and the hippocampal work uses memory endpoints. Has anyone
  measured both in the same animals?
- If the receptor transduces a circulating hormone signal in one region and suppresses excitability in
  another, can a systemic ligand ever produce a coherent effect?
