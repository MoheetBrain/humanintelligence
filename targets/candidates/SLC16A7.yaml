control_point_hypothesis:
  statement: >-
    If neurons import astrocyte-derived lactate to fuel the protein synthesis that
    consolidation requires, then neuronal MCT2 is the last gate on that route and its
    capacity could bound how much new long-term memory a circuit can lay down per unit
    time. Four independent rodent knockdown studies agree that removing MCT2 blocks
    long-term memory and that, unlike astrocytic transporter knockdown, the deficit is
    NOT rescued by lactate, pyruvate, ketone body or glucose. That asymmetry is the
    best mechanistic evidence in this atlas. It is also entirely rodent, entirely
    loss-of-function, and rests on a toolkit whose specificity is published as disputed.
  proposed_modulation: increase_activity
  mechanism_chain:
    - CLM:power:anls:001
    - CLM:power:SLC16A7:001
    - CLM:power:SLC16A7:003
    - CLM:power:SLC16A7:002
