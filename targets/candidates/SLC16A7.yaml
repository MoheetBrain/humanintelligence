developmental_confound: low
developmental_confound_rationale: >-
  The MCT2 evidence base is unusual in this atlas for being genuinely adult and acute:
  knockdown was performed in adult animals and tested within days. The confound here is
  not developmental timing but tool specificity, and a heterologous route through
  blunted adult neurogenesis that the authors of CLM:power:SLC16A7:004 report themselves.
open_questions:
  - "Is there any human data on SLC16A7 at all? None was retrieved: no human genetic phenotype, no imaging proxy, no intervention. This is the largest single gap in the deep half of this atlas."
  - "Does the MCT2 no-rescue asymmetry survive a manipulation that does not rely on antisense oligodeoxynucleotides or viral knockdown, given the specificity critique in CLM:power:anls:002?"
  - "Does raising MCT2 above normal do anything? No study retrieved tests gain of function, so the proposed_modulation above is a hypothesis with zero supporting evidence."
  - "How much of the memory phenotype is mediated by the neurogenesis effect rather than by neuronal fuelling?"
