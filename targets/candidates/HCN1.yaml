control_point_hypothesis:
  statement: 'The h-current carried by HCN1 in distal pyramidal dendrites shunts and temporally narrows
    synaptic input, constraining how much distal information reaches the soma and how readily distal synapses
    potentiate. Reducing it in mouse forebrain enhances hippocampus-dependent learning. The brake is plausibly
    part of a stability loop rather than a free parameter: the same current is upregulated by activity
    as negative feedback that normalises output firing, so chronic suppression should be opposed by the
    loop itself.'
