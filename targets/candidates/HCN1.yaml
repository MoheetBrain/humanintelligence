developmental_confound_rationale: The enhancement result uses a forebrain-restricted deletion that is
  spatially but not temporally restricted, so developmental reorganisation of dendritic excitability cannot
  be excluded. A recent study using conditional overexpression and deletion reports effects in adult animals,
  but the retrieved abstract does not state the age at induction. The homeostatic evidence, in contrast,
  argues that the channel remains actively regulated throughout life, which favours adult modifiability.
open_questions:
- Does an adult-onset, temporally controlled reduction of HCN1 reproduce the enhancement seen in the forebrain-restricted
  knockout?
- Does the activity-dependent homeostatic increase in h-current oppose chronic pharmacological block,
  and on what timescale?
- Direct recordings from adult human layer 5 dendrites show weaker dendrite-to-soma coupling and lower
  ion-channel density than rat. If the human system is already configured toward weak distal coupling,
  does reducing this channel move it in a useful direction at all? The comparative atlas owns the cross-species
  facets; this atlas records the fact as a translation cap.
- The same deletion that improved learning raised seizure susceptibility in adults. Is there any reduction
  magnitude that gains the learning effect without the excitability cost, and how would it be found without
  prohibited experimentation?
- Do the fragile-X and stress findings mean that the optimal direction of HCN1 modulation is state-dependent
  rather than fixed?
