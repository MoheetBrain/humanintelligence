open_questions:
- Does an adenosine antagonist improve cognition in rested, low-habitual-use adults who are not in withdrawal?
  No located study uses that design, and the nearest evidence, in children, found no effect in non-consumers.
- Is the flat human dose-response a property of arousal itself or of tolerance? A flat curve means the
  state variable is being switched rather than titrated.
- How much of the caffeine literature reflects A2A rather than A1 receptors? No human study located here
  separates them, so no human claim in this dossier isolates ADORA1.
- If the brake exists to accumulate and then discharge sleep pressure, is any chronic antagonism strategy
  compatible with the function it interrupts?
- What is the working-memory cost of blunting slow-wave rebound in humans, given that the mouse knockout
  showed exactly that cost?
