control_point_hypothesis:
  statement: 'Adenosine accumulating across waking acts partly through A1 receptors to reduce neuronal
    excitability and to build the homeostatic sleep pressure that slow-wave activity discharges. Antagonising
    the receptor raises arousal. The brake protects something measurable: removing A1 signalling blunts
    the slow-wave rebound and, under sleep restriction, causes working memory to fail. The human literature
    is consistent with the antagonist mostly restoring a withdrawal deficit rather than raising an intact
    baseline.'
