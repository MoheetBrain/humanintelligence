developmental_confound: high
developmental_confound_rationale: >-
  The strongest evidence for this target is a developmental syndrome, and the one study
  that separated timing found deficits only when the gene was deleted neonatally
  (CLM:power:SLC6A8:002). Every rodent perturbation in this dossier other than that
  adult arm is developmental. Treating any of it as adult-modifiability evidence is the
  specific error this dossier exists to block.
open_questions:
  - "Is there any human evidence at all on brain creatine transport capacity in healthy adults at normal baseline, as opposed to substrate loading?"
  - "The adult-onset knockout null (CLM:power:SLC6A8:002) is a single unreplicated study with no reported sample size or depletion measurement. How complete was adult depletion?"
  - "Why does the vegetarian fluid-reasoning result (CLM:power:creatine_human:001) not appear in the pooled young-adult subgroup estimate, and is dietary baseline the discriminating variable or is the 2003 result a false positive?"
  - "Does the reported GABAergic locus of the creatine-dependent phenotype (CLM:power:SLC6A8:004) survive a non-confounded Cre line?"
