control_point_hypothesis:
  statement: >-
    Creatine transport into brain cells sets the size of the phosphocreatine buffer
    available to absorb rapid ATP demand, so SLC6A8 capacity could in principle bound
    how much transient computational load a circuit can sustain. The evidence
    assembled here supports the first half of that statement in the DEFICIENCY range
    and actively undermines the second half for a healthy adult: adult-onset deletion
    of the transporter in mice produced no cognitive deficit, and randomised human
    supplementation shows no effect in rested, fed young adults at normal baseline.
    This target is therefore retained as a boundary marker, not as a candidate
    enhancement control point.
  proposed_modulation: restore_toward_setpoint
  mechanism_chain:
    - CLM:power:SLC6A8:001
    - CLM:power:SLC6A8:003
    - CLM:power:SLC6A8:002
