developmental_confound: unknown
developmental_confound_rationale: 'Not assessed: no developmental evidence for HTR2A was retrieved in
  v0.1.'
open_questions:
- Is there ANY measured (not self-reported) cognitive-flexibility improvement in healthy adults from 5-HT2A
  agonism? None was retrieved; the closest human data are an acute impairment rating and a cognitive null.
- 'Post-acute versus acute: all retrieved human data is acute intoxication. Claims about lasting flexibility
  gains were not retrievable with the searches run.'
- Both psilocybin and LSD are receptor-promiscuous, so no retrieved human evidence isolates HTR2A.
- The liability list is drawn from the acute human study's own reported effects; a systematic psychiatric-liability
  search (persisting perceptual changes, psychosis risk) was NOT run by this agent and belongs to the
  red team.
- 'State-variable coupling caveat — SV:safety.anxiety_risk: the cited human study reported higher anxiety
  ratings at the higher dose; psychosis risk was NOT measured and is deliberately not asserted'
