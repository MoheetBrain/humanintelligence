control_point_hypothesis:
  statement: 'HTR2A encodes the 5-HT2A receptor, densely expressed on cortical pyramidal neurons and the
    primary molecular target of serotonergic psychedelics. Two seed hypotheses are usually run together
    and are separated here: (a) 5-HT2A signalling supports cognitive flexibility and cortical plasticity,
    and (b) 5-HT2A agonism carries psychiatric liability. The retrieved evidence supports (a) only indirectly
    and in rodents via ANTAGONISM impairing reversal learning (CLM:...:HTR2A:001, whose regional localisation
    attempt was null), while the only direct human interventional evidence shows acute self-reported impairment
    of control and cognition (CLM:...:HTR2A:002) and a null on measured cognitive empathy and moral reasoning
    (CLM:...:HTR2A:003).'
  proposed_modulation: context_dependent
  mechanism_chain:
  - CLM:alphacognition:HTR2A:001
  - CLM:alphacognition:HTR2A:002
  state_variables:
  - id: SV:cognition.cognitive_flexibility
    asserted_relation: modulates
    direction: unclear
    response_shape: unknown
    claim_refs:
    - CLM:alphacognition:HTR2A:001
  - id: SV:safety.anxiety_risk
    asserted_relation: modulates
    direction: increases
    response_shape: unknown
    claim_refs:
    - CLM:alphacognition:HTR2A:002
