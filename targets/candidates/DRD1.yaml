control_point_hypothesis:
  statement: 'DRD1 encodes the D1 dopamine receptor, concentrated on dendritic spines of prefrontal pyramidal
    neurons, where it sets the signal-to-noise gain that sustains delay-period activity. The seed hypothesis
    is NOT that more D1 signalling is better: the documented relation between D1 stimulation and working-memory
    performance is an INVERTED U, with impairment at both low and high stimulation (CLM:...:DRD1:001).
    DRD1 is in the seed list as the standing counter-example to any ranking rule that rewards ''how far
    can this state variable be pushed''.'
  proposed_modulation: restore_toward_setpoint
  mechanism_chain:
  - CLM:alphacognition:DRD1:001
  state_variables:
  - id: SV:workspace.working_memory_capacity
    asserted_relation: modulates
    direction: inverted_u
    response_shape: inverted_u
    claim_refs:
    - CLM:alphacognition:DRD1:001
    - CLM:alphacognition:DRD1:002
  - id: SV:workspace.recurrent_gain
    asserted_relation: modulates
    direction: inverted_u
    response_shape: inverted_u
