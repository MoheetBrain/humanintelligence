developmental_confound_rationale: 'Not assessed: no developmental evidence for DRD1 was retrieved in v0.1.'
open_questions:
- The position of the optimum is state-dependent (baseline dopamine tone, stress, task load). A dose-response
  curve measured at one baseline does not define an intervention target. No study characterising the optimum
  as a function of baseline was retrieved.
- No primary human interventional result for D1 agonism and cognition was retrieved; the only human-facing
  evidence is a review (CLM:...:DRD1:002) describing patient-population testing.
- D1 versus D5 pharmacological non-selectivity is stated by the primary source itself, so no retrieved
  pharmacology isolates DRD1.
- No liabilities are listed because none were retrieved; D1 agonism has obvious cardiovascular and psychiatric
  questions that were not searched.
