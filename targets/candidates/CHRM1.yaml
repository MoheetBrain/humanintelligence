developmental_confound: low
developmental_confound_rationale: The human evidence is adult and aged-adult pharmacology, and the healthy-adult
  result was obtained in adults 10 days into dosing. The one developmental caveat is that the rodent evidence
  is a GERMLINE knockout (CLM:...:CHRM1:005), whose lifelong compensation makes it a poor model of acute
  adult M1 blockade — that is a confound in the counter-evidence, not in the supporting evidence.
open_questions:
- Does the HTL0018318 cognitive signal replicate outside the developer-affiliated study, and does it survive
  pre-registered endpoints rather than exploratory pharmacodynamics?
- Is the healthy-adult effect an enhancement or a recovery from a suboptimal state (time of day, fatigue,
  practice)? The source does not separate these.
- The rodent germline knockout shows task-dependent bidirectional effects. What is the task-dependence
  profile of M1 AGONISM in healthy adults? Only two tests were reported positive; the rest of the battery's
  results are not in the abstract.
- Does peripheral blockade (as in the xanomeline-trospium combination) preserve central M1 cognitive effects
  while removing the dose ceiling? No cognitive endpoint from that combination was retrieved.
- 'Tolerance: all human cognitive data here is 10 days or less at cognitive endpoints.'
- 'State-variable coupling caveat — SV:safety.cardiovascular_burden: the cited claims are `safety` and
  `clinical_harm`, neither of which can license a direction on a state variable (rule V16); the adverse
  events themselves are recorded on the compound record and in CLM:alphacognition:CHRM1:003 / :004'
