control_point_hypothesis:
  statement: 'CHRM1 encodes the M1 muscarinic acetylcholine receptor, the most abundant muscarinic subtype
    in hippocampus and forebrain, coupling cholinergic tone to cortical excitability and to the encoding-versus-retrieval
    balance. The seed hypothesis is that M1 signalling is a control point on working-memory capacity and
    on encoding of new material, so selective M1 agonism should raise both. CHRM1 is the ONLY target in
    this atlas with a randomised, placebo-controlled, healthy-adult human result on cognitive endpoints
    (CLM:...:CHRM1:001). It is also the target where the direction is least safe to assume: M1 germline
    deletion in mice IMPROVES some memory measures while impairing others (CLM:...:CHRM1:005), and the
    dose that produced a cognitive signal with an unselective muscarinic agonist is the dose that produced
    52% discontinuation (CLM:...:CHRM1:003).'
  proposed_modulation: increase_activity
  mechanism_chain:
  - CLM:alphacognition:CHRM1:001
  - CLM:alphacognition:CHRM1:002
  - CLM:alphacognition:CHRM1:005
