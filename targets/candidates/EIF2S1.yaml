control_point_hypothesis:
  statement: Phosphorylation of the eIF2 alpha subunit turns eIF2 into an inhibitor of its own exchange
    factor, arresting cap-dependent translation and thereby gating memory consolidation. The phosphorylation
    state, not the protein level, is the control variable, and learning itself lowers it in specific neuronal
    populations. The brake plausibly protects the cell under stress, which is why the downstream mechanism
    is only drug-accessible below a threshold of stress-response activation.
