control_point_hypothesis:
  statement: 'GRIN2B encodes the NMDA receptor GluN2B subunit, whose long channel open time and high calcium
    charge transfer set the coincidence-detection window for Hebbian plasticity. The seed hypothesis is
    that GluN2B-containing receptor availability is a rate-limiting control point on the threshold for
    plasticity, so raising it should lower that threshold and improve learning. The evidence assembled
    here supports that in rodents and CONTRADICTS the naive human extension: in humans, de novo GRIN2B
    variation of either functional direction produces a neurodevelopmental disorder with intellectual
    disability, and the human genetic association with cognitive ability is a single positional GWAS hit
    with no gene-level attribution.'
  proposed_modulation: context_dependent
  mechanism_chain:
  - CLM:alphacognition:GRIN2B:001
  - CLM:alphacognition:GRIN2B:002
  - CLM:alphacognition:GRIN2B:003
  - CLM:alphacognition:GRIN2B:004
