developmental_confound: high
developmental_confound_rationale: Three independent reasons. (1) Every rodent enhancement result here
  uses constitutive transgenic overexpression from development (CLM:...:GRIN2B:001, :002), so the adult
  phenotype may be a developmental consequence. (2) NMDA receptor subunit composition shifts with postnatal
  age, with GluN2B falling and GluN2A rising (CLM:...:GRIN2B:006, rodent and indirect), which is a mechanism
  by which GRIN2B's cognitive role could be largely spent by adulthood. (3) The human phenotype of GRIN2B
  perturbation is a neurodevelopmental encephalopathy with cortical malformation in some individuals (CLM:...:GRIN2B:004),
  i.e. the human evidence is entirely about development. The one adult-onset result (CLM:...:GRIN2B:003)
  acts through Cdk5, not through GRIN2B directly.
open_questions:
- Is GluN2B-containing receptor availability rate-limiting for plasticity in the ADULT human brain, or
  is the adult system GluN2A-dominated? No human developmental transcriptome was ingested in v0.1.
- The seizure and excitotoxicity liability of potentiating NMDA function is asserted from first principles
  here and is NOT backed by a claim in this atlas; Open Targets safetyLiabilities for GRIN2B (convulsions,
  dizziness, pain, with a PMID) were noted in docs/API_RECIPES.md §5.1 but not ingested by this agent.
  The red team or agent:integration should ingest them.
- 'No cell-type resolution: which adult human cell populations express GRIN2B is unknown here (deferred
  to docs/TASK_DAG.yaml Q003).'
- Is there any human evidence of GRIN2B variation in the normal range associating with cognitive ability
  at gene level rather than locus level? Not found in v0.1.
- 'State-variable coupling caveat — SV:safety.seizure_risk: potentiating NMDA receptor function is expected
  to lower the seizure threshold, i.e. raise seizure risk; asserted from pharmacological first principles
  and NOT supported by a claim in this atlas, which is why claim_refs is empty and the dossier''s open_questions
  names it'
