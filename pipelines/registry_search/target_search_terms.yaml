# Target-directed trial-registry search terms.
#
# WHY THIS FILE EXISTS
# --------------------
# Sprint 1 found that three atlases graded `human_intervention_evidence: 0` after
# LITERATURE-only searching. The power atlas, forced by resolution R11 to declare what it
# had actually searched, then ran registry searches and overturned two of its own
# published statements: it had asserted that no human klotho intervention and no human
# MCT1 intervention existed, and both were wrong. A registry holds interventions that
# were performed and never published, which is precisely the category a
# human-intervention facet depends on and precisely what a literature search cannot
# return.
#
# TERM PROVENANCE
# ---------------
# Search terms are not claims — a term either retrieves records or it does not — but
# where a term asserts a compound-target pairing, that pairing is sourced:
#
#   claim_derived              the pairing is already asserted by a claim in this
#                              repository, in evidence/claims/<atlas>/<SYMBOL>.yaml
#   intervention_record        the repository's intervention record links it via `targets`
#   repo_intervention_unlinked the compound is a registered intervention entity here and
#                              the owning atlas discusses it for this target, but no
#                              `targets` link was written
#   gene_symbol                the symbol itself; registries index some gene names in
#                              titles and descriptions
#   mechanism_class            a free-text pharmacological class phrase used purely as a
#                              retrieval heuristic, asserting nothing
#
# A target with no compound term is searched by symbol and mechanism class alone. If that
# returns nothing, the result is `no_trial_identified` — which is a statement about the
# registry, NOT a biological null, and is recorded as such.

schema_version: 0.2.0
created_by: agent:orchestrator
created_on: "2026-09-18"
registry: clinicaltrials_gov_v2

# Outcome-measure keywords used to decide whether a trial measured cognition at all.
# Deliberately broad on instruments and narrow on constructs: a trial that measured
# adaptive behaviour or symptom severity did not measure cognition, and conflating them
# is how "tested and null" gets manufactured out of "tested something else".
cognitive_endpoint_keywords:
  - cognit
  - neurocognit
  - neuropsycholog
  - memory
  - recall
  - recognition task
  - working memory
  - attention
  - executive function
  - processing speed
  - reaction time
  - intelligence
  - iq
  - learning
  - matrics
  - mccb
  - moca
  - mmse
  - adas-cog
  - cantab
  - wais
  - wisc
  - ravlt
  - digit span
  - stroop
  - trail making
  - verbal fluency
  - n-back

# Instruments that are NOT cognition, listed so the classifier does not count them.
# Vineland is adaptive behaviour; CGI and PANSS are clinical severity. A trial whose only
# "cognitive-sounding" outcome is one of these is `tested_wrong_endpoint`.
non_cognitive_lookalikes:
  - vineland
  - adaptive behavior
  - adaptive behaviour
  - clinical global impression
  - panss
  - cgi-
  - quality of life
  - caregiver burden

